    'Из сорока пяти учащихся седьмого «Б» класса до старости дожили только четверо.'], '134',
    S('1) Верно: «А ещё мы с детства играли в то, чем жили сами» (предложение 6).',
      '2) Неверно: «самолёт» — это фишка на классной карте, его «посадка» — оценка «плохо» за невыученное стихотворение (предложения 8–12).',
      '3) Верно: «Жаль только, что свобода эта порой оборачивается безмятежностью…» (предложение 31).',
      '4) Верно: «Мы были молоды, но жаждали не личного счастья, а личного подвига» (предложение 50).',
      '5) Неверно: до седых волос дожило девятнадцать человек (предложение 4); четверо — это оставшиеся в живых мальчики (предложение 18).'));

  set(22, '23-2', Q22, P(
    '(1)Однажды я ехал в электричке. (2)Сидевшая рядом со мной у окна скромно одетая сдержанная женщина открыла томик Чехова. (3)Дорога предстояла длинная, книжки я не захватил, люди вокруг были чужие, я стал думать о работе. (4)И тем же тоном, каким спрашивают, например: «Вы не знаете, скоро ли мы приедем?» – я неожиданно для себя и тем более для соседки спросил её:',
    '– Простите, вы не знаете, что такое счастье?',
    '(5)Женщина с томиком Чехова в руках оказалась замечательной собеседницей. (6)Она не стала спрашивать меня, отчего я задал такой странный вопрос, не стала с ходу отвечать, она прикрыла книгу и долго молчала, посматривая в окно, – думала. (7)Наконец, когда я совсем уже решил, что она забыла о вопросе, она повернулась ко мне и сказала…',
    '(8)Вернёмся к её ответу позже. (9)Спросим себя: что такое счастье? (10)Что кроется за этим словом?',
    '(11)В каждой стране есть свой Главный педагог – народ, и есть Главный учебник – язык. (12)Я не должен объяснять, что такое счастье, я должен смиренно спросить об этом наш язык – в нём всё есть, из него всё поймёшь, прислушиваясь к слову в сегодняшней нашей речи. (13)Народная мысль содержится не только в пословицах и поговорках, в народной мудрости, но и в распространённых, обычных фразах и оборотах речи. (14)Поищем: с какими другими словами сочетается интересующее нас понятие, почему так можно сказать, а так нельзя. (15)Это никогда не бывает случайным.',
    '(16)Мы говорим: «счастливая доля», «счастливый случай», «счастливая судьба», «счастье привалило», «вытянул счастливый билет».',
    '(17)Самые деятельные, всего достигшие своим трудом люди говорят: «Мне выпало счастье, мне дано счастье…»',
    '(18)Счастье – фортуна, судьба, о которой мы ничего не знаем, и если его нет, то говорят: «Такая уж у меня судьба», «Видно, мне так на роду написано».',
    '(19)Но мы не раз ещё столкнёмся с законом духовной жизни: всё, что есть в человеке, возникает из двух встречных движений, из двух сил: из движения, направленного от мира к человеку, и движения от человека к миру. (20)Противоположные эти силы, встречаясь в одной точке, не уничтожаются, а складываются. (21)Но если встреча не происходит, то обеих сил словно и не было. (22)Предположим, человеку нет удачи ни в чём, несчастья преследуют его, и выпала ему, быть может, от рождения тяжёлая доля. (23)Не всякий сумеет победить судьбу. (24)Но сильный человек умеет использовать самый незаметный шанс, который, конечно, есть в жизни каждого: он побеждает судьбу. (25)Вернее, не судьбу, а трудности, которые посланы ему судьбой. (26)И если нет собственного стремления победить, стремления к счастью, то хоть озолоти его – счастья не будет. (27)У него нет веры в жизнь, воля его сломлена. (28)Говорят: «нашёл своё счастье», «добыл счастье», «достиг счастья» и даже «украл чужое счастье». (29)Язык требует действия: нашёл, поймал, добыл, достиг, вырвал у судьбы своё счастье, всякий человек – кузнец своего счастья.',
    '(30)Человек должен стремиться к счастью. (31)Неукротимое, неудержимое, жгучее желание счастья… (32)Счастье не вещь, и не склад вещей, и не положение, и не денежное состояние, а состояние души, возникающее при достижении сильно желаемого. (33)Счастье – это благословенное состояние, благодать.',
    '(34)Что же, однако, сказала о счастье женщина в электричке? (35)Позже выяснилось, что она научный сотрудник, специалист в области химии белков. (36)После долгого обдумывания моего вопроса она сказала:',
    '– Я не могу дать определения счастья. (37)Вот учёный! (38)Учёный не тот, кто всё знает, а тот, кто точно знает, чего он не знает. (39)Но, может быть, так? (40)У человека есть духовные стремления: когда они удовлетворяются, он чувствует себя счастливым. (41)Похоже на правду?',
    '<i>(По С. Л. Соловейчику*)</i>',
    '<small>* Симон Львович Соловейчик (1930–1996) – публицист, педагог, философ. Главный труд его жизни – книга «Педагогика для всех», в которой он изложил принципы воспитания Свободного Человека.</small>'), [
    'Женщина в электричке не смогла дать ответ на интересующий рассказчика вопрос, потому что была учёным.',
    'Язык помогает находить ответы на сложные вопросы.',
    'По мнению рассказчика, счастье обусловлено судьбой, с которой не поспоришь, с которой нужно смириться.',
    'Человек должен стремиться к материальному благополучию, в этом, по мнению собеседницы рассказчика, и заключается неукротимое, неудержимое, жгучее желание счастья.',
    'Язык требует от человека деятельного отношения к жизни, желания бороться со всеми трудностями и победить.'], '25',
    S('1) Неверно: женщина дала ответ — «когда духовные стремления удовлетворяются, человек чувствует себя счастливым» (предложения 36–40).',
      '2) Верно: «Я должен смиренно спросить об этом наш язык – в нём всё есть, из него всё поймёшь» (предложение 12).',
      '3) Неверно: «Человек должен стремиться к счастью» (предложение 30), сильный человек побеждает судьбу (предложение 24).',
      '4) Неверно: «Счастье не вещь… и не денежное состояние, а состояние души» (предложение 32); собеседница говорит о духовных стремлениях (предложение 40).',
      '5) Верно: «Язык требует действия: нашёл, поймал, добыл, достиг…» (предложение 29).'));

  set(22, '23-3', 'Какие из высказываний не соответствуют содержанию текста? Укажите номера ответов.', P(
    '(1)Волжская ГЭС, Чебоксарская ГЭС. (2)Сколько лет гидроэлектростанциям и сколько Волге? (3)ГЭС – дело рук человеческих. (4)Мы помним строительство Волжской ГЭС, которая перегородила реку в Жигулях, как победно кричали об этом газетные заголовки… (5)Что ж, всё было правильно; страна вставала из руин Великой Отечественной; заводам, стройкам, городам требовалось электричество, много электричества, желательно более дешёвого. (6)Гидроэлектростанции, по убеждению учёных, давали нам его.',
    '(7)С годами на Волге возник целый каскад гидростанций. (8)Они и сейчас безотказно дают ток. (9)Они помогли нам сделать рывок к звёздам – запустить ракеты, овладеть атомом…',
    '(10)Всё так. (11)Из песни века, которую по праву можно назвать эпической, не выкинуть ни одного слова.',
    '(12)Не выкинуть и других слов… (13)Тех, которые слагались народом о прекрасной реке, о её красоте, о приволье её вод и плёсов. (14)Тех плёсов, какие видел Пушкин в окрестностях Козьмодемьянска, Свияжска, Васильсурска, Чебоксар, Симбирска и которых мы с вами сейчас не увидим. (15)Их нет. (16)Вода поднялась, разлилась, поглотила красоту. (17)И, кстати, заодно замедлила течение. (18)Иначе и не могло быть в непомерно разлившихся водохранилищах. (19)В них теперь нет того сильного, могучего течения, которое очищало бы реку от нынешнего вредного, застойного цветения.',
    '(20)Но это цветение – пусть извинит читатель за невольный каламбур – это только цветочки. (21)С Волгой стало происходить такое, о чём ни мы с вами, ни Пушкин, ни какой-нибудь другой писатель, одарённый воображением сказочника, и подумать не могли.',
    '(22)У слияния Суры с Волгой водная гладь поражает своей необозримостью. (23)За Васильсурском тоже рукотворное море. (24)Оно радует глаз, как радует его, как не может не радовать живая вода, разлившаяся привольно по земному лону.',
    '(25)Но эта вода не живая. (26)Она если и не мёртвая вовсе, то полумёртвая. (27)Здесь – в глубинах и на отмелях водохранилища. (28)В самом конце 80-х годов в нём запретили ловить рыбу. (29)Не для того, чтобы сберечь её стадо, дать нагуляться молоди… (30)А потому, что выловленная рыба стала опасной для человека. (31)Волжская сказочная рыба – стерлядь, осётр, судак. (32)Теперь она, набравшая за последние годы выше всякой нормы ртуть, отравлена.',
    '(33)Да может ли быть такая норма?',
    '(34)Ртуть вместе с другими – тоже не целебными – отходами сбрасывали в воду. (35)И вот концентрация ртути привела к катастрофе. (36)Пока, как сообщали газеты, лишь в бассейне водохранилища.',
    '(37)Что будет дальше?',
    '<i>(По И. Смольникову*)</i>',
    '<small>* Смольников Игорь Фёдорович (р. 1930) – русский писатель, поэт, литературный критик, публицист, автор разнообразных очерков и статей, посвящённых преимущественно литературе и изобразительному искусству.</small>'), [
    'После войны гидроэлектростанции нужны были нашей стране, чтобы получить дешёвое электричество.',
    'Материальные интересы человека зачастую мешают сохранению природы.',
    'Многочисленные водохранилища помогли спасти умирающую флору и фауну Волги.',
    'Гидроэлектростанции нанесли серьёзный ущерб экологии.',
    'По убеждению учёных, гидроэлектростанции не могли дать много дешёвого электричества.'], '35',
    S('Здесь нужно выбрать высказывания, которые НЕ соответствуют тексту.',
      '1) Соответствует: «заводам, стройкам, городам требовалось электричество… желательно более дешёвого» (предложение 5).',
      '2) Соответствует: ради электричества пожертвовали красотой и чистотой реки, в воду сбрасывали отходы (предложения 16–19, 34–35).',
      '3) <b>Не соответствует:</b> вода в водохранилищах «полумёртвая», рыба отравлена ртутью (предложения 25–32).',
      '4) Соответствует: течение замедлилось, вода «цветёт», рыба опасна для человека (предложения 17–19, 30–32).',
      '5) <b>Не соответствует:</b> «Гидроэлектростанции, по убеждению учёных, давали нам его» (предложение 6).'));

  set(22, '23-4', 'Какие из высказываний не соответствуют содержанию текста? Укажите номера ответов.', P(
    '(1)Бескорыстным и верным другом назвал книгу выдающийся русский писатель Леонид Леонов. (2)Кипой пыльной бумаги назвал книгу молодой программист в одной из недавних телепередач. (3)В его словах звучала ребяческая драчливость, ему, наверное, хотелось подразнить своей дерзостью примолкшую публику, и несколько восторженных поклонниц наградили молодого «смутьяна» аплодисментами. (4)Нет, я вовсе не собираюсь кряхтеть по поводу испортившихся нравов, я очень хорошо понимаю законы телевизионного ток-шоу, где эпатаж, шокирующая бравада нужны для того, чтобы придать пряный вкус скучноватым и банальным разговорам. (5)Мне показалось странным, до обидного странным, покорное, какое-то скорбно-похоронное молчание взрослой публики.',
    '(6)Мы как-то уж очень послушно согласились с тем, что книга безнадёжно устарела и теперь её место среди пыльных музейных экспонатов. (7)Сегодня нас окружают очень полезные и умные машины: микроволновые печи, пылесосы, домашние кинотеатры, холодильники… (8)Вся эта техника сделала жизнь человека более комфортной, освободила много времени. (9)Теперь не надо носить воду из колодца, не надо выжимать выстиранное бельё, не надо ехать на другой конец города, чтобы посмотреть нашумевший фильм! (10)Всё рядом, почти любое желание моментально, как по мановению волшебной палочки, может быть исполнено лёгким движением руки. (11)И на фоне этих модных машин, утыканных кнопочками, тумблерами, мигающими лампочками, тугая стопка сшитой бумаги многим кажется чем-то архаичным, каким-то нелепым рудиментом, который случайно уцелел в бурных потоках прогресса.',
    '(12)Нет, книга не стала хуже, она по-прежнему исполняет своё назначение, она так же терпеливо и доброжелательно учит человека, бескорыстно передаёт ему бережно собранную нашими предками мудрость. (13)Зато мы изменились, мы возомнили себя обладателями каких-то несметных богатств, покорителями каких-то недосягаемых духовных высот… (14)А на самом деле мы просто даём дурачить себя: нам внушили, что модное – это и есть необходимое, что всё новое лучше того, что было прежде. (15)Вот поставили вы в своей квартире компьютер – дорогущий, весь опутанный проводами прибор, который то и дело капризничает, постоянно требует для своего обслуживания специалиста… (16)И что? (17)Какие реальные преимущества имеет этот громоздкий, ненадёжный агрегат перед книгой – этим компактным, дешёвым, всегда доступным устройством, которое никогда не даёт сбоев, не «глючит», не ломается, которое не требует для своего обслуживания инженера, которое нуждается только в умном, внимательном и доброжелательном собеседнике?',
    '(18)Я не ретроград, не зову в первобытное прошлое, не считаю, что людям в проветриваемой пещере живётся лучше, чем в панельном доме! (19)Я говорю о духовной бдительности, о том, что мы часто даём себя легко обмануть. (20)Ладно, когда этот «обман» касается только нашего кошелька. (21)Обидно, когда мы обманываем свою душу, когда мы обкрадываем сами себя, когда мы честного и бескорыстного друга меняем на самодовольного и нечистого на руку приятеля.',
    '<i>(По И. Косолапову*)</i>',
    '<small>* Косолапов Игорь Петрович – современный публицист.</small>'), [
    'Компьютер проигрывает книге в простоте и надёжности.',
    'Прогресс опустошает душу человека, поэтому необходимо вернуться в прошлое, когда человек жил в единстве с природой.',
    'Появление техники не сделало жизнь человека более комфортной.',
    'Современная техника сама по себе не может сделать человека более духовным.',
    'Книга и в наше время не утратила своего высокого значения в духовной жизни общества.'], '23',
    S('Здесь нужно выбрать высказывания, которые НЕ соответствуют тексту.',
      '1) Соответствует: книга — «компактное, дешёвое, всегда доступное устройство, которое никогда не даёт сбоев» (предложение 17).',
      '2) <b>Не соответствует:</b> «Я не ретроград, не зову в первобытное прошлое…» (предложение 18).',
      '3) <b>Не соответствует:</b> «Вся эта техника сделала жизнь человека более комфортной» (предложение 8).',
      '4) Соответствует: автор говорит о духовной бдительности, о том, что модное не значит необходимое (предложения 14, 19).',
      '5) Соответствует: «книга не стала хуже, она по-прежнему исполняет своё назначение» (предложение 12).'));

  /* ---------- папка 24 (типы речи) → №23 сайта ---------- */
  set(23, '24-1', 'Какие из перечисленных утверждений являются верными? Укажите все номера ответов.', P(
    '(1)У бабушки доброта была гармоничная и умиляла. (2)У жившей с нею тёти Анны доброта эта переходила всякие пределы и больше раздражала.',
    '(3)Худая, с птичьим личиком, с медленно-степенными движениями, она была учительницей музыки. (4)У неё учились музыке сёстры и все наши знакомые барышни. (5)За уроками лицо её было строго, серьёзно и торжественно. (6)Но учительница она была очень плохая. (7)Всем её ученицам, сколько-нибудь способным, приходилось потом переучиваться. (8)У неё самой рояль был плохонький и звучал, как слабо натянутый барабан. (9)Я никогда не слышал, чтоб она сама что-нибудь играла, – только кадрили и польки, когда мы танцевали.',
    '(10)Всегда она была в хлопотах. (11)Всегда у неё было какое-нибудь ужасно бедное семейство, которое нужно было накормить, страшно несчастный человек, которого нужно было пристроить. (12)Она обходила знакомых, собирала деньги, выпрашивала место. (13)Собранные деньги главою несчастного семейства пропивались; несчастный человек, получивший место, оказывался прохвостом или пропойцей. (14)И уже давно никто не верил рекомендациям тёти Анны.',
    '(15)Несчастие другого человека не давало ей покоя, не давало жить. (16)Вернее, даже не так, а вот как: свою жажду помощи её тянуло утолить так же неодолимо и настойчиво, как пьяницу тянет к вину. (17)Когда она знала, что денег не пожертвуют, она просила ссудить определённую сумму на время.',
    '– (18)Дайте мне взаймы двадцать рублей, – просила она. (19)Через три дня я получу в женском епархиальном училище за уроки музыки и отдам.',
    '– (20)Ну смотрите, только на три дня даю! (21)Если не отдадите, поставите меня в безвыходное положение.',
    '– (22)Ну конечно же, отдам!',
    '(23)И не отдавала. (24)Не потому, что не хотела, а просто не донесла. (25)Встретилось новое горе – и отдала туда. (26)Резкие письма с упрёками и прямыми оскорблениями, грозные требования, тяжёлые объяснения с клятвами сейчас же отдать при первой возможности, озлобленно-виноватые глаза, боязнь встретиться на улице… (27)А завтра опять то же самое. (28)Вся она была в долгах, всё у неё было заложено, ростовщикам платила ужасные проценты.',
    '(29)При жизни бабушки ей всё-таки приходилось несколько сдерживаться. (30)Но когда бабушка умерла и домик перешёл в её владение, тётя Анна совсем запуталась. (31)Домик сейчас же был заложен, потом перезаложен. (32)Деньги немедленно уплыли. (33)А заработок её всё уменьшался. (34)Появились другие учительницы музыки, более молодые и талантливые, уроков становилось всё меньше.',
    '(35)Под конец жизни тётя Анна жила в большой нужде в своём доме, приходившем всё в большее разрушение. (36)Сарай грозил обрушиться, подгнившие перемёты еле держались. (37)Но тётя доказывала, что это не опасно: дверь открывается внутрь и поддержит перемёт, если он обвалится в то время, когда в сарае человек. (38)Помогать ей было так же трудно и бесплодно, как запойному пьянице. (39)Пошлёшь ей к празднику пятьдесят рублей. (40)Через некоторое время придёт ответ. (41)«Милый Витя! (42)Большое тебе спасибо за присланные деньги. (43)На рубль я купила себе конфет. (44)Пять рублей дала на праздники Козловым. (45)Купила башмаки Лидочке Лочагиной, – они у ней совсем дырявые, и она постоянно простужается». (46)Далее всё в таком же роде. (47)И в заключение: «Вот видишь, скольким людям ты доставил радость присланными деньгами».',
    '(48)Меня это, признаюсь, нисколько не радовало.',
    '<i>(По В. В. Вересаеву*)</i>',
    '<small>* Викентий Викентьевич Вересаев (1867–1945 гг.) – русский писатель.</small>'), [
    'Предложение 1 противопоставлено предложению 2.',
    'В предложениях 3–5 есть элементы описания.',
    'В предложениях 18–22 представлено рассуждение.',
    'В предложениях 29–30 представлено повествование.',
    'Предложение 48 развивает мысль из предложения 47.'], '124',
    S('1) Верно: доброта бабушки «гармоничная и умиляла», доброта тёти Анны «переходила всякие пределы и больше раздражала» — смысловое противопоставление.',
      '2) Верно: в предложениях 3 и 5 даны портретные признаки тёти Анны (худая, с птичьим личиком; лицо строго, серьёзно) — элементы описания.',
      '3) Неверно: предложения 18–22 — диалог о деньгах, передано конкретное речевое событие, а не цепь «тезис — доказательства — вывод».',
      '4) Верно: события сменяют друг друга во времени (при жизни бабушки… когда бабушка умерла… совсем запуталась).',
      '5) Неверно: предложение 48 не развивает, а противопоставлено мысли тёти Анны о радости («Меня это… нисколько не радовало»).'));

  /* ---------- папка 25 (лексикология и фразеология) → №24 сайта ---------- */
  word(24, '25-1', 'Из предложений 36–42 выпишите слово со значением «уволиться с военной службы в запас».', T_VASILIEV, ['демобилизовался', 'демобилизоваться'],
    S('В предложении 40 «Пока не демобилизовался» глагол «демобилизовался» означает «уволился с военной службы в запас».',
      'Военный контекст подтверждают соседние предложения: рассказчик пятнадцать лет носил военную форму (39), а потом форма «была уже иной» (41).'));
  word(24, '25-2', 'Из предложений 20–23 выпишите синонимы (синонимическую пару).', TXT('23-2'), ['долясудьбу', 'судьбудоля', 'долясудьба', 'судьбадоля'],
    S('«Доля» (предложение 22) — жизненный удел, выпавшая человеку участь; «судьбу» (предложение 23) — жизненный путь, предопределённый обстоятельствами.',
      'Это существительные, близкие по значению в контексте: «тяжёлая доля» ≈ «тяжёлая судьба». Записываем так, как в тексте: «долясудьбу».'));
  word(24, '25-3', 'Подберите один синоним к слову ВРАСПЛОХ (предложение 4). Запишите этот синоним.', P(
    '(1)Вот и кончился последний урок последнего дня нашей школьной жизни. (2)Десять школьных лет завершились по знакомой хрипловатой трели звонка. (3)Все мы, растроганные, взволнованные, радостные и о чём-то жалеющие, растерянные и смущённые своим мгновенным превращением из школяров во взрослых людей, слонялись по классам и коридору, словно страшась выйти из школьных стен в мир, ставший бесконечным. (4)И было такое чувство, будто что-то недоговорено, недожито, не исчерпано за прошедшие десять лет, будто этот день застал нас врасплох.',
    '(5)В класс заглянула Женя Румянцева:',
    '– Серёжа, можно тебя на минутку? (6)У меня странное предложение! (7)Давай встретимся через десять лет!',
    '(8)Шутливость совсем не была свойственна Жене, и я спросил серьёзно:', '– Зачем?',
    '– (9)Мне интересно, каким ты станешь. (10)Ты ведь очень нравился мне все эти годы. (11)Я думал, что Жене Румянцевой неведомы ни эти слова, ни эти чувства. (12)Жизнь её протекала в двух сферах: в напряжённой общественной работе и в мечтаниях о звёздных мирах. (13)Немногие из нас твёрдо определили свой дальнейший жизненный путь, а Женя с шестого класса знала, что будет астрономом и никем другим. (14)Между нами никогда не было дружеской близости. (15)В поисках разгадки я мысленно пробегал прошлое, но ничего не нашёл в нём, кроме одной встречи на Чистых прудах…',
    '(16)Однажды мы собирались в выходной день на Химкинское водохранилище покататься на лодках. (17)Но с утра заморосил дождь, и на сборный пункт пришли только мы с Павликом, Нина и Женя Румянцева. (18)Дождь не переставал ни на минуту. (19)Нечего было и думать о Химках.',
    '– (20)Давайте покатаемся на пруду, – предложил я и показал на старую, рассохшуюся лодку-плоскодонку. – (21)Будем воображать, что мы в Химках.',
    '– (22)Или в Средиземном море, – вставил Павлик.', '– (23)Или в Индийском океане, – восторженно подхватила Женя.',
    '(24)Мы вычерпали из лодки воду и отправились в «кругосветное» плавание. (25)Женя придумывала маршрут нашего путешествия. (26)Вот мы проходим Босфор, через Суэцкий канал попадаем в Красное море, оттуда в Аравийское и входим в Тихий океан. (27)Женя неутомимо командовала: «Право руля!», «Лево руля!», «Поднять паруса!», «Убрать паруса!» (28)Отыскивала путь по звёздам: наш компас разбился во время бури.',
    '(29)Больше Женя не бывала с нами. (30)Мы не раз приглашали её на наши сборища, но она отказывалась. (31)А что если в тот единственный раз она пришла из-за меня и из-за меня отступилась, сказав себе с гордой честностью: не вышло…',
    '– (32)Почему же ты раньше молчала, Женя? – спросил я. (33)К чему было говорить? (34)Тебе так нравилась Нина!',
    '(35)С ощущением какой-то досадной и грустной утраты я сказал:', '– Где же и когда мы встретимся?',
    '– (36)Через десять лет, двадцать девятого мая, в восемь часов вечера, в среднем пролёте между колонн Большого театра.',
    '(37)Минули годы. (38)Женя училась в Ленинграде. (39)Зимой 1941 года, жадно ловя известия о судьбе моих друзей, я узнал, что Женя в первый же день войны бросила институт и пошла в лётную школу. (40)Летом 1944 года я услышал по радио указ о присвоении майору авиации Румянцевой звания Героя Советского Союза. (41)Вернувшись с войны, я узнал, что звание Героя было присвоено Жене посмертно.',
    '(42)Жизнь шла дальше, порой я вдруг вспоминал о нашем уговоре, а за несколько дней до срока почувствовал такое острое, щемящее беспокойство, будто все прошедшие годы только и готовился к этой встрече. (43)Я поехал к Большому театру, купил у цветочницы ландыши и пошёл к среднему пролёту между колонн Большого театра. (44)Я постоял там немного, затем отдал ландыши какой-то худенькой сероглазой девушке и поехал домой…',
    '(45)Мне хотелось на миг остановить время, оглянуться на себя, на прожитые годы, вспомнить Женю, лодку, дождик, вспомнить слепоту своей юношеской души, так легко прошедшей мимо того, что могло бы стать судьбой.',
    '<i>(По Ю. М. Нагибину*)</i>',
    '<small>* Юрий Маркович Нагибин (1920–1994) – русский советский писатель-прозаик, журналист и сценарист.</small>'), ['внезапно', 'неожиданно'],
    S('«Врасплох» в сочетании «застал нас врасплох» значит: день наступил неожиданно, без подготовки.',
      'Подходят наречия «внезапно» и «неожиданно»: «этот день застал нас неожиданно». Синоним здесь подбирают самостоятельно, а не ищут в тексте.'));

  /* ---------- папка 26 (средства связи предложений) → №25 сайта ---------- */
  nums(25, '26-1', 'Среди предложений 22–26 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи лексического повтора. Напишите номер(-а) этого(-их) предложения(-ий).', T_VASILIEV, [25], [22, 26],
    S('Лексический повтор — повтор одного и того же слова в одной и той же форме в соседних предложениях.',
      '(25) «<b>Уступают</b> юноши и девушки, очень похожие на вас, ребята». Сказуемое «уступают» повторяет «уступают» из предложения 24 в той же форме.'));
  nums(25, '26-2', 'Среди предложений 11–18 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью указательного местоимения. Напишите номер(-а) этого(-их) предложения(-ий).', TXT('23-2'), [15], [11, 18],
    S('Указательные местоимения — «этот», «тот», «такой», «таков», «столько» и их формы, отсылающие к уже названному предмету или мысли.',
      '(15) «<b>Это</b> никогда не бывает случайным». «Это» обобщает высказывание 14 о сочетаемости слов и связывает предложения.'));
  nums(25, '26-3', 'Среди предложений 12–19 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью личного местоимения. Напишите номер(-а) этого(-их) предложения(-ий).', TXT('23-3'), [15, 19], [12, 19],
    S('Личные местоимения — «я», «ты», «он», «она», «оно», «мы», «вы», «они» и их падежные формы, заменяющие названное лицо или предмет. Важно различать: «вижу его» (кого?) — личное, «его книга» (чья?) — притяжательное.',
      '(15) «<b>Их</b> нет» — «их» (нет чего? плёсов) заменяет «плёсов» из предложения 14.',
      '(19) «В <b>них</b> теперь нет того сильного, могучего течения…» — «них» (в чём? в водохранилищах) заменяет «водохранилищах» из предложения 18.'));
  nums(25, '26-4', 'Среди предложений 18–23 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи вводного слова и однокоренных слов. Напишите номер(-а) этого(-их) предложения(-ий).', P(
    '(1)Мысль о том, трус ли я, – одна из самых острых, укоряющих мыслей моего детства. (2)Именно она впервые поставила меня лицом к лицу с самим собою. (3)Этот взгляд со стороны, иногда оправдывающий, но чаще осуждающий, неизменно помогал мне перед лицом решений, грозивших бедой – бедой, от которой нетрудно было ускользнуть, принимая эти казавшиеся почти естественными решения.',
    '(4)Мы играли во дворе, прыгая через планку, поднимая её всё выше. (5)Потом стали прыгать с мусорного ящика – и прыгнули все, кроме меня, даже восьмилетний Боря. (6)Саша сказал, что я трус, и, возможно, это было действительно так.',
    '(7)Я боялся гусей, ещё больше я боялся петухов, в особенности после того, как один из них сел мне на голову и чуть не клюнул, как царя Додона. (8)Правда, недавно я переплыл речку, но храбро ли я её переплыл? (9)Нет. (10)Так боялся утонуть, что потом целый день еле ворочал языком. (11)Значит, это была храбрость от трусости?',
    '(12)Странно, но я, по-видимому, был способен на храбрость. (13)Прочитав, например, о Муции Сцеволе, положившем руку на пылающий жертвенник, чтобы показать своё презрение к пыткам и смерти, я сунул в кипяток палец и продержал почти десять секунд. (14)Но я всё-таки испугался, потому что палец стал похож на рыбий пузырь.',
    '(15)Словом, похоже было, что я всё-таки трус. (16)А «от трусости до подлости один шаг», как сказала мама. (17)Когда я не спрыгнул с крышки мусорного ящика, она посоветовала мне сознаться, что я струсил, потому что человек, который способен сознаться, ещё может впоследствии стать храбрецом.',
    '(18)Потом я прочёл «Севастопольские рассказы» Толстого и решил, что он написал их только потому, что ему хотелось доказать себе и отчасти другим, что он не трус. (19)Иначе он не стал бы утверждать, что на войне боятся почти все, и в том числе храбрые люди. (20)Опасность или даже только мысль об опасности делала человека трусом, но та же мысль могла сделать его храбрецом. (21)Значит, трусость зависит от того, как к ней относиться? (22)Я запутался, размышляя о том, трус я или нет, хотя меня немного успокаивала мысль, что запутался, в сущности, и Толстой. (23)Так или иначе, к трусам относились с презрением. (24)Я тоже относился к ним с презрением, и брат сказал, что это очень важно.',
    '– (25)Следовательно, – сказал он, – в тебе всё-таки есть зачатки храбрости, которые надо развить, пока не поздно.',
    '(26)Прошло несколько лет, и я понял, что, кроме физической храбрости, есть и другая, нравственная, которую нельзя воспитать, ныряя под плоты или прыгая с берега на сосну с опасностью для жизни.',
    '(27)Это было в третьем классе. (28)Алька Гирв нагрубил нашему учителю, и тот велел ему стоять всю большую перемену у стенки в коридоре, а нам – не разговаривать с ним и даже не подходить. (29)Алька стоял, как у позорного столба, и презрительно улыбался. (30)Он окликнул ребят из класса, но те прошли, разговаривая, – притворились, подлецы, что не слышат. (31)Мне стало жалко, и я вдруг подошёл к нему, заговорив с ним как ни в чём не бывало.',

  function pickNum(S, P) {
    const st = S.settings;
    const list = st.mode === 'all' ? allNums(st.subject) : st.nums.slice().sort((a, b) => a - b);
    if (st.mode !== 'all' && st.order === 'seq') return list[(S.round - 1) % list.length];
    let c = list.filter((x) => x !== P.lastNum);
    if (!c.length) c = list;
    return c[Math.floor(Math.random() * c.length)];
  }

  function startRound(S, P) {
    S.round++;
    let t = null, num = pickNum(S, P);
    for (let i = 0; i < 5 && !t; i++) {
      try { t = E.make(num, subjOfState(S)); } catch (e) { num = pickNum(S, P); }
    }
    P.lastNum = num;
    P.task = t;
    P.answers = {};
    S.task = { num, gid: t.gid, text: t.text, svg: t.svg || '', type: t.type, source: t.source, anyLen: !!t.anyLen, len: (t.type === 'digits' || t.type === 'digitset') && !t.anyLen ? String(t.answer).length : 0 };
    S.phase = 'question';
    S.deadline = S.settings.time ? Date.now() + S.settings.time * 1000 : 0;
    S.result = null;
    roles(S).forEach((r) => { S.players[r].answered = false; S.players[r].ready = false; });
  }

  function submitAnswer(S, P, role, value) {
    if (S.phase !== 'question' || !inGame(S, role) || S.players[role].answered) return false;
    const grace = role !== 'host' ? GRACE : 400;
    if (S.deadline && Date.now() > S.deadline + grace) return false;
    P.answers[role] = { value: String(value).slice(0, 200) };
    S.players[role].answered = true;
    if (active(S).every((r) => S.players[r].answered)) finishRound(S, P);
    return true;
  }

  function finishRound(S, P) {
    if (S.phase !== 'question') return;
    const t = P.task;
    const v = {}, h = { round: S.round, num: t.num };
    active(S).forEach((r) => {
      const a = P.answers[r];
      const ok = a ? E.check(t, a.value) : false;
      v[r] = { value: a ? a.value : null, ok, timeout: !a };
      if (!ok && S.settings.lives) S.players[r].lives = Math.max(0, S.players[r].lives - 1); // при безлимите жизни не тратятся
      h[r] = ok;
    });
    if (isTrio(S) && S.settings.lives) active(S).forEach((r) => { if (S.players[r].lives <= 0) { S.players[r].out = true; S.players[r].outRound = S.round; } });
    S.history.push(h);
    S.result = { answer: E.answerText(t), short: t.short, full: t.full, v };
    S.deadline = 0;
    roles(S).forEach((r) => { S.players[r].ready = false; });
    const alive = isTrio(S) ? active(S) : roles(S).filter((r) => !S.settings.lives || S.players[r].lives > 0);
    const lastRound = S.settings.rounds && S.round >= S.settings.rounds;
    if (isSolo(S)) {
      if (!alive.length) { S.phase = 'over'; S.reason = 'lives'; }
      else if (lastRound) { S.phase = 'over'; S.reason = 'rounds'; }
      else S.phase = 'result';
    } else if (alive.length < 2) {
      S.phase = 'over'; S.reason = 'lives'; S.winner = alive.length ? alive[0] : isTrio(S) ? roundsWinner(S) : 'draw';
    } else if (lastRound) {
      // все раунды сыграны: побеждает тот, у кого больше жизней, затем — больше верных ответов
      S.phase = 'over'; S.reason = 'rounds'; S.winner = roundsWinner(S);
    } else S.phase = 'result';
  }

  function roundsWinner(S) {
    if (isTrio(S)) { const st = standings(S); return st.length > 1 && st[1].place === 1 ? 'draw' : st[0].r; }
    const H = S.players.host, G = S.players.guest;
    if (S.settings.lives && H.lives !== G.lives) return H.lives > G.lives ? 'host' : 'guest';
    const ok = (r) => S.history.filter((h) => h[r]).length;
    const a = ok('host'), b = ok('guest');
    if (a !== b) return a > b ? 'host' : 'guest';
    return 'draw';
  }
  const roundsWord = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'раунд' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'раунда' : 'раундов');
  const roundsLabel = (r) => (r ? r + ' ' + roundsWord(r) : 'без ограничения');
  const livesLabel = (n) => (n ? n + ' ' + livesWord(n) : 'безлимит жизней');

  function setReady(S, P, role) {
    if (!S.players[role]) return;
    if (S.phase === 'ready' || S.phase === 'result') {
      if (isTrio(S) && !inGame(S, role)) return;
      S.players[role].ready = true;
      const need = isSolo(S) ? ['host'] : isTrio(S) ? active(S) : ['host', 'guest'];
      if (need.every((r) => S.players[r] && S.players[r].ready)) startRound(S, P);
    } else if (S.phase === 'over' && S.reason !== 'leave' && S.reason !== 'quit') {
      S.players[role].ready = true; // хочет реванш
      if (roles(S).every((r) => S.players[r].ready)) {
        E.resetMemory();
        roles(S).forEach((r) => { S.players[r].lives = S.settings.lives; S.players[r].out = false; S.players[r].outRound = 0; });
        S.history = []; S.round = 0; S.winner = null; S.reason = null; S.gameNo = (S.gameNo || 1) + 1;
        startRound(S, P);
      }
    }
  }

  function checkTimeout(S, P, isHost) {
    if (S.phase !== 'question' || !S.deadline) return false;
    const extra = isHost && !isSolo(S) ? GRACE : 150;
    if (Date.now() > S.deadline + extra) { finishRound(S, P); return true; }
    return false;
  }

  /* ======================================================================
     СЕССИИ: соло / хозяин / гость
     ====================================================================== */
  function myRole() { return app.game ? app.game.me : 'host'; }

  function commit() {
    const g = app.game;
    if (!g) return;
    if (g.mode === 'solo') {
      sess.set('egeduel:solo', { S: g.S, P: g.P });
    } else if (g.mode === 'host') {
      g.S.seq++;
      g.S.now = Date.now();
      if (g.link) { g.link.send('state', g.S, { retain: true }); sendSpec(g); }
      store.set('egeduel:host:' + g.S.code, { S: g.S, P: g.P, t: Date.now() });
    }
    render();
  }

  // Канал для зрителей: ответ, разбор и ответы игроков ещё до конца раунда.
  // Игроки на него не подписываются — в общем состоянии этих данных нет.
  function sendSpec(g) {
    const S = g.S, P = g.P;
    if (S.phase !== 'question' || !P || !P.task) return;
    const t = P.task, ans = {};
    Object.keys(P.answers || {}).forEach((r) => {
      const a = P.answers[r];
      let ok = false;
      try { ok = !!E.check(t, a.value); } catch (e) {}
      ans[r] = { value: a.value, ok };
    });
    let answer = '';
    try { answer = E.answerText(t); } catch (e) {}
    const s = JSON.stringify({ gameNo: S.gameNo || 1, round: S.round, answer, short: t.short || '', ans });
    if (s === g.specSent) return;
    g.specSent = s;
    g.link.send('spec', s, { retain: true });
  }

  // ---- соло ----
  function startSolo() {
    const st = validSettings(draft('solo'));
    if (!st) return;
    E.resetMemory();
    const S = newState(st, app.name || 'Вы', null);
    const P = {};
    app.game = { mode: 'solo', me: 'host', S, P, ui: {} };
    sess.set('egeduel:active', { mode: 'solo' });
    startRound(S, P);
    app.tab = 'solo';
    commit();
    window.scrollTo(0, 0);
  }

  // ---- хозяин ----
  async function createRoom(trio) {
    trio = trio === true;
    const st = validSettings(draft(trio ? 'trio' : 'duel'));
    if (!st) return;
    if (trio) st.size = 3;
    commitFirstNick();
    if (!app.name.trim()) { toast('Придумайте никнейм'); $('#name-duel') && $('#name-duel').focus(); return; }
    app.busy = true; render();
    let link;
    try {
      link = await Net.host(onConn);
    } catch (e) {
      app.busy = false; render();
      toast(e && e.message === 'nolib' ? 'Не загрузилась библиотека связи. Проверьте интернет.' : 'Не удалось подключиться к серверу. Проверьте интернет и попробуйте ещё раз.');
      return;
    }
    app.busy = false;
    E.resetMemory();
    const S = newState(st, app.name.trim(), link.code);
    app.game = { mode: 'host', me: 'host', S, P: { pids: {} }, link, ui: {}, oppOnline: false, trio, online: {}, profiles: {} };
    bindHost(link);
    sess.set('egeduel:active', { mode: 'host', code: link.code });
    commit();
    if (!trio) sendPendingInvite(link.code);
  }

  function bindHost(link) {
    const g = app.game;
    g.online = g.online || {}; g.profiles = g.profiles || {};
    if (!g.P.pids) g.P.pids = {};
    link.on('g2h', (m) => onGuestMsg(m));
    roles(g.S).forEach((r) => { if (r !== 'host') watchPresence(g, g.S.players[r].pub); });
    // визитки гостей (хозяин сам их публикует; после перезагрузки страницы берём сохранённые)
    ['guest', 'guest2'].forEach((r) => link.on('profile/' + r, (p) => { if (p && typeof p === 'object' && !g.profiles[r]) { g.profiles[r] = Profile.sanitize(p); render(); } }));
    link.send('profile/host', Profile.shared(), { retain: true });
  }

  // «в сети» для гостя с публичным id pub
  function watchPresence(g, pub) {
    if (!pub) return;
    g.watched = g.watched || {};
    if (g.watched[pub]) return;
    g.watched[pub] = true;
    g.link.on('presence/g_' + pub, (v) => {
      if (app.game !== g || !g.S) return;
      const r = roleByPub(g.S, pub);
      if (!r) return;
      g.online[r] = v === '1';
      if (g.mode === 'host' && r === 'guest' && !isTrio(g.S)) g.oppOnline = g.online[r];
      render();
    });
  }

  // трио: игрок вышел из комнаты
  function trioLeave(S, P, role) {
    const p = S.players[role];
    if (!p) return;
    const g = app.game;
    if (S.phase === 'lobby' || S.phase === 'ready') {
      // игра ещё не началась — место освобождается
      S.players[role] = null;
      if (P.pids) delete P.pids[role];
      if (g && g.profiles) delete g.profiles[role];
      S.phase = 'lobby';
      roles(S).forEach((r) => { S.players[r].ready = false; });
      return;
    }
    p.left = true; p.ready = false;
    if (S.phase === 'over') return;
    const alive = active(S);
    if (alive.length < 2) { S.phase = 'over'; S.deadline = 0; S.reason = 'leave'; S.winner = alive.length ? alive[0] : roundsWinner(S); }
    else if (S.phase === 'question' && alive.every((r) => S.players[r].answered)) finishRound(S, P);
    else if (S.phase === 'result' && alive.every((r) => S.players[r].ready)) startRound(S, P);
  }

  function onGuestMsg(m) {
    const g = app.game;
    if (!g || g.mode !== 'host' || !m || typeof m !== 'object') return;
    const S = g.S, P = g.P;
    if (m.type === 'ping') { g.link.send('h2g', { type: 'pong', t: m.t, h: Date.now(), pub: m.pub }, { qos: 0 }); return; }
    if (!P.pids) P.pids = {};
    const roleOf = (pid) => (pid ? ALL_ROLES.find((r) => r !== 'host' && S.players[r] && P.pids[r] === pid) : null) || null;
    if (m.type === 'join') {
      const pub = String(m.pub || '');
      if (!/^[A-Z0-9]{8}$/.test(pub) || typeof m.pid !== 'string') return;
      const accept = (r) => {
        const p = Profile.sanitize(m.profile) || Profile.fallback(String(m.name || 'Соперник'));
        g.profiles[r] = p;
        g.link.send('profile/' + r, p, { retain: true });
        g.online[r] = true;
        if (!isTrio(S)) g.oppOnline = true;
      };
      let role = roleOf(m.pid);
      if (!role && S.phase === 'lobby') {
        role = seats(S).find((r) => r !== 'host' && !S.players[r]);
        if (!role) return;
        S.players[role] = { pub, name: String(m.name || 'Соперник').slice(0, 24), lives: S.settings.lives, answered: false, ready: false };
        P.pids[role] = m.pid;
        accept(role);
        watchPresence(g, pub);
        if (seats(S).every((r) => S.players[r])) S.phase = 'ready';
        toast(S.players[role].name + ' в игре!');
        commit();
      } else if (role) {
        accept(role);
        commit(); // повторное подключение — просто отправим состояние
      }
      return;
    }
    const role = roleOf(m.pid);
    if (!role) return;
    if (m.type === 'answer' && m.round === S.round) { submitAnswer(S, P, role, m.value); commit(); }
    else if (m.type === 'ready' && m.round === S.round) { setReady(S, P, role); commit(); }
    else if (m.type === 'leave' && isTrio(S)) {
      const nm = S.players[role].name;
      trioLeave(S, P, role);
      toast(nm + ' вышел(а) из комнаты');
      commit();
    }
    else if (m.type === 'leave') {
      if (S.phase !== 'over') {
        S.phase = 'over';
        if (S.settings.lives) { S.winner = 'host'; S.reason = 'leave'; }
        else { S.winner = roundsWinner(S); S.reason = 'stop'; S.stopBy = 'guest'; } // безлимит жизней: итог по верным ответам
      }
      else S.reason = S.reason || 'left';
      g.oppLeft = true;
      commit();
    }
  }

  // ---- гость ----
  async function joinRoom(codeRaw, quiet) {
    const code = Net.normCode(codeRaw);
    app.joinCode = code;
    if (!Net.validCode(code)) { if (quiet) { sess.del('egeduel:active'); return; } app.joinError ='Код комнаты — 6 символов, например 2K7MQX.'; render(); return; }
    commitFirstNick();
    if (!app.name.trim()) { app.joinError = 'Придумайте никнейм.'; render(); return; }
    app.joinError = ''; app.busy = true; render();
    const prev = sess.get('egeduel:active', {}) || {};
    const pid = prev.code === code && prev.pid ? prev.pid : Net.rid(12);
    const pub = prev.code === code && prev.pub ? prev.pub : Net.rid(8);
    let link;
    try { link = await Net.join(code, onConn, 'g_' + pub); }
    catch (e) {
      app.busy = false;
      app.joinError = e && e.message === 'nolib' ? 'Не загрузилась библиотека связи. Проверьте интернет.' : e && e.message === 'badcode' ? 'Неверный код комнаты.' : 'Не удалось подключиться к серверу. Проверьте интернет.';
      render(); return;
    }
    const g = { mode: 'guest', me: null, S: null, link, pid, pub, ui: {}, offset: 0, bestRtt: Infinity, oppOnline: true, joined: false, trio: app.tab === 'trio', online: {}, profiles: {}, quiet: !!quiet };
    app.game = g;
    sess.set('egeduel:active', { mode: 'guest', code, pid, pub });
    link.on('state', (S) => onState(S));
    link.on('h2g', (m) => {
      if (m && m.type === 'pong' && m.pub === pub) {
        const now = Date.now(), rtt = now - m.t;
        if (rtt < g.bestRtt + 30) { g.bestRtt = Math.min(g.bestRtt, rtt); g.offset = m.h - (m.t + rtt / 2); }
      }
    });
    link.on('presence/host', (v) => { g.oppOnline = v === '1'; g.online.host = g.oppOnline; render(); });
    ALL_ROLES.forEach((r) => link.on('profile/' + r, (p) => { if (p && typeof p === 'object') { g.profiles[r] = Profile.sanitize(p); render(); } }));
    const sendJoin = () => link.send('g2h', joinMsg(g));
    sendJoin();
    let n = 0;
    g.joinTimer = setInterval(() => {
      if (g.joined || app.game !== g) { clearInterval(g.joinTimer); return; }
      n++;
      sendJoin();
      if (n >= 6) {
        clearInterval(g.joinTimer);
        if (!g.joined) leaveGame(true, 'Комната не найдена или её создатель сейчас не в сети. Проверьте код.');
      }
    }, 2000);
    // синхронизация часов
    let pings = 0;
    const ping = () => { if (app.game !== g) return; link.send('g2h', { type: 'ping', pid, pub, t: Date.now() }, { qos: 0 }); pings++; g.pingTimer = setTimeout(ping, pings < 4 ? 1500 : 15000); };
    ping();
    app.busy = false;
    if (!quiet) app.tab = g.trio ? 'trio' : 'duel'; // при восстановлении после перезагрузки остаёмся на главной
    render();
  }

  function onState(S) {
    const g = app.game;
    if (!g || g.mode !== 'guest' || !S || typeof S !== 'object' || !S.players) return;
    if (g.S && S.seq <= g.S.seq && S.code === g.S.code) return;
    const mine = roleByPub(S, g.pub);
    if (!mine) {
      const full = seats(S).every((r) => S.players[r]);
      if (g.joined) return;
      if (full) { leaveGame(true, isTrio(S) ? 'В этой комнате уже собрались три игрока.' : 'В этой комнате уже идёт игра с другим участником.'); return; }
      g.S = S; render(); return; // ещё не приняты
    }
    g.me = mine;
    const t = isTrio(S);
    if (g.trio !== t) { const wasHere = app.tab === gameTabOf(g); g.trio = t; if (wasHere) app.tab = gameTabOf(g); }
    roles(S).forEach((r) => { if (r !== 'host' && r !== mine) watchPresence(g, S.players[r].pub); });
    if (!g.joined) { g.joined = true; toast('Вы в комнате'); }
    app.subject = subjOfState(S);
    if (g.bestRtt === Infinity && S.now) g.offset = S.now - Date.now();
    g.S = S;
    // сбросим ожидающие действия, если хозяин их уже учёл
    const me = S.players[mine];
    if (g.ui.pendingAnswer && (g.ui.pendingAnswer.round !== S.round || me.answered || S.phase !== 'question')) g.ui.pendingAnswer = null;
    if (g.ui.pendingReady && (g.ui.pendingReady.round !== S.round || me.ready || g.ui.pendingReady.phase !== S.phase)) g.ui.pendingReady = null;
    render();
  }

  function guestSend(type, extra) {
    const g = app.game;
    const msg = Object.assign({ type, pid: g.pid, round: g.S.round }, extra || {});
    g.link.send('g2h', msg);
    return msg;
  }

  // повторная отправка, если хозяин не подтвердил
  setInterval(() => {
    const g = app.game;
    if (!g || g.mode !== 'guest' || !g.S) return;
    if (g.ui.pendingAnswer && Date.now() - g.ui.pendingAnswer.at > 2500) { g.link.send('g2h', g.ui.pendingAnswer.msg); g.ui.pendingAnswer.at = Date.now(); }
    if (g.ui.pendingReady && Date.now() - g.ui.pendingReady.at > 2500) { g.link.send('g2h', g.ui.pendingReady.msg); g.ui.pendingReady.at = Date.now(); }
  }, 500);

  // ---- действия игрока ----
  function doAnswer(value) {
    const g = app.game;
    if (!g) return;
    if (g.mode === 'guest') {
      if (g.S.phase !== 'question' || !g.me || !inGame(g.S, g.me) || g.S.players[g.me].answered || g.ui.pendingAnswer) return;
      const msg = guestSend('answer', { value: String(value) });
      g.ui.pendingAnswer = { round: g.S.round, msg, at: Date.now(), value: String(value) };
      g.ui.myValue = String(value);
      if (Profile.markToday(subjOfState(g.S))) renderHeaderAvatar();
      render();
      return;
    }
    g.ui.myValue = String(value);
    if (Profile.markToday(subjOfState(g.S))) renderHeaderAvatar();
    if (submitAnswer(g.S, g.P, 'host', value)) commit();
  }

  function doReady() {
    const g = app.game;
    if (!g) return;
    if (g.mode === 'guest') {
      if (!g.me || g.S.players[g.me].ready || g.ui.pendingReady) return;
      const msg = guestSend('ready');
      g.ui.pendingReady = { round: g.S.round, phase: g.S.phase, msg, at: Date.now() };
      render();
      return;
    }
    setReady(g.S, g.P, 'host');
    g.ui.showFull = false;
    commit();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function leaveGame(silent, reasonMsg) {
    const g = app.game;
    if (!g) return;
    const S = g.S;
    if (!silent) {
      const inPlay = S && S.phase !== 'over' && S.phase !== 'lobby' && g.mode !== 'solo';
      const q = g.mode === 'solo' ? (S.phase === 'over' ? null : 'Завершить игру?') : inPlay && isTrio(S) ? (g.mode === 'host' ? 'Вы создали комнату: если выйти, игра закончится для всех. Выйти?' : inGame(S, g.me) ? 'Выйти из трио? Вы выбудете из игры.' : null) : inPlay ? (S.settings.lives ? 'Выйти из дуэли? Это будет засчитано как поражение.' : 'Завершить дуэль? Жизни безлимитные, поэтому победитель определится по числу верных ответов.') : null;
      if (q && !confirm(q)) return;
    }
    clearInterval(g.joinTimer); clearTimeout(g.pingTimer);
    if (app.invitedUid) { Cloud.cancelInvite(app.invitedUid); app.invitedUid = null; }
    if (g.mode === 'host' && isTrio(S)) {
      if (S.phase === 'lobby' && roles(S).length > 1) { S.phase = 'over'; S.reason = 'closed'; S.seq++; S.now = Date.now(); g.link.send('state', S, { retain: true }); }
      else if (S.phase !== 'lobby' && S.phase !== 'over') { S.players.host.left = true; S.phase = 'over'; S.deadline = 0; S.reason = 'leave'; S.winner = roundsWinner(S); S.seq++; S.now = Date.now(); g.link.send('state', S, { retain: true }); }
      if (S.phase === 'lobby' || S.reason === 'closed' || S.phase === 'over') { ['state', 'profile/host', 'profile/guest', 'profile/guest2'].forEach((t) => g.link.clear(t)); }
      store.del('egeduel:host:' + S.code);
      g.link.close();
    } else if (g.mode === 'host') {
      if (S.phase === 'lobby' || S.phase === 'over') { g.link.clear('state'); g.link.clear('profile/host'); g.link.clear('profile/guest'); }
      else { S.phase = 'over'; if (S.settings.lives) { S.winner = 'guest'; S.reason = 'leave'; } else { S.winner = roundsWinner(S); S.reason = 'stop'; S.stopBy = 'host'; } S.seq++; S.now = Date.now(); g.link.send('state', S, { retain: true }); }
      store.del('egeduel:host:' + S.code);
      g.link.close();
    } else if (g.mode === 'guest') {
      if (S && S.players && g.me && S.players[g.me] && S.players[g.me].pub === g.pub) g.link.send('g2h', { type: 'leave', pid: g.pid });
      g.link.close();
    } else if (g.mode === 'solo' && S.phase !== 'over' && !silent) {
      // соло: показать итоги
      S.phase = 'over'; S.reason = 'quit'; S.deadline = 0;
      sess.del('egeduel:active'); sess.del('egeduel:solo');
      render();
      return;
    }
    sess.del('egeduel:active'); sess.del('egeduel:solo');
    app.game = null;
    if (reasonMsg) {
      app.joinError = reasonMsg;
      // тихое переподключение после перезагрузки не уводит со страницы, где человек находится
      if (g.quiet && !g.joined) toast('Прошлая дуэль уже закрыта');
      else app.tab = g.trio ? 'trio' : 'duel';
    }
    render();
  }

  function onConn(ok) {
    const el = $('#conn');
    if (el) el.classList.toggle('show', !ok && !!app.game && app.game.mode !== 'solo');
    if (ok && app.game && app.game.mode === 'host') setTimeout(() => commit(), 100);
    if (ok && app.game && app.game.mode === 'guest' && app.game.link) {
      app.game.link.send('g2h', joinMsg(app.game));
    }
  }

  function joinMsg(g) { return { type: 'join', pid: g.pid, pub: g.pub, name: app.name.trim().slice(0, 24), profile: Profile.shared() }; }

  // ---- восстановление после перезагрузки страницы ----
  async function resume() {
    const a = sess.get('egeduel:active', null);
    if (!a) return;
    if (a.mode === 'train') {
      const d = sess.get('egeduel:train', null);
      if (d && d.items && d.items.length) { app.game = d; app.subject = d.subject || app.subject; render(); }
      else sess.del('egeduel:active');
      return;
    }
    if (a.mode === 'solo') {
      const d = sess.get('egeduel:solo', null);
      if (d && d.S) { app.game = { mode: 'solo', me: 'host', S: d.S, P: d.P || {}, ui: {} }; app.subject = subjOfState(d.S); render(); }
      return;
    }
    if (a.mode === 'host') {
      const d = store.get('egeduel:host:' + a.code, null);
      if (!d || !d.S) { sess.del('egeduel:active'); return; }
      try {
        const link = await Net.hostExisting(a.code, onConn);
        app.game = { mode: 'host', me: 'host', S: d.S, P: d.P || {}, link, ui: {}, oppOnline: false, trio: isTrio(d.S), online: {}, profiles: {} };
        app.subject = subjOfState(d.S);
        bindHost(link);
        // остаёмся на главной: вернуться к игре можно по плашке «У вас идёт дуэль»
        commit();
        toast('Игра восстановлена');
      } catch (e) { toast('Не удалось восстановить комнату'); }
      return;
    }
    if (a.mode === 'guest') { joinRoom(a.code, true); }
  }

  /* ---------- настройки ---------- */
  function validSettings(d) {
    const st = { time: Math.max(0, Math.min(3600, Math.round(+d.time || 0))), lives: +d.lives === 0 ? 0 : Math.max(1, Math.min(10, Math.round(+d.lives || 3))), rounds: Math.max(0, Math.min(100, Math.round(+d.rounds || 0))), mode: d.mode === 'pick' ? 'pick' : 'all', subject: app.subject, nums: (d.nums || []).filter((x) => x >= 1 && x <= SUBJ[app.subject].count), order: d.order === 'seq' ? 'seq' : 'random' };
    if (st.mode === 'pick' && !st.nums.length) { toast('Выберите хотя бы один номер задания'); return null; }
    return st;
  }

  function onSettingsClick(key, el) {
    if (key === 'train') { onTrainClick(el); return; }
    const d = draft(key);
    const k = el.dataset.set, v = el.dataset.v;
    if (k === 'time') d.time = +v;
    else if (k === 'time-custom') { if (TIME_OPTS.indexOf(+d.time) >= 0) d.time = 420; }
    else if (k === 'lives-') d.lives = +d.lives === 0 ? 10 : Math.max(1, d.lives - 1);
    else if (k === 'lives+') d.lives = +d.lives === 0 ? 0 : d.lives >= 10 ? 0 : d.lives + 1;
    else if (k === 'lives-inf') d.lives = +d.lives === 0 ? 3 : 0;
    else if (k === 'rounds') d.rounds = +v;
    else if (k === 'rounds-custom') { if ([0, 5, 10, 20, 30, 50, 100].indexOf(+d.rounds || 0) >= 0) d.rounds = 15; }
    else if (k === 'mode') d.mode = v;
    else if (k === 'order') d.order = v;
    else if (k === 'num') { const n = +v; const i = d.nums.indexOf(n); if (i >= 0) d.nums.splice(i, 1); else d.nums.push(n); }
    else if (k === 'preset') d.nums = v === 'none' ? [] : (SUBJ[app.subject].groups[+v] || { nums: [] }).nums.slice();
    else return;
    saveDraft(key);
    render();
  }

  /* ======================================================================
     ОТРИСОВКА
     ====================================================================== */
  const main = () => $('#main');

  function render() {
    // запоминаем страницу для перезагрузки; до init() не пишем — KaTeX может вызвать rerender раньше и затереть запись
    if (app.inited && app.tab !== 'soon' && app.tab !== 'watch') sess.set('egeduel:view', { tab: app.tab, subject: app.subject });
    if (app.tab !== 'watch' && app.watch) stopWatch(); // ушли со страницы наблюдения — отключаемся от комнаты
    updatePlay();
    $$('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === app.tab));
    // меню раздела (Дуэль / Соло / Правила) появляется только после выбора предмета
    const navEl = $('nav.tabs');
    const sectionNav = !(app.tab === 'home' || app.tab === 'soon' || app.tab === 'shop' || app.tab === 'watch');
    if (navEl) navEl.classList.toggle('nav-hidden', !sectionNav);
    document.body.classList.toggle('on-home', !sectionNav);
    const lsm = $('.logo small');
    if (lsm) lsm.textContent = sectionNav ? SUBJ[(app.game && app.game.S && (app.tab === 'duel' || app.tab === 'trio' || app.tab === 'solo') && subjOfState(app.game.S)) || app.subject].short + ' · 2027' : 'подготовка к ЕГЭ · 2027';
    movePill();
    renderHeaderAvatar();
    const g = app.game;
    if (g && g.S && g.S.result && (g.S.phase === 'result' || g.S.phase === 'over')) achAfterRound(g);
    if (g && g.S && g.S.phase === 'over') recordResult(g);
    const gameTab = gameTabOf(g);
    if (app.tab !== 'profile' || (g && app.tab === gameTab)) $$('#pe-drawer, #pe-back').forEach((x) => x.remove()); // панель настройки живёт в body
    const shop = $('#shop-btn');
    const tg = $('#tg-btn');
    if (tg) tg.classList.toggle('hide', !!(g && app.tab === gameTab && (g.mode === 'train' ? !g.done : g.S && g.S.phase !== 'over')));
    if (shop) { shop.classList.toggle('hide', !!(g && app.tab === gameTab && (g.mode === 'train' ? !g.done : g.S && g.S.phase !== 'over'))); shop.classList.toggle('on', app.tab === 'shop'); }
    if (g && app.tab === gameTab) { if (g.mode === 'train') renderTrain(); else renderGame(); return; }
    app.rendered = null;
    if (app.tab === 'profile') { if (!$('#profile-page')) renderProfile(); return; }
    if (app.tab === 'watch') { renderWatch(); return; }
    if (app.tab === 'home') renderHome();
    else if (app.tab === 'soon') renderSoon();
    else if (app.tab === 'shop') renderShop();
    else if (app.tab === 'duel') renderDuelHome();
    else if (app.tab === 'trio') renderTrioHome();
    else if (app.tab === 'solo') renderSoloHome();
    else if (app.tab === 'top') renderTop();
    else renderRules();
  }

  // Подложка активной вкладки плавно переезжает под нажатую кнопку

    const pill = $('.tab-pill');
    if (!pill) return;
    const btn = $('nav.tabs button.on');
    if (!btn) { pill.style.opacity = '0'; return; }
    pill.style.width = btn.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
    pill.style.opacity = '1';
  }
  /* главная: блоки съезжаются на место со всех сторон */

  /* ---------- огонёк ---------- */
  // Пламя: внешний язык (красно-оранжевый) с боковым язычком и внутреннее жёлтое ядро
  const FLAME_OUTER = 'M35 2C36.5 11 44 16.5 49.5 24.5C55 32.5 56 43 51.5 51C47.5 58 40.5 62 32 62C22.5 62 14.5 57 11.5 48.5C8.8 40.5 10.8 31.5 16.5 25C17 30.5 19 34 22.5 36.5C21.2 28.5 23.5 20.5 28 14.5C31 10.5 34 7 35 2Z';
  const FLAME_INNER = 'M34 29C35.5 35.5 41.5 39.5 43 46.5C44.5 54 39.5 60 32.5 60C25.5 60 20.5 55.5 20.8 49C21 44 24 40.5 27 37.5C27.3 41.5 28.6 43.8 31 45.2C30 39.5 31 34 34 29Z';
  function flame(cls, size) {
    const lit = !cls || cls === 'lit';
    return `<svg class="flame ${lit ? 'lit' : cls}" viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">` +
      `<defs>` +
      `<linearGradient id="fl-out" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f03e3e"/><stop offset=".45" stop-color="#ff6b1a"/><stop offset="1" stop-color="#ffa63d"/></linearGradient>` +
      `<radialGradient id="fl-glow" cx=".5" cy=".85" r=".6"><stop offset="0" stop-color="#ffd166" stop-opacity=".9"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>` +
      `<linearGradient id="fl-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc93c"/><stop offset=".55" stop-color="#ffe680"/><stop offset="1" stop-color="#fff8d6"/></linearGradient>` +
      `</defs>` +
      `<g class="fl-outer"><path d="${FLAME_OUTER}" fill="url(#fl-out)"/><path d="${FLAME_OUTER}" fill="url(#fl-glow)"/></g>` +
      `<g class="fl-inner"><path d="${FLAME_INNER}" fill="url(#fl-in)"/></g>` +
      `</svg>`;
  }
  const daysWord = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'день' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'дня' : 'дней');
  function streakText(s) {
    if (s.state === 'none') return 'Решите любое задание, чтобы зажечь огонёк.';
    if (s.state === 'lit') return 'Огонёк горит! Сегодня задание уже решено — возвращайтесь завтра.';
    if (s.state === 'pending') return 'Решите хотя бы одно задание сегодня, чтобы продлить серию.';
    if (s.state === 'frozen') return 'Вчера вы пропустили день — огонёк потух. Решите задание сегодня, и серия восстановится!';
    return 'Серия сгорела: пропущено два дня подряд. Начните новую — решите задание сегодня.';
  }
  const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

  /* ---- окно огонька: серия + календарь активности по неделям ---- */
  const MON_SHORT = ['янв.', 'февр.', 'март', 'апр.', 'май', 'июнь', 'июль', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
  const tasksWord = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'задание' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'задания' : 'заданий');
  const level = (n) => (n <= 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4);

  function heatmapHTML(weeks) {
    const p = Profile.me;
    const counts = p.counts || {};
    const days = new Set(p.days || []);
    const s = Profile.streak();
    const skips = new Set(s.skips || []);
    const today = new Date();
    const todayKey = Streak.today();
    const monday = Streak.addDays(today, -((today.getDay() + 6) % 7));
    // календарь начинается с недели первой активности: прошлое слева, будущие дни справа.
    // Когда истории больше, чем помещается, сдвигаем окно, оставляя справа 4 недели будущего.
    const FUTURE_WEEKS = 4;
    const keys = Object.keys(counts).concat(p.days || []).filter((k) => /^d{4}-d{2}-d{2}$/.test(k) && k <= todayKey).sort();
    let firstMon = monday;
    if (keys.length) { const d0 = Streak.parse(keys[0]); firstMon = Streak.addDays(d0, -((d0.getDay() + 6) % 7)); }
    const earliest = Streak.addDays(monday, -7 * (weeks - 1 - FUTURE_WEEKS));
    const start = firstMon < earliest ? earliest : firstMon;
    let cols = '', months = '', lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const wStart = Streak.addDays(start, 7 * w);
      // подпись месяца над неделей, в которой начинается месяц
      let label = '';
      for (let i = 0; i < 7; i++) { const d = Streak.addDays(wStart, i); if (d.getDate() === 1 || (w === 0 && i === 0)) { if (d.getMonth() !== lastMonth) { label = MON_SHORT[d.getMonth()]; lastMonth = d.getMonth(); } break; } }
      months += '<span class="hm-m">' + label + '</span>';
      let col = '';
      for (let i = 0; i < 7; i++) {
        const d = Streak.addDays(wStart, i);
        const k = Streak.key(d);
        if (k > todayKey) { col += '<span class="hm-c future" title="' + d.getDate() + ' ' + MON_SHORT[d.getMonth()] + ' — ещё впереди"></span>'; continue; }
        const n = counts[k] || (days.has(k) ? 1 : 0);
        const lv = level(n);
        const cls = 'hm-c l' + lv + (skips.has(k) && !n ? ' skip' : '') + (k === todayKey ? ' today' : '');
        const title = d.getDate() + ' ' + MON_SHORT[d.getMonth()] + ' ' + d.getFullYear() + ': ' + (n ? n + ' ' + tasksWord(n) : skips.has(k) ? 'пропуск (огонёк прощает)' : 'нет заданий');
        col += '<span class="' + cls + '" title="' + title + '"></span>';
      }
      cols += '<div class="hm-col">' + col + '</div>';
    }
    return '<div class="hm-scroll" id="hm-scroll"><div class="hm">' +
      '<div class="hm-months"><span class="hm-wd-pad"></span>' + months + '</div>' +
      '<div class="hm-body"><div class="hm-wd"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>' + cols + '</div>' +

  function streakCardHTML() {
    const s = Profile.streak();
    const on = s.state === 'lit' || s.state === 'pending';
    const counts = Profile.me.counts || {};

    const today = new Date();
    const weekKeys = []; for (let i = 0; i < 7; i++) weekKeys.push(Streak.key(Streak.addDays(today, -i)));

  function oppProfile(S, role) {
    const g = app.game;

  function recordResult(g) {
    const S = g.S;
    if (!S.history.length && S.reason !== 'leave') return;
    const me = myRole();
    const key = (S.code || 'solo') + ':' + (S.id || '') + ':' + (S.gameNo || 1) + ':' + me;
    const solved = S.history.filter((h) => h[me]).length;
    const first = isSolo(S) ? Profile.record(key, { mode: 'solo', solved })
      : Profile.record(key, { mode: 'duel', solved, outcome: S.winner === 'draw' ? 'draw' : S.winner === me ? 'win' : 'loss' });
    if (first) achAfterGame(g);
  }

  /* ======================================================================
     ДОСТИЖЕНИЯ
     Проверяются: после каждого раунда (achAfterRound), после конца игры
     (achAfterGame), после завершения тренировки (finishTrain) и при открытии
     таблицы лидеров (loadTop). Данные — Profile.me.ach и Profile.me.ap.

  const ACH_GROUPS = [
    { name: 'Соло', ids: ['sniper', 'fix', 'nerd', 'encyc', 'ninja'] },

  ];
  const ACH = {

    ninja: { icon: '🥷', name: 'На волосок от гибели', desc: 'Пройти все раунды Флеша, когда к концу осталась ровно 1 жизнь.' },
    friend: { icon: '🤝', name: 'Друг познаётся в дуэли', desc: 'Победить друга в дуэли всухую: у вас 3 и больше верных ответов, у него — ни одного.' },

    groundhog: { icon: '🧩', name: 'День сурка', desc: 'Ошибиться в одном и том же номере дважды за один день.' },
  };
  const ACH_ORDER = ACH_GROUPS.reduce((a, g) => a.concat(g.ids), []);
  const achDate = (ms) => new Date(ms).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

  // результат одной попытки по номеру: 'ok' — верно, 'bad' — неверный ответ, 'timeout' — не успел
  function achAttempt(subj, num, res) {
    const ap = Profile.me.ap, k = subj + ':' + num, got = [];
    if (res === 'ok') {
      if (ap.w[k]) { delete ap.w[k]; got.push('fix'); }
      ap.s[k] = (ap.s[k] || 0) + 1;
      if (ap.s[k] >= 30) got.push('nerd');
      const sv = (ap.sv[subj] = ap.sv[subj] || []);
      if (sv.indexOf(num) < 0) { sv.push(num); sv.sort((a, b) => a - b); }
      if (allNums(subj).every((n) => sv.indexOf(n) >= 0)) got.push('encyc');
    } else {
      ap.w[k] = 1;
      delete ap.s[k];
      if (res === 'bad') {
        const today = Streak.today();
        if (ap.d !== today) { ap.d = today; ap.df = {}; }
        ap.df[k] = (ap.df[k] || 0) + 1;
        if (ap.df[k] >= 2) got.push('groundhog');
      }
    }
    Profile.save();
    got.forEach(achUnlock);
  }

  // после раунда флеша/дуэли/трио — один раз на раунд (ключи раундов переживают перезагрузку)
  function achAfterRound(g) {
    const S = g.S, me = myRole();
    const v = S.result && S.result.v && S.result.v[me];
    const h = S.history[S.history.length - 1];
    if (!v || !h) return;
    const key = ['r', S.code || 'solo', S.id || '', S.gameNo || 1, h.round, me].join(':');
    const done = sess.get('egeduel:achRounds', []);
    if (done.indexOf(key) >= 0) return;
    sess.set('egeduel:achRounds', done.concat(key).slice(-60));
    achAttempt(subjOfState(S), h.num, v.ok ? 'ok' : v.timeout ? 'timeout' : 'bad');
  }

  // после конца игры (вызывается один раз — из recordResult)
  function achAfterGame(g) {
    const S = g.S, st = S.settings;
    if (isSolo(S)) {
      if (st.rounds && S.reason === 'rounds') {
        if (S.history.length >= st.rounds && S.history.every((h) => h.host)) achUnlock('sniper');
        if (st.lives && S.players.host.lives === 1) achUnlock('ninja');
      }
      return;
    }
    if (isTrio(S)) return;
    const me = myRole(), opp = me === 'host' ? 'guest' : 'host';
    if (S.winner !== me || !S.players[opp] || S.reason === 'leave') return;
    const last = S.history[S.history.length - 1];
    // Камикадзе: решающий раунд при 1:1 по жизням — я ответил верно, соперник ошибся
    if (st.lives && S.reason === 'lives' && last && last[me] && !last[opp] && S.players[me].lives === 1 && S.players[opp].lives === 0) achUnlock('kamikaze');
    // Друг познаётся в дуэли: сухая победа над другом
    const myOk = okCount(S, me), oppOk = okCount(S, opp);
    const oppUid = (oppProfile(S, opp) || {}).uid;
    if (myOk >= 3 && oppOk === 0 && oppUid && (Profile.me.friends || []).indexOf(oppUid) >= 0) achUnlock('friend');
  }

  // всплывающее уведомление; несколько подряд показываются по очереди
  const achQueue = [];
  function achUnlock(id) {
    if (!ACH[id] || !Profile.unlock(id)) return;
    achQueue.push(id);

  function achShowNext() {
    const id = achQueue[0];
    if (!id) return;
    const a = ACH[id];
    const el = document.createElement('div');
    el.className = 'ach-pop';
    el.setAttribute('role', 'status');
    el.innerHTML = `<span class="ach-pop-ic">${a.icon}</span><span><small>🏅 Новое достижение</small><b>${esc(a.name)}</b></span>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    el.onclick = () => hide();
    let t = setTimeout(hide, 4200);
    function hide() {
      clearTimeout(t);
      el.classList.remove('show');
      setTimeout(() => { el.remove(); achQueue.shift(); achShowNext(); }, 350);
    }
  }

  /* ---------- кадрирование аватара: масштаб + перетаскивание в круге ---------- */
  function openCropper(img, onDone) {
    const W = img.naturalWidth, H = img.naturalHeight;
    const m = modal(`<div class="row" style="align-items:center"><h3 style="margin:0">Аватар</h3><button type="button" class="modal-x" data-close aria-label="Закрыть">×</button></div>
      <p class="muted" style="font-size:14px;margin:6px 0 12px">Перетащите фото и настройте масштаб — в круг попадёт то, что увидят другие.</p>
      <div class="crop-stage" id="crop-stage"><img src="${img.src}" alt="" draggable="false" id="crop-img"><div class="crop-mask"></div></div>
      <div class="crop-zoom"><span aria-hidden="true">−</span><input type="range" id="crop-z" min="1" max="5" step="0.01" value="1" aria-label="Масштаб"><span aria-hidden="true">+</span></div>
      <div class="actions" style="justify-content:flex-end"><button type="button" class="btn soft" data-close>Отмена</button><button type="button" class="btn" id="crop-ok">Сохранить</button></div>`);
    const stage = $('#crop-stage', m.el), el = $('#crop-img', m.el), zIn = $('#crop-z', m.el);
    let V = stage.clientWidth || 280, base = V / Math.min(W, H), z = 1, ox = 0, oy = 0;
    const sc = () => base * z;
    const clamp = () => { const s = sc(); ox = Math.min(0, Math.max(V - W * s, ox)); oy = Math.min(0, Math.max(V - H * s, oy)); };
    const draw = () => { clamp(); const s = sc(); el.style.width = W * s + 'px'; el.style.height = H * s + 'px'; el.style.transform = `translate(${ox}px, ${oy}px)`; };
    const zoomTo = (nz, px = V / 2, py = V / 2) => {
      nz = Math.max(1, Math.min(5, nz));
      const s0 = sc(), ix = (px - ox) / s0, iy = (py - oy) / s0;
      z = nz; const s1 = sc(); ox = px - ix * s1; oy = py - iy * s1;
      zIn.value = z; draw();
    };
    ox = (V - W * base) / 2; oy = (V - H * base) / 2; draw();
    zIn.oninput = () => zoomTo(+zIn.value);
    stage.addEventListener('wheel', (e) => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomTo(z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    const pts = new Map(); let last = null, pinch = null;
    stage.addEventListener('pointerdown', (e) => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = { x: e.clientX, y: e.clientY }; pinch = null; });
    stage.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size >= 2) {
        const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = stage.getBoundingClientRect();
        if (pinch) zoomTo(pinch.z * d / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
        else pinch = { d, z };
        return;
      }
      if (last) { ox += e.clientX - last.x; oy += e.clientY - last.y; draw(); }
      last = { x: e.clientX, y: e.clientY };
    });
    const up = (e) => { pts.delete(e.pointerId); pinch = null; const rest = [...pts.values()][0]; last = rest ? { x: rest.x, y: rest.y } : null; };
    stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
    $('#crop-ok', m.el).onclick = () => {
      const s = sc();
      try { const data = Profile.cropPhoto(img, { sx: -ox / s, sy: -oy / s, side: V / s }); m.close(); onDone(data); }
      catch (err) { toast(err.message || 'Не удалось сохранить фото'); }
    };
  }

  const SUBJ_NAME = { math: 'Профильная математика', rus: 'Русский язык', soc: 'Обществознание', bio: 'Биология', phys: 'Физика', chem: 'Химия' };

  /* ---------- приглашения в дуэль ---------- */

  function inviteBanner() {

  let invList = [];

  function showInvites(list) {

  /* ---------- колокольчик: заявки в друзья и приглашения в дуэль ---------- */
  let freqList = [];
  const freqSeen = {};
  function showFriendReqs(list) {
    const fresh = (list || []).filter((x) => !freqSeen[x.id]);
    (list || []).forEach((x) => { freqSeen[x.id] = 1; });
    freqList = list || [];
    freqList.forEach((x) => needProfile(x.from));
    updateBell();
    if (fresh.length && app.freqReady) { toast('👤 ' + fresh[0].name + ' хочет добавить вас в друзья'); ringBell(); }
    app.freqReady = true; // о заявках, которые уже были при входе, не шумим
  }
  function bellCount() { return freqList.length + visibleInvites().length; }
  function ringBell() {
    const b = $('#bell-btn');
    if (!b || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
  }
  function updateBell() {
    const b = $('#bell-btn');
    if (!b) return;
    const n = bellCount();
    const badge = $('#bell-n');
    badge.textContent = n > 9 ? '9+' : n;
    badge.classList.toggle('hide', !n);
    b.setAttribute('aria-label', n ? 'Уведомления: ' + n : 'Уведомления');
    const inv = visibleInvites().length;
    if (inv > (app.invN || 0)) ringBell(); // новое приглашение в дуэль — колокольчик качается
    app.invN = inv;
    if (app.bellOpen) renderBell();
  }
  // профили отправителей для мини-карточек: uid → профиль | null (грузится) | false (не нашли)
  const profCache = {};
  function needProfile(uid) {
    if (!uid || uid in profCache || !Cloud.user) return;
    profCache[uid] = null;
    Cloud.getProfile(uid).then((fp) => { profCache[uid] = fp || false; }).catch(() => { profCache[uid] = false; })
      .then(() => { if (app.bellOpen) renderBell(); });
  }
  // мини-профиль в уведомлении: как «Так вас видит соперник»; нажатие открывает полный профиль
  function bnCard(uid, name, tag) {
    const fp = profCache[uid];
    if (fp) return `<div class="bn-card" role="button" tabindex="0" data-bn-prof="${esc(uid)}" title="Открыть профиль">${Profile.card(fp)}<span class="bn-more">Открыть профиль ›</span></div>`;
    if (fp === null) return `<div class="bn-card loading"><div class="pcard">${Profile.avatar(Profile.fallback(name), 64)}<div class="pcard-body"><div class="pcard-name">${esc(name)}${tag ? ` <span class="pcard-tag">#${esc(tag)}</span>` : ''}</div><div class="pcard-bio muted"><span class="dot-pulse"></span> Загружаем профиль…</div></div></div></div>`;
    return `<div class="bn-text"><b>${esc(name)}</b>${tag ? ' <span class="muted">#' + esc(tag) + '</span>' : ''}</div>`;
  }
  function bellHTML() {
    if (!Cloud.user) return '<div class="bn-head">Уведомления</div><div class="bn-empty">Войдите через Google, чтобы получать заявки в друзья и приглашения в дуэль.</div>';
    const reqs = freqList.map((r) => `<div class="bn-item">
        <div class="bn-what">👤 Хочет добавить вас в друзья</div>
        ${bnCard(r.from, r.name, r.tag)}
        <div class="bn-act"><button type="button" class="btn" data-fr-yes="${esc(r.id)}">Принять</button><button type="button" class="btn ghost" data-fr-no="${esc(r.id)}">Отклонить</button></div>
      </div>`).join('');
    const invs = visibleInvites().map((iv) => `<div class="bn-item">
        <div class="bn-what">⚔️ Зовёт вас в дуэль · ${SUBJ_ICON[iv.subject]} ${SUBJ_NAME[iv.subject]}</div>
        ${bnCard(iv.from, iv.name, iv.tag)}
        <div class="bn-act"><button type="button" class="btn" data-iv-yes="${esc(iv.id)}">Принять</button><button type="button" class="btn ghost" data-iv-no="${esc(iv.id)}">Отклонить</button></div>
      </div>`).join('');
    return `<div class="bn-head">Уведомления</div>${reqs || invs ? invs + reqs : '<div class="bn-empty">🔕 Новых уведомлений нет</div>'}`;
  }
  async function acceptFreq(r) {
    await Cloud.acceptFriend(r.id, r.from);
    freqList = freqList.filter((x) => x.id !== r.id); updateBell();
    toast(r.name + ' теперь у вас в друзьях');
    refreshFriends();
  }
  function declineFreq(r) {
    Cloud.declineFriend(r.id);
    freqList = freqList.filter((x) => x.id !== r.id); updateBell();
  }
  function renderBell() {
    const p = $('#bell-pop');
    if (!p) return;
    p.innerHTML = bellHTML();
    $$('[data-fr-yes]', p).forEach((b) => (b.onclick = async () => {
      const r = freqList.find((x) => x.id === b.dataset.frYes);
      if (!r) return;
      b.disabled = true;
      try { await acceptFreq(r); } catch (e) { b.disabled = false; toast('Не удалось принять заявку: ' + (e.message || e)); }
    }));
    $$('[data-fr-no]', p).forEach((b) => (b.onclick = () => { const r = freqList.find((x) => x.id === b.dataset.frNo); if (r) declineFreq(r); }));
    $$('[data-iv-yes]', p).forEach((b) => (b.onclick = () => { const iv = visibleInvites().find((x) => x.id === b.dataset.ivYes); if (iv) acceptInvite(iv); }));
    $$('[data-iv-no]', p).forEach((b) => (b.onclick = () => { const iv = visibleInvites().find((x) => x.id === b.dataset.ivNo); if (iv) declineInvite(iv); }));
    $$('[data-bn-prof]', p).forEach((c) => {
      c.onclick = () => {
        const fp = profCache[c.dataset.bnProf];
        if (!fp) return;
        const freq = freqList.find((x) => x.from === fp.uid) || null;
        showProfileModal(fp, { freq });
      };
      c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.click(); } };
    });
  }
  function placeBell() {
    const p = $('#bell-pop'), b = $('#bell-btn');
    if (!p || !b) return;
    const r = b.getBoundingClientRect();
    const w = Math.min(360, window.innerWidth - 24);
    p.style.width = w + 'px';
    p.style.top = Math.round(r.bottom + 10) + 'px';
    p.style.left = Math.round(Math.max(12, Math.min(window.innerWidth - w - 12, r.right - w + 18))) + 'px';
    p.style.setProperty('--arrow', Math.round(r.left + r.width / 2 - parseFloat(p.style.left)) + 'px');
  }

  function modal(html) {
    let m = $('#modal');
    if (!m) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
    clearTimeout(m._t); m.classList.remove('closing', 'anim'); // новое окно поверх ещё закрывающегося
    m.innerHTML = `<div class="modal-box card" role="dialog">${html}</div>`;
    m.classList.add('show');
    let closed = false;
    const close = () => {
      if (closed) return; closed = true;
      document.removeEventListener('keydown', onKey);
      if (!m.classList.contains('anim') || matchMedia('(prefers-reduced-motion: reduce)').matches) { m.classList.remove('show', 'anim'); return; }
      m.classList.add('closing'); // плавное закрытие, затем прячем
      m._t = setTimeout(() => m.classList.remove('show', 'closing', 'anim'), 220);
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    m.onclick = (e) => { if (e.target === m) close(); };
    $$('[data-close]', m).forEach((b) => (b.onclick = close));
    return { el: m, close };
  }
