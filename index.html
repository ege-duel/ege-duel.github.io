    s += `<div class="field"><span class="lbl">Время на ответ</span><div class="chips">`;
    TIME_OPTS.forEach((v) => { s += `<button type="button" class="chip ${+d.time === v ? 'on' : ''}" data-set="time" data-v="${v}">${v ? v / 60 + ' мин' : 'Без лимита'}</button>`; });
    s += `<button type="button" class="chip ${custom ? 'on' : ''}" data-set="time-custom">Своё…</button></div>`;
    s += `<div class="row ${custom ? '' : 'hide'}" style="margin-top:8px"><input class="input" style="max-width:110px" type="number" min="1" max="60" data-set="time-min" value="${custom ? Math.round(d.time / 60) || 1 : 5}"> <span class="muted">минут</span></div>`;
    s += `<div class="hint">Если игрок не успел ответить, он теряет жизнь. Для заданий 13–19 обычно нужно 10–20 минут.</div></div>`;
    s += `<div class="field"><span class="lbl">Количество жизней</span><div class="stepper"><button type="button" data-set="lives-" aria-label="Меньше">−</button><span>${+d.lives ? d.lives + ' ' + livesWord(d.lives) : '∞ безлимит'}</span><button type="button" data-set="lives+" aria-label="Больше">+</button></div><button type="button" class="chip ${+d.lives === 0 ? 'on' : ''}" data-set="lives-inf" style="margin-left:8px">∞ Безлимит</button><div class="hint">${+d.lives === 0 ? 'Жизни не тратятся. Ошибки и неотвеченные задания просто не засчитываются как верные.' : 'Неверный ответ или истёкшее время — минус одна жизнь.'}</div></div>`;
    {
      const R = +d.rounds || 0;
      const ROUND_OPTS = [0, 5, 10, 20, 30, 50, 100];
      const rCustom = ROUND_OPTS.indexOf(R) < 0;
      s += `<div class="field"><span class="lbl">Количество раундов</span><div class="chips">`;
      ROUND_OPTS.forEach((v) => { s += `<button type="button" class="chip ${R === v ? 'on' : ''}" data-set="rounds" data-v="${v}">${v ? v : 'Без лимита'}</button>`; });
      s += `<button type="button" class="chip ${rCustom ? 'on' : ''}" data-set="rounds-custom">Своё…</button></div>`;
      s += `<div class="row ${rCustom ? '' : 'hide'}" style="margin-top:8px"><input class="input" style="max-width:110px" type="number" min="1" max="100" data-set="rounds-num" value="${rCustom ? R : 15}"> <span class="muted">раундов (от 1 до 100)</span></div>`;
      const inf = +d.lives === 0;
      const rh = key === 'solo'
        ? (R ? `Тренировка закончится через ${R} ${roundsWord(R)}${inf ? '' : ' или раньше, если закончатся жизни'}.` : (inf ? 'Без лимита жизней и раундов тренировка идёт, пока вы не нажмёте «Завершить».' : 'Тренировка идёт, пока не закончатся жизни.'))
        : (R ? (inf ? 'После последнего раунда побеждает тот, у кого больше верных ответов.' : 'После последнего раунда побеждает тот, у кого больше жизней; при равенстве — у кого больше верных ответов.') : (inf ? 'Без лимита жизней и раундов дуэль идёт, пока кто-то не нажмёт «Завершить» — победит тот, у кого больше верных ответов.' : 'Игра идёт, пока у кого-то не закончатся жизни.'));
      s += `<div class="hint">${rh}</div></div>`;
    }
    s += `<div class="field"><span class="lbl">Задания</span><div class="seg"><button type="button" class="${d.mode === 'all' ? 'on' : ''}" data-set="mode" data-v="all">Все вперемешку</button><button type="button" class="${d.mode === 'pick' ? 'on' : ''}" data-set="mode" data-v="pick">Выбрать номера</button></div>`;
    if (d.mode === 'pick') {
      s += `<div class="nums" style="margin-top:12px">`;
      const SB = SUBJ[app.subject];
      allNums(app.subject).forEach((n) => { s += `<button type="button" class="num ${n >= SB.part2From ? 'p2' : ''} ${d.nums.indexOf(n) >= 0 ? 'on' : ''}" data-set="num" data-v="${n}" title="${esc(titleOf(app.subject, n))}">${n}</button>`; });
      s += `</div><div class="row" style="margin-top:10px">${SB.groups.map((g, i) => `<button type="button" class="link" data-set="preset" data-v="${i}">${g.label}</button><span class="muted">·</span>`).join('')}<button type="button" class="link" data-set="preset" data-v="none">Снять все</button></div>`;
      s += `<div class="row" style="margin-top:12px"><span class="muted" style="font-size:14px">Порядок:</span><div class="seg"><button type="button" class="${d.order !== 'seq' ? 'on' : ''}" data-set="order" data-v="random">Случайно</button><button type="button" class="${d.order === 'seq' ? 'on' : ''}" data-set="order" data-v="seq">По возрастанию</button></div></div>`;
      s += `<div class="hint">Выбрано: ${d.nums.length ? '№ ' + compress(d.nums) : 'ничего'}</div>`;
    } else {
      s += `<div class="hint">Каждый раунд — случайный номер ${app.subject === 'phys' ? 'из 1–20 и 22–26' : 'от 1 до ' + SUBJ[app.subject].count}.</div>`;
    }
    s += `</div>`;
    return s;
  }

  function onSettingsClick(key, el) {
    const d = draft(key);
    const k = el.dataset.set, v = el.dataset.v;
    if (k === 'time') d.time = +v;
    else if (k === 'time-custom') { if (TIME_OPTS.indexOf(+d.time) >= 0) d.time = 420; }
    else if (k === 'lives-') d.lives = +d.lives === 0 ? 10 : Math.max(1, d.lives - 1);
    else if (k === 'lives+') d.lives = +d.lives === 0 ? 0 : d.lives >= 10 ? 0 : d.lives + 1;
    else if (k === 'lives-inf') d.lives = +d.lives === 0 ? 3 : 0;
    else if (k === 'rounds') d.rounds = +v;
    else if (k === 'rounds-custom') { if ([0, 5, 10, 20, 30, 50, 100].indexOf(+d.rounds || 0) >= 0) d.rounds = 15; }
    else if (k === 'mode') d.mode = v;
    else if (k === 'order') d.order = v;
    else if (k === 'num') { const n = +v; const i = d.nums.indexOf(n); if (i >= 0) d.nums.splice(i, 1); else d.nums.push(n); }
    else if (k === 'preset') d.nums = v === 'none' ? [] : (SUBJ[app.subject].groups[+v] || { nums: [] }).nums.slice();
    else return;
    saveDraft(key);
    render();
  }

  /* ======================================================================
     ОТРИСОВКА
     ====================================================================== */
  const main = () => $('#main');

  function render() {
    $$('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === app.tab));
    // меню раздела (Дуэль / Соло / Правила) появляется только после выбора предмета
    const navEl = $('nav.tabs');
    const sectionNav = !(app.tab === 'home' || app.tab === 'soon' || app.tab === 'shop');
    if (navEl) navEl.classList.toggle('nav-hidden', !sectionNav);
    document.body.classList.toggle('on-home', !sectionNav);
    const lsm = $('.logo small');
    if (lsm) lsm.textContent = sectionNav ? SUBJ[(app.game && app.game.S && (app.tab === 'duel' || app.tab === 'solo') && subjOfState(app.game.S)) || app.subject].short + ' · 2027' : 'подготовка к ЕГЭ · 2027';
    movePill();
    renderHeaderAvatar();
    const g = app.game;
    if (g && g.S && g.S.phase === 'over') recordResult(g);
    const gameTab = g ? (g.mode === 'solo' ? 'solo' : 'duel') : null;
    const shop = $('#shop-btn');
    if (shop) { shop.classList.toggle('hide', !!(g && app.tab === gameTab && g.S && g.S.phase !== 'over')); shop.classList.toggle('on', app.tab === 'shop'); }
    if (g && app.tab === gameTab) { renderGame(); return; }
    app.rendered = null;
    if (app.tab === 'profile') { if (!$('#profile-page')) renderProfile(); return; }
    if (app.tab === 'home') renderHome();
    else if (app.tab === 'soon') renderSoon();
    else if (app.tab === 'shop') renderShop();
    else if (app.tab === 'duel') renderDuelHome();
    else if (app.tab === 'solo') renderSoloHome();
    else renderRules();
  }

  // Подложка активной вкладки плавно переезжает под нажатую кнопку
  function movePill() {
    const pill = $('.tab-pill');
    if (!pill) return;
    const btn = $('nav.tabs button.on');
    if (!btn) { pill.style.opacity = '0'; return; }
    pill.style.width = btn.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
    pill.style.opacity = '1';
  }
  function animatePage() {
    const m = main();
    if (!m) return;

    m.classList.add('page-in');
  }

  /* ---------- огонёк ---------- */
  // Пламя: внешний язык (красно-оранжевый) с боковым язычком и внутреннее жёлтое ядро
  const FLAME_OUTER = 'M35 2C36.5 11 44 16.5 49.5 24.5C55 32.5 56 43 51.5 51C47.5 58 40.5 62 32 62C22.5 62 14.5 57 11.5 48.5C8.8 40.5 10.8 31.5 16.5 25C17 30.5 19 34 22.5 36.5C21.2 28.5 23.5 20.5 28 14.5C31 10.5 34 7 35 2Z';
  const FLAME_INNER = 'M34 29C35.5 35.5 41.5 39.5 43 46.5C44.5 54 39.5 60 32.5 60C25.5 60 20.5 55.5 20.8 49C21 44 24 40.5 27 37.5C27.3 41.5 28.6 43.8 31 45.2C30 39.5 31 34 34 29Z';
  function flame(cls, size) {
    const lit = !cls || cls === 'lit';
    return `<svg class="flame ${lit ? 'lit' : cls}" viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">` +
      `<defs>` +
      `<linearGradient id="fl-out" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f03e3e"/><stop offset=".45" stop-color="#ff6b1a"/><stop offset="1" stop-color="#ffa63d"/></linearGradient>` +
      `<radialGradient id="fl-glow" cx=".5" cy=".85" r=".6"><stop offset="0" stop-color="#ffd166" stop-opacity=".9"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>` +
      `<linearGradient id="fl-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc93c"/><stop offset=".55" stop-color="#ffe680"/><stop offset="1" stop-color="#fff8d6"/></linearGradient>` +
      `</defs>` +
      `<g class="fl-outer"><path d="${FLAME_OUTER}" fill="url(#fl-out)"/><path d="${FLAME_OUTER}" fill="url(#fl-glow)"/></g>` +
      `<g class="fl-inner"><path d="${FLAME_INNER}" fill="url(#fl-in)"/></g>` +
      `</svg>`;
  }
  const daysWord = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'день' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'дня' : 'дней');
  function streakText(s) {
    if (s.state === 'none') return 'Решите любое задание, чтобы зажечь огонёк.';
    if (s.state === 'lit') return 'Огонёк горит! Сегодня задание уже решено — возвращайтесь завтра.';
    if (s.state === 'pending') return 'Решите хотя бы одно задание сегодня, чтобы продлить серию.';
    if (s.state === 'frozen') return 'Вчера вы пропустили день — огонёк потух. Решите задание сегодня, и серия восстановится!';
    return 'Серия сгорела: пропущено два дня подряд. Начните новую — решите задание сегодня.';
  }
  const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

  /* ---- окно огонька: серия + календарь активности по неделям ---- */
  const MON_SHORT = ['янв.', 'февр.', 'март', 'апр.', 'май', 'июнь', 'июль', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
  const tasksWord = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'задание' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'задания' : 'заданий');
  const level = (n) => (n <= 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4);

  function heatmapHTML(weeks) {
    const p = Profile.me;
    const counts = p.counts || {};
    const days = new Set(p.days || []);
    const s = Profile.streak();
    const skips = new Set(s.skips || []);
    const today = new Date();
    const todayKey = Streak.today();
    const monday = Streak.addDays(today, -((today.getDay() + 6) % 7));
    const start = Streak.addDays(monday, -7 * (weeks - 1));
    let cols = '', months = '', lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const wStart = Streak.addDays(start, 7 * w);
      // подпись месяца над неделей, в которой начинается месяц
      let label = '';
      for (let i = 0; i < 7; i++) { const d = Streak.addDays(wStart, i); if (d.getDate() === 1 || (w === 0 && i === 0)) { if (d.getMonth() !== lastMonth) { label = MON_SHORT[d.getMonth()]; lastMonth = d.getMonth(); } break; } }
      months += '<span class="hm-m">' + label + '</span>';
      let col = '';
      for (let i = 0; i < 7; i++) {
        const d = Streak.addDays(wStart, i);
        const k = Streak.key(d);
        if (k > todayKey) { col += '<span class="hm-c future"></span>'; continue; }
        const n = counts[k] || (days.has(k) ? 1 : 0);
        const lv = level(n);
        const cls = 'hm-c l' + lv + (skips.has(k) && !n ? ' skip' : '') + (k === todayKey ? ' today' : '');
        const title = d.getDate() + ' ' + MON_SHORT[d.getMonth()] + ' ' + d.getFullYear() + ': ' + (n ? n + ' ' + tasksWord(n) : skips.has(k) ? 'пропуск (огонёк прощает)' : 'нет заданий');
        col += '<span class="' + cls + '" title="' + title + '"></span>';
      }
      cols += '<div class="hm-col">' + col + '</div>';
    }
    return '<div class="hm-scroll" id="hm-scroll"><div class="hm">' +
      '<div class="hm-months"><span class="hm-wd-pad"></span>' + months + '</div>' +
      '<div class="hm-body"><div class="hm-wd"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>' + cols + '</div>' +
      '</div></div>' +
      '<div class="hm-legend"><span>меньше</span><span class="hm-c l0"></span><span class="hm-c l1"></span><span class="hm-c l2"></span><span class="hm-c l3"></span><span class="hm-c l4"></span><span>больше</span><span class="sp"></span><span class="hm-c skip"></span><span>прощённый пропуск</span></div>';
  }

  function streakCardHTML() {
    const s = Profile.streak();
    const on = s.state === 'lit' || s.state === 'pending';
    const counts = Profile.me.counts || {};
    const days = Profile.me.days || [];
    const today = new Date();
    const weekKeys = []; for (let i = 0; i < 7; i++) weekKeys.push(Streak.key(Streak.addDays(today, -i)));
    const week = weekKeys.reduce((a, k) => a + (counts[k] || 0), 0);
    const total = Object.keys(counts).reduce((a, k) => a + counts[k], 0);
    const halfYear = Streak.key(Streak.addDays(today, -182));
    const activeDays = days.filter((k) => k >= halfYear).length;
    const narrow = window.innerWidth < 640;
    return '<div class="streak-head">' +
        '<div class="streak-big ' + (on ? 'on' : '') + '">' + flame(on ? '' : 'off', 54) + '</div>' +
        '<div style="flex:1;min-width:0"><div class="streak-num">' + s.count + ' <span>' + daysWord(s.count) + ' подряд</span></div><div class="muted" style="font-size:13px">' + (s.state === 'lit' ? 'Сегодня огонёк уже горит' : s.state === 'pending' ? 'Сегодня ещё не решали' : s.state === 'frozen' ? 'Огонёк потух — ещё можно спасти' : 'Огонёк не горит') + '</div></div>' +
        '<button type="button" class="modal-x" id="modal-close" aria-label="Закрыть">×</button>' +
      '</div>' +
      '<div class="streak-msg ' + s.state + '">' + streakText(s) + '</div>' +
      '<div class="streak-stats">' +
        '<div class="stat"><b>' + s.best + '</b><span>рекорд, ' + daysWord(s.best) + '</span></div>' +
        '<div class="stat"><b>' + activeDays + '</b><span>активных дней за полгода</span></div>' +
        '<div class="stat"><b>' + week + '</b><span>' + tasksWord(week) + ' за 7 дней</span></div>' +
        '<div class="stat"><b>' + total + '</b><span>' + tasksWord(total) + ' всего</span></div>' +
      '</div>' +
      '<h3 style="margin:18px 0 10px">Активность</h3>' +
      heatmapHTML(narrow ? 18 : 26) +
      '<div class="hint" style="margin-top:12px">День засчитывается, если вы ответили хотя бы на одно задание — в соло или в дуэли. Один пропущенный день огонёк прощает: он сереет, а если решить задание на следующий день, серия восстановится. Два пропуска подряд — серия сгорает.</div>';
  }

  function openStreak() {
    let m = $('#modal');
    if (!m) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
    m.innerHTML = '<div class="modal-box card streak-modal" role="dialog" aria-label="Огонёк">' + streakCardHTML() + '</div>';

    const sc = $('#hm-scroll'); if (sc) sc.scrollLeft = sc.scrollWidth;
    const close = () => { m.classList.remove('show'); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    $('#modal-close').onclick = close;
    m.onclick = (e) => { if (e.target === m) close(); };
  }

  function bindStreakCard() {}


  /* ---------- аккаунт Google ---------- */

      <button class="btn google wide" id="login">${GOOGLE_G} Войти через Google</button>${err}`;

  async function doLogin() {
    Cloud.clearError();
    try { await Cloud.signIn(); }
    catch (e) { toast(e.message || 'Не удалось войти'); }
  }

  function bindAccount() {
    if ($('#login')) $('#login').onclick = doLogin;
    if ($('#logout')) $('#logout').onclick = async () => {
      if (app.game && app.game.mode !== 'solo' && app.game.S && app.game.S.phase !== 'over') { toast('Сначала завершите дуэль'); return; }
      await Cloud.signOut();
      app.name = '';
      toast('Вы вышли из аккаунта');
    };
  }

  function onCloudChange() {
    app.name = Profile.me.name || '';
    renderHeaderAvatar();
    if (!app.game && (app.tab === 'duel' || app.tab === 'solo') && !$('[data-first-name]:focus')) render();
    if (Cloud.user && Profile.me.isNew) { Profile.me.isNew = false; toast('Аккаунт создан! Профиль сохранён в Google-аккаунте'); }
    if (app.tab === 'profile' && !(app.game && app.tab === (app.game.mode === 'solo' ? 'solo' : 'duel'))) renderProfile();
    else if (!app.game) {
      $$('[data-name]').forEach((inp) => { if (inp !== document.activeElement) inp.value = app.name; });
    }
  }

  // Соперник: его визитка или заглушка по имени
  function oppProfile(S, role) {
    const g = app.game;
    const p = S.players[role];
    if (!p) return null;
    if (role === myRole()) return Profile.shared();
    return g.oppProfile || Profile.fallback(p.name);
  }

  function recordResult(g) {
    const S = g.S;
    if (!S.history.length && S.reason !== 'leave') return;
    const me = myRole();
    const key = (S.code || 'solo') + ':' + (S.id || '') + ':' + (S.gameNo || 1) + ':' + me;
    const solved = S.history.filter((h) => h[me]).length;
    if (isSolo(S)) Profile.record(key, { mode: 'solo', solved });
    else Profile.record(key, { mode: 'duel', solved, outcome: S.winner === 'draw' ? 'draw' : S.winner === me ? 'win' : 'loss' });
  }

    main().innerHTML = `

      <h1>Мой профиль</h1>

      <div class="profile-grid">
        <div class="stack">
          <section class="card">
            <h2>Аватар</h2>

            <div class="field"><label for="p-bio">Описание</label>
              <textarea class="input" id="p-bio" rows="3" maxlength="${Profile.BIO_MAX}" placeholder="Например: 11 класс, целюсь на 90+, люблю параметры">${esc(p.bio)}</textarea>
              <div class="hint"><span id="bio-count">${p.bio.length}</span>/${Profile.BIO_MAX} · сохраняется автоматически</div>
            </div>
          </section>
          <section class="card">
            <h3>🏅 Витрина достижений</h3>

            <div class="card-colors">${Profile.CARDS.map((c, i) => `<button type="button" class="cc${(Profile.me.card | 0) === i ? ' on' : ''}${c ? '' : ' none'}" data-card="${i}" style="${c ? '--pc:' + c : ''}" title="${c ? 'Цвет ' + i : 'Стандартный'}" aria-label="${c ? 'Цвет ' + i : 'Стандартный цвет'}"></button>`).join('')}</div>
            <div class="lbl" style="margin:14px 0 8px">Цвет плиток статистики</div>
            <div class="card-colors">${Profile.CARDS.map((c, i) => `<button type="button" class="cc${(Profile.me.tile | 0) === i ? ' on' : ''}${c ? '' : ' none'}" data-tile="${i}" style="${c ? '--pc:' + c : ''}" title="${c ? 'Цвет ' + i : 'Стандартный'}" aria-label="${c ? 'Цвет плиток ' + i : 'Стандартный цвет плиток'}"></button>`).join('')}</div>
          </section>
          <section class="card">
            <h3>Статистика</h3>
            <div class="pstats" id="my-stats"${tileAttr(Profile.me)}>
              <div class="stat"><b>${st.duels}</b><span>дуэлей</span></div>
              <div class="stat"><b>${st.wins}</b><span>побед</span></div>
              <div class="stat"><b>${st.losses}</b><span>поражений</span></div>
              <div class="stat"><b>${st.draws}</b><span>ничьих</span></div>
              <div class="stat"><b>${st.solo}</b><span>соло-игр</span></div>

              <div class="stat"><b>${st.solved}</b><span>задач решено</span></div>
              <div class="stat"><b>${st.duels ? Math.round((st.wins / st.duels) * 100) : 0}%</b><span>побед в дуэлях</span></div>

    bindCommon();
    bindAccount();
    bindFriends();
    bindNick();
    $$('[data-card]').forEach((b) => (b.onclick = () => {
      Profile.me.card = +b.dataset.card; Profile.save();
      $$('[data-card]').forEach((x) => x.classList.toggle('on', x === b));
      updateProfilePreview();
    }));
    if ($('#view-me')) $('#view-me').onclick = () => showProfileModal(Object.assign({ uid: Cloud.user ? Cloud.user.uid : '', self: true, online: true }, Profile.publicData()));
    $$('[data-tile]').forEach((b) => (b.onclick = () => {
      Profile.me.tile = +b.dataset.tile; Profile.save();
      $$('[data-tile]').forEach((x) => x.classList.toggle('on', x === b));
      const ms = $('#my-stats'), c = Profile.CARDS[Profile.me.tile | 0];
      if (ms) { ms.removeAttribute('data-tc'); ms.classList.toggle('tc', !!c); if (c) ms.style.setProperty('--tc', c); else ms.style.removeProperty('--tc'); }
    }));
    const bio = $('#p-bio');

      updateProfilePreview();

    $('#photo-in').onchange = async (e) => {

      try {

        if (!Profile.save()) { Profile.me.photo = null; toast('Не удалось сохранить фото в браузере'); }
        else toast('Фото обновлено');
      } catch (err) { toast(err.message || 'Не удалось загрузить фото'); }
      renderProfile(); renderHeaderAvatar();

  const SUBJ_NAME = { math: 'Профильная математика', rus: 'Русский язык', soc: 'Обществознание', bio: 'Биология', phys: 'Физика', chem: 'Химия' };
  const SUBJ_ICON = { math: '📐', rus: '📖', soc: '🏛️', bio: '🧬', phys: '⚛️', chem: '🧪' };
  function favTile() {
    const f = Profile.favorite();
    return `<div class="stat fav-stat"><b>${f ? SUBJ_ICON[f.id] + ' ' + SUBJ_NAME[f.id] : '—'}</b><span>любимый предмет${f ? ' · ' + f.count + ' ' + tasksWord(f.count) : ' — решите пару заданий'}</span></div>`;
  }
  const statusHTML = (fp) => `<span class="st-dot ${fp.online ? 'on' : ''}"></span>${fp.online ? 'Онлайн' : 'Оффлайн'}`;

  /* ---------- приглашения в дуэль ---------- */
  function openInviteModal(fp) {
    const subs = ['rus', 'math', 'soc', 'bio', 'phys'];
    let pick = SUBJ[app.subject] ? app.subject : 'math';
    const m = modal(`<div class="row" style="align-items:center"><h3 style="margin:0">⚔️ Дуэль с ${esc(fp.name)}</h3><span class="sp"></span><button type="button" class="modal-x" data-close aria-label="Закрыть">×</button></div>
      <p class="muted" style="font-size:14px;margin:8px 0 12px">Выберите предмет. Затем вы настроите комнату (время, жизни, задания), и после её создания ${esc(fp.name)} получит приглашение.</p>
      <div class="inv-subj">${subs.map((x) => `<button type="button" class="chip${x === pick ? ' on' : ''}" data-isub="${x}">${SUBJ_ICON[x]} ${SUBJ_NAME[x]}</button>`).join('')}</div>
      <div class="actions" style="justify-content:flex-end"><button type="button" class="btn" id="inv-go">Настроить комнату →</button></div>`);
    $$('[data-isub]', m.el).forEach((b) => (b.onclick = () => { pick = b.dataset.isub; $$('[data-isub]', m.el).forEach((x) => x.classList.toggle('on', x === b)); }));
    $('#inv-go', m.el).onclick = () => {
      if (app.game) { toast('Сначала завершите текущую игру'); return; }
      app.invite = { uid: fp.uid, name: fp.name, subject: pick };
      app.subject = pick; app.tab = 'duel'; app.joinError = '';
      m.close(); render(); animatePage(); window.scrollTo(0, 0);
    };
  }
  function inviteBanner() {
    const iv = app.invite;
    if (!iv) return '';
    if (iv.subject !== app.subject) { app.invite = null; return ''; }
    return `<div class="notice invite-note" style="margin-bottom:18px">⚔️ Приглашение для <b>${esc(iv.name)}</b>: настройте комнату и нажмите «Создать комнату» — друг сразу получит приглашение. <button type="button" class="link" id="inv-cancel">Отменить</button></div>`;
  }
  function sendPendingInvite(code) {
    const iv = app.invite;
    if (!iv) return;
    app.invite = null;
    app.invitedUid = iv.uid;
    Cloud.sendInvite(iv.uid, code, iv.subject).then(() => toast('Приглашение отправлено: ' + iv.name)).catch((e) => toast('Не удалось отправить приглашение: ' + (e.message || e)));
  }
  let invList = [];
  const invHidden = {};
  function showInvites(list) {
    invList = list || [];
    let box = $('#invite-pop');
    const iv = invList.find((x) => !invHidden[x.id + x.code]);
    if (!iv) { if (box) box.remove(); return; }
    if (!box) { box = document.createElement('div'); box.id = 'invite-pop'; box.className = 'invite-pop card'; document.body.appendChild(box); }
    box.innerHTML = `<div class="ip-title">⚔️ Приглашение в дуэль</div>
      <div class="ip-text"><b>${esc(iv.name)}</b>${iv.tag ? ' <span class="muted">#' + esc(iv.tag) + '</span>' : ''} зовёт вас сразиться · ${SUBJ_ICON[iv.subject]} ${SUBJ_NAME[iv.subject]}</div>
      <div class="actions" style="margin-top:10px"><button type="button" class="btn" id="ip-yes">Принять</button><button type="button" class="btn ghost" id="ip-no">Отклонить</button></div>`;
    $('#ip-no').onclick = () => { invHidden[iv.id + iv.code] = 1; Cloud.dropInvite(iv.id); showInvites(invList); };
    $('#ip-yes').onclick = () => {
      if (app.game && app.game.S && app.game.S.phase !== 'over') { toast('Сначала завершите текущую игру'); return; }
      if (app.game) leaveGame(true);
      invHidden[iv.id + iv.code] = 1; Cloud.dropInvite(iv.id); showInvites(invList);
      if (!app.name.trim()) app.name = Profile.me.name || 'Игрок';
      app.subject = iv.subject; app.tab = 'duel';
      joinRoom(iv.code);
    };
  }

  /* ---------- #, друзья, поиск профилей ---------- */
  function nickFieldHTML() {
    const ni = Profile.nickInfo();
    const when = ni.nextAt ? new Date(ni.nextAt).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
    const hint = !ni.has ? 'Придумайте никнейм — его увидят соперники и друзья. Потом менять можно раз в неделю.'
      : ni.canChange ? 'Никнейм можно менять раз в неделю.' : 'Следующая смена никнейма — ' + when + '.';
    return `<div class="field"><label for="p-name">Никнейм</label>
      <div class="answer-row"><input class="input" id="p-name" maxlength="24" placeholder="Например, mathking" value="${esc(Profile.me.name)}" ${ni.canChange ? '' : 'disabled'} autocomplete="off"><button type="button" class="btn" id="nick-save" ${ni.canChange ? '' : 'disabled'}>Сохранить</button></div>
      <div class="hint">${ni.canChange ? '' : '🔒 '}${hint}</div></div>`;
  }
  function bindNick() {
    const inp = $('#p-name'), btn = $('#nick-save');
    if (!inp || !btn) return;
    const go = () => {
      const v = inp.value;
      if (Profile.me.name && v.trim() !== Profile.me.name && !confirm('Сменить никнейм на «' + v.trim() + '»? Следующий раз его можно будет поменять только через неделю.')) return;
      const err = Profile.setNick(v);
      if (err) { toast(err); return; }
      app.name = Profile.me.name;
      toast('Никнейм сохранён');
      renderProfile(); renderHeaderAvatar();
    };
    btn.onclick = go;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  }
  // если никнейма ещё нет, а игрок ввёл его на странице дуэли/соло — сохраняем как первый никнейм
  function commitFirstNick() {
    if (!Profile.me.name && app.name.trim().length >= 2) { Profile.setNick(app.name); renderHeaderAvatar(); }
    if (Profile.me.name) app.name = Profile.me.name;
  }

  function friendsCardHTML() {
    if (!Cloud.available) return '<h3>Друзья</h3><p class="muted" style="margin:0">Друзья доступны только на сайте с подключённым входом через Google.</p>';
    if (!Cloud.user) return `<h3>Друзья</h3><p class="muted" style="margin:0 0 12px;font-size:14px">Войдите через Google — вы получите свой уникальный # и сможете находить друзей по их #.</p><button class="btn google wide" id="login2">${GOOGLE_G} Войти через Google</button>`;
    const tag = Profile.me.tag;
    return `<div class="row" style="align-items:center"><h3 style="margin:0">Друзья</h3><span class="sp"></span><button type="button" class="btn" id="add-friend">＋ Добавить друга</button></div>
      <div class="my-tag">Ваш #: ${tag ? `<b>#${esc(tag)}</b> <button type="button" class="link" id="copy-tag">Скопировать</button>` : '<span class="muted">выдаётся…</span>'}</div>
      <div class="hint" style="margin:0 0 12px">Отправьте свой # другу — по нему он найдёт ваш профиль.</div>
      <div id="friends-list"><div class="waiting"><span class="dot-pulse"></span> Загружаем друзей…</div></div>`;
  }

  function tileAttr(p) { const c = p && Profile.CARDS[Math.max(0, Math.min(16, p.tile | 0))]; return c ? ` style="--tc:${c}" data-tc` : ''; }
  function cardColor(fp) { return (fp && Profile.CARDS[Math.max(0, Math.min(16, fp.card | 0))]) || null; }
  function friendRow(fp) {
    const cc = cardColor(fp);
    return `<div class="friend-row${cc ? ' tinted' : ''}"${cc ? ` style="--pc:${cc}"` : ''} role="button" tabindex="0" data-friend="${esc(fp.uid)}">${Profile.avatar(fp, 40)}<span class="fr-main"><b>${esc(fp.name)}</b><span class="muted"><span class="fr-st ${fp.online ? 'on' : ''}">${statusHTML(fp)}</span> · #${esc(fp.tag || '')}${fp.stats && fp.stats.streak ? ' · 🔥 ' + fp.stats.streak : ''}</span></span>${fp.online ? `<button type="button" class="btn soft fr-inv" data-invite="${esc(fp.uid)}">⚔️ Позвать</button>` : ''}<span class="fr-go">›</span></div>`;
  }

  async function loadFriends() {
    const box = $('#friends-list');
    if (!box || !Cloud.user) return;
    if (!(Profile.me.friends || []).length) { box.innerHTML = '<p class="muted" style="margin:0;font-size:14px">Пока никого нет. Нажмите «Добавить друга» и введите его #.</p>'; return; }
    try {
      const list = await Cloud.friendsProfiles();
      app.friendsCache = list;
      const b2 = $('#friends-list');
      if (!b2) return;
      b2.innerHTML = list.length ? list.map(friendRow).join('') : '<p class="muted" style="margin:0;font-size:14px">Не удалось найти профили друзей.</p>';
      const byUid = (id) => (app.friendsCache || []).find((x) => x.uid === id);
      $$('[data-friend]').forEach((b) => { b.onclick = () => { const fp = byUid(b.dataset.friend); if (fp) showProfileModal(fp); }; b.onkeydown = (e) => { if (e.key === 'Enter') b.click(); }; });
      $$('[data-invite]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const fp = byUid(b.dataset.invite); if (fp) openInviteModal(fp); }));
      clearTimeout(app.friendsTimer);
      app.friendsTimer = setTimeout(() => { if (app.tab === 'profile' && $('#friends-list') && !$('#modal.show')) loadFriends(); }, 60000);
    } catch (e) { box.innerHTML = '<p class="notice bad" style="margin:0">Не удалось загрузить друзей. Проверьте интернет.</p>'; }
  }

  function bindFriends() {
    if ($('#login2')) $('#login2').onclick = doLogin;
    if ($('#copy-tag')) $('#copy-tag').onclick = () => copy('#' + Profile.me.tag);
    if ($('#add-friend')) $('#add-friend').onclick = openFindModal;
    loadFriends();
  }

  function modal(html) {
    let m = $('#modal');
    if (!m) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
    m.innerHTML = `<div class="modal-box card" role="dialog">${html}</div>`;
    m.classList.add('show');
    const close = () => { m.classList.remove('show'); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    m.onclick = (e) => { if (e.target === m) close(); };
    $$('[data-close]', m).forEach((b) => (b.onclick = close));
    return { el: m, close };
  }

  function profileBlock(fp) {
    const st = fp.stats || {};
    return `<div class="pview">
      ${Profile.avatar(fp, 84)}

  function showProfileModal(fp) {

    const btn = isMe ? '<div class="notice" style="width:100%;text-align:center">Это ваш профиль</div>'
      : isFriend ? (fp.online ? '<button type="button" class="btn" id="fr-invite">⚔️ Позвать в дуэль</button>' : '') + '<button type="button" class="btn danger" id="fr-remove">Удалить из друзей</button>'
      : '<button type="button" class="btn" id="fr-add">＋ Добавить в друзья</button>';
    const m = modal(`<div class="row" style="justify-content:flex-end"><button type="button" class="modal-x" data-close aria-label="Закрыть">×</button></div>${profileBlock(fp)}<div class="actions" style="justify-content:center">${btn}</div>`);
    const cc = cardColor(fp), box = $('.modal-box', m.el);
    if (cc && box) { box.classList.add('tinted'); box.style.setProperty('--pc', cc); }
    const add = $('#fr-add', m.el), rem = $('#fr-remove', m.el), inv = $('#fr-invite', m.el);
    if (inv) inv.onclick = () => { m.close(); openInviteModal(fp); };
    if (add) add.onclick = async () => {
      add.disabled = true;
      try { await Cloud.addFriend(fp.uid); toast(fp.name + ' теперь у вас в друзьях'); m.close(); renderProfile(); }
      catch (e) { add.disabled = false; toast(e.message || 'Не удалось добавить'); }
    };
    if (rem) rem.onclick = async () => {
      if (!confirm('Удалить ' + fp.name + ' из друзей?')) return;
      try { await Cloud.removeFriend(fp.uid); toast('Удалено из друзей'); m.close(); renderProfile(); }
      catch (e) { toast(e.message || 'Не удалось удалить'); }
    };
  }

  function openFindModal() {
    const m = modal(`<div class="row" style="align-items:center"><h3 style="margin:0">Добавить друга</h3><span class="sp"></span><button type="button" class="modal-x" data-close aria-label="Закрыть">×</button></div>

      <div id="find-res" style="margin-top:14px"></div>`);
    const inp = $('#find-tag', m.el), res = $('#find-res', m.el);
    const go = async () => {
      res.innerHTML = '<div class="waiting"><span class="dot-pulse"></span> Ищем…</div>';
      try {
        const fp = await Cloud.findByTag(inp.value);
        if (!fp) { res.innerHTML = '<div class="notice bad">Профиль с таким # не найден.</div>'; return; }
        showProfileModal(fp);
      } catch (e) { res.innerHTML = `<div class="notice bad">${esc(e.message || 'Ошибка поиска')}</div>`; }
    };
    $('#find-go', m.el).onclick = go;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    setTimeout(() => inp.focus(), 50);
  }

              <li><b>Задания 1–12:</b> целое число или конечная десятичная дробь, как в бланке ЕГЭ: <code>-12</code>, <code>0,25</code>.</li>
              <li><b>№13:</b> корни из пункта б) через «;»: <code>-7π/6; 3π/2</code>.</li>
              <li><b>№14, 16, 17, 19:</b> число; можно дроби и корни: <code>6√3</code>, <code>199/19</code>.</li>
              <li><b>№15, 18:</b> промежутки: <code>(-∞; 1] ∪ (3; 5) ∪ {7}</code>. Под полем ввода есть кнопки для ∞, ∪, π, √.</li>
            </ul>`}
          </section>
          <section class="card">
            <h3>Онлайн</h3>
            <p style="color:var(--ink2);font-size:14px;margin:0">Дуэль работает через бесплатный публичный сервер обмена сообщениями (MQTT по защищённому WebSocket). Регистрация не нужна. Если первый сервер недоступен, комната автоматически создаётся на запасном. Если страница случайно перезагрузилась, игра восстановится.</p>
          </section>
        </div>
      </div>`;
    bindCommon();
  }

  function bindCommon() {
    $$('[data-first-name]').forEach((inp) => {
      inp.addEventListener('input', (e) => { app.name = e.target.value; $$('[data-first-name]').forEach((o) => { if (o !== inp) o.value = app.name; }); });
      inp.addEventListener('change', () => { commitFirstNick(); });
    });
    $$('[data-nick-edit]').forEach((b) => (b.onclick = () => { app.tab = 'profile'; render(); animatePage(); window.scrollTo(0, 0); }));
    $$('[data-go]').forEach((b) => (b.onclick = () => { app.tab = b.dataset.go; render(); }));
    $$('section.card').forEach((card) => {
      card.addEventListener('click', (e) => {
        const el = e.target.closest('[data-set]');
        if (!el || el.tagName === 'INPUT') return;
        const key = card.querySelector('#create') ? 'duel' : 'solo';
        onSettingsClick(key, el);
      });
      card.addEventListener('change', (e) => {
        const key = card.querySelector('#create') ? 'duel' : 'solo';
        const rn = e.target.closest('[data-set="rounds-num"]');
        if (rn) {
          draft(key).rounds = Math.max(1, Math.min(100, Math.round(+rn.value || 1)));
          saveDraft(key);
          render();
          return;
        }
        const el = e.target.closest('[data-set="time-min"]');
        if (!el) return;
        const m = Math.max(1, Math.min(60, Math.round(+el.value || 1)));
        draft(key).time = m * 60;
        saveDraft(key);
        render();
      });
    });
  }

  /* ---------- экран игры ---------- */
  function names(S) {
    const me = myRole(), opp = me === 'host' ? 'guest' : 'host';
    return { me, opp, meP: S.players[me], oppP: S.players[opp] };
  }

  function renderGame() {
    const g = app.game, S = g.S;
    if (!S) {
      main().innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Подключаемся к комнате ${esc(g.link ? g.link.code : '')}…</div><div class="actions" style="justify-content:center"><button class="btn ghost" id="leave">Отмена</button></div></div>`;
      $('#leave').onclick = () => leaveGame(true);
      return;
    }
    if (g.mode === 'guest' && !S.players.guest) {
      main().innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Входим в комнату ${esc(S.code)}…</div><div class="actions" style="justify-content:center"><button class="btn ghost" id="leave">Отмена</button></div></div>`;
      $('#leave').onclick = () => leaveGame(true);
      return;
    }
    if (S.phase === 'lobby') return renderLobby();
    const key = [S.code, S.phase, S.round].join('|');
    if (app.rendered !== key) {
      if (g.ui.lastKeyRound !== S.round) { g.ui.draft = ''; g.ui.lastKeyRound = S.round; }
      app.rendered = key;
      g.ui.showFull = false;
      main().innerHTML = `<div id="hud"></div><div id="tbar"></div><div id="body"></div>`;
      renderBody();
      window.scrollTo({ top: 0 });
    } else {
      patchBody();
    }
    renderHud();
  }

  function renderLobby() {
    const g = app.game, S = g.S;
    app.rendered = null;
    const url = location.href.split('?')[0].split('#')[0] + '?room=' + S.code;
    const local = location.protocol === 'file:';
    main().innerHTML = `
      <div class="grid2">
        <section class="card">
          <h2>Комната создана</h2>
          <div class="code-box">
            <div class="muted" style="font-weight:700;font-size:13px">КОД КОМНАТЫ</div>
            <div class="code">${esc(S.code)}</div>
            <div class="row" style="justify-content:center;margin-top:10px"><button class="btn soft" id="copy-code">Скопировать код</button>${navigator.share ? '<button class="btn soft" id="share">Поделиться</button>' : ''}</div>
          </div>
          <div class="field" style="margin-top:16px"><span class="lbl">Ссылка-приглашение</span>
            <div class="share-row"><input class="input" readonly value="${esc(url)}" id="link"><button class="btn" id="copy-link">Копировать</button></div>
            ${local ? '<div class="hint">Сайт открыт как файл на компьютере, поэтому ссылка у друга не откроется. Отправьте ему этот же файл и код комнаты: он откроет файл и введёт код во вкладке «Дуэль».</div>' : '<div class="hint">Друг откроет ссылку, введёт имя — и дуэль начнётся.</div>'}
          </div>
          <div class="waiting" style="margin-top:18px"><span class="dot-pulse"></span> Ждём соперника…</div>
        </section>
        <section class="card">
          <h3>Настройки комнаты</h3>
          <dl class="summary">
            <dt>Предмет</dt><dd>${SUBJ[subjOfState(S)].name}</dd>
            <dt>Создатель</dt><dd>${esc(S.players.host.name)}</dd>
            <dt>Время на ответ</dt><dd>${timeLabel(S.settings.time)}</dd>
            <dt>Жизни</dt><dd>${S.settings.lives || '∞ безлимит'}</dd>
            <dt>Раунды</dt><dd>${roundsLabel(S.settings.rounds)}</dd>
            <dt>Задания</dt><dd>${esc(numsLabel(S.settings))}</dd>
          </dl>
          <div class="actions"><button class="btn danger" id="leave">Закрыть комнату</button></div>
        </section>
      </div>`;
    $('#copy-code').onclick = () => copy(S.code);
    $('#copy-link').onclick = () => copy(url);
    if ($('#share')) $('#share').onclick = () => navigator.share({ title: 'ЕГЭ-дуэль', text: 'Давай сразимся в заданиях ЕГЭ (' + SUBJ[subjOfState(S)].short + ')! Код комнаты: ' + S.code, url: local ? undefined : url }).catch(() => {});
    $('#leave').onclick = () => leaveGame(true);
  }

  function renderHud() {
    const g = app.game, S = g.S;
    const hud = $('#hud');
    if (!hud) return;
    const { me, opp, meP, oppP } = names(S);
    const solo = isSolo(S);
    const statusOf = (role, p) => {
      if (!p) return '';
      const online = role === me ? true : g.oppOnline !== false;
      if (!online && !solo) return '<span class="pstat off">● не в сети</span>';
      if (S.phase === 'question') return p.answered || (role === me && g.ui.pendingAnswer) ? '<span class="pstat ok">✓ ответ дан</span>' : '<span class="pstat">думает…</span>';
      if (S.phase === 'result' || S.phase === 'ready') return p.ready || (role === me && g.ui.pendingReady) ? '<span class="pstat ok">✓ готов</span>' : '<span class="pstat">читает разбор</span>';
      if (S.phase === 'over' && (S.reason === 'lives' || S.reason === 'rounds')) return p.ready || (role === me && g.ui.pendingReady) ? '<span class="pstat ok">✓ хочет реванш</span>' : '';
      return '';
    };
    const max = S.settings.lives;
    let center = '';
    if (S.phase === 'question') {
      if (S.deadline) {
        const rem = S.deadline - (Date.now() + (me === 'guest' ? g.offset || 0 : 0));
        center = `<div class="round-lbl">Раунд ${S.round}${S.settings.rounds ? " из " + S.settings.rounds : ""}</div><div class="timer ${rem < 10000 ? 'low' : ''}" id="timer">${fmtTime(rem)}</div>`;
      } else center = `<div class="round-lbl">Раунд ${S.round}${S.settings.rounds ? " из " + S.settings.rounds : ""}</div><div class="timer inf">∞</div>`;
    } else center = `<div class="round-lbl">${S.phase === 'ready' ? 'Подготовка' : S.phase === 'over' ? 'Игра окончена' : 'Раунд ' + S.round}</div>`;
    hud.className = 'hud';
    hud.innerHTML = `
      <div class="player"><div class="pwho">${Profile.avatar(Profile.shared(), 34)}<div class="pname">${esc(meP.name)} <span class="muted" style="font-weight:600">(вы)</span></div></div>${hearts(meP.lives, max)}${statusOf(me, meP)}</div>
      <div class="center-hud">${center}</div>
      ${solo ? `<div class="player right"><div class="pname">Соло</div><div class="pstat">Решено: ${S.history.filter((h) => h.host).length} из ${S.history.length}</div></div>`
        : oppP ? `<div class="player right"><button type="button" class="pwho opp-btn" id="opp-btn" title="Профиль соперника"><div class="pname">${esc(oppP.name)}</div>${Profile.avatar(oppProfile(S, opp), 34)}</button>${hearts(oppP.lives, max)}${statusOf(opp, oppP)}</div>` : '<div></div>'}`;
    const ob = $('#opp-btn');
    if (ob) ob.onclick = () => showOppCard(S, opp);
    const tb = $('#tbar');
    if (tb) {
      if (S.phase === 'question' && S.deadline) {
        const rem = S.deadline - (Date.now() + (me === 'guest' ? g.offset || 0 : 0));
        const pct = Math.max(0, Math.min(100, (rem / (S.settings.time * 1000)) * 100));
        tb.className = 'tbar' + (rem < 10000 ? ' low' : '');
        tb.innerHTML = `<i style="width:${pct}%"></i>`;
      } else { tb.className = ''; tb.innerHTML = ''; }
    }
  }

  function showOppCard(S, role) {
    let m = $('#modal');
    if (!m) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
    m.innerHTML = `<div class="modal-box card">${Profile.card(oppProfile(S, role), 'Соперник')}<div class="actions" style="justify-content:flex-end"><button class="btn ghost" id="modal-close">Закрыть</button></div></div>`;
    m.classList.add('show');
    const close = () => m.classList.remove('show');
    $('#modal-close').onclick = close;
    m.onclick = (e) => { if (e.target === m) close(); };
  }

  function taskCard(S) {
    const t = S.task;
    return `<section class="card" id="taskcard">
      <div class="task-head"><span class="badge ${t.num >= SUBJ[subjOfState(S)].part2From ? 'p2' : ''}">№ ${t.num}</span><span class="task-topic">${esc(titleOf(subjOfState(S), t.num))}</span><span class="src">${t.source === 'fipi' ? 'по материалам ФИПИ' : 'по прототипу ФИПИ'}</span></div>
      <div class="task-text" id="tasktext">${t.text}${t.svg || ''}</div>
      <div id="answerbox"></div>
    </section>`;
  }

  const KEYS = {
    digits: [], digitset: [], word: [], numlist: [], pm: ['±', ','],
    num: ['-', ','],
    expr: ['-', ',', '/', '√', 'π', '(', ')', '^'],
    set: ['-', 'π', '/', ';', '√', ','],
    interval: ['(', ')', '[', ']', ';', '-', '∞', '∪', '{', '}', '/', '√', 'log_'],
  };
  const PLACEHOLDER = { pm: 'Например: 2,4 ± 0,2', digits: 'Только цифры, например: 21122', digitset: 'Только цифры, например: 135', word: 'Впишите термин', numlist: 'Номера предложений, например: 1215', num: 'Например: 2,5', expr: 'Число, например 2,4 или 6√3', set: 'Например: -7π/6; 3π/2', interval: 'Например: (-∞; 1] ∪ {3}' };

  function answerBoxHTML(S) {
    const g = app.game;
    const me = myRole();
    const mine = S.players[me];
    const sent = mine.answered || g.ui.pendingAnswer;
    const rem = S.deadline ? S.deadline - (Date.now() + (me === 'guest' ? g.offset || 0 : 0)) : Infinity;
    if (sent) {
      const waiting = !isSolo(S);
      return `<div class="answer-box"><div class="sent">${g.ui.pendingAnswer && !mine.answered ? '<span class="dot-pulse"></span> Отправляем ответ…' : '✓ Ответ принят'}${g.ui.myValue ? ': <span style="color:var(--ink)">' + esc(g.ui.myValue) + '</span>' : ''}</div>${waiting ? '<div class="waiting" style="margin-top:12px"><span class="dot-pulse"></span> Ждём ответ соперника…</div>' : ''}</div>`;
    }
    if (rem <= 0) return `<div class="answer-box"><div class="sent" style="background:var(--bad-soft);color:var(--bad)">⏰ Время вышло</div></div>`;
    const type = S.task.type;
    return `<div class="answer-box">
      <label class="lbl" for="ans">Ваш ответ</label>
      <div class="answer-row"><input class="input" id="ans" autocomplete="off" spellcheck="false" ${type === 'num' ? 'inputmode="decimal"' : type === 'digits' || type === 'digitset' || type === 'numlist' ? 'inputmode="numeric"' : ''} placeholder="${type === 'word' && subjOfState(S) === 'rus' ? 'Впишите слово (буквами)' : PLACEHOLDER[type]}" value="${esc(g.ui.draft || '')}"><button class="btn big" id="send">Ответить</button></div>
      <div class="keys">${(KEYS[type] || []).map((k) => `<button type="button" data-k="${esc(k)}">${esc(k === 'log_' ? 'log' : k === '-' ? '−' : k)}</button>`).join('')}</div>
      <div class="ferr" id="ferr"></div>
    </div>`;
  }

  function bindAnswerBox(S) {
    const g = app.game;
    const inp = $('#ans');
    if (!inp) return;
    const send = () => {
      const v = inp.value.trim();
      const err = E.formatError(S.task, v);
      if (err) { $('#ferr').textContent = err; inp.focus(); return; }
      g.ui.draft = '';
      doAnswer(v);
    };
    $('#send').onclick = send;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    inp.addEventListener('input', () => { g.ui.draft = inp.value; $('#ferr').textContent = ''; });
    $$('.keys button').forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));
    $$('.keys button').forEach((b) => (b.onclick = () => {
      const k = b.dataset.k;
      const s = inp.selectionStart !== null ? inp.selectionStart : inp.value.length, en = inp.selectionEnd !== null ? inp.selectionEnd : inp.value.length;
      inp.value = inp.value.slice(0, s) + k + inp.value.slice(en);
      inp.selectionStart = inp.selectionEnd = s + k.length;
      g.ui.draft = inp.value;
      inp.focus();
    }));
    if (window.matchMedia('(pointer:fine)').matches) inp.focus();
  }

  function verdictHTML(S) {
    const g = app.game, R = S.result;
    if (!R) return '';
    const { me, opp, meP, oppP } = names(S);
    const one = (role, p, label) => {
      const v = R.v[role];
      if (!v) return '';
      const cls = v.ok ? 'ok' : 'bad';
      const what = v.timeout ? '⏰ Время вышло' : (v.ok ? '✓ ' : '✗ ') + esc(v.value);
      return `<div class="verdict ${cls}"><div class="who">${label}</div><div class="what">${what}</div><div class="delta">${S.settings.lives ? (v.ok ? 'Жизнь сохранена' : '−1 жизнь') + ' · осталось ' + p.lives : (v.ok ? 'Верно' : 'Не засчитано') + ' · жизни не ограничены'}</div></div>`;
    };
    return `<div class="verdicts ${isSolo(S) ? 'solo' : ''}">${one(me, meP, esc(meP.name) + ' (вы)')}${!isSolo(S) && oppP ? one(opp, oppP, esc(oppP.name)) : ''}</div>`;
  }

  function solutionHTML(S) {
    const g = app.game, R = S.result;
    if (!R) return '';
    return `<div class="right-ans"><span class="muted">Правильный ответ:</span> <b>${esc(R.answer)}</b></div>
      <div class="sol"><h3>Краткое решение</h3><div class="task-text" style="font-size:16px">${R.short}</div>
        <div class="full ${g.ui.showFull ? '' : 'hide'}" id="fullsol"><h3>Подробное решение</h3><div class="task-text" style="font-size:16px">${R.full}</div></div>
        <button class="btn soft toggle-full" id="toggle-full">${g.ui.showFull ? 'Свернуть подробное решение ▴' : 'Развернуть подробное решение ▾'}</button>
      </div>`;
  }

  function nextActionsHTML(S) {
    const g = app.game;
    const me = myRole();
    const mine = S.players[me];
    const solo = isSolo(S);
    const pend = mine.ready || g.ui.pendingReady;
    if (S.phase === 'result') {
      return `<div class="actions" id="nextbox">${pend ? '<div class="waiting"><span class="dot-pulse"></span> Вы готовы. Ждём, когда соперник нажмёт «Продолжить»…</div>' : '<button class="btn big" id="next">Продолжить →</button>'}<span class="sp"></span><button class="btn danger" id="leave">${solo ? 'Завершить' : 'Выйти'}</button></div>`;
    }
    return '';
  }

  function renderBody() {
    const g = app.game, S = g.S;
    const body = $('#body');
    if (S.phase === 'ready') {
      const { meP, oppP } = names(S);
      const pend = meP.ready || g.ui.pendingReady;
      body.innerHTML = `<section class="card" style="text-align:center;padding:32px">
        <h2>${oppP ? 'Соперник найден!' : 'Ожидание'}</h2>
        <div class="versus">${Profile.card(Profile.shared(), 'Вы')}<div class="vs">VS</div>${oppP ? Profile.card(oppProfile(S, myRole() === 'host' ? 'guest' : 'host'), 'Соперник') : ''}</div>
        <p class="muted">${timeLabel(S.settings.time)} на ответ · ${livesLabel(S.settings.lives)} · ${S.settings.rounds ? S.settings.rounds + ' ' + roundsWord(S.settings.rounds) : 'раунды без ограничения'} · ${esc(numsLabel(S.settings))}</p>
        <div class="actions" style="justify-content:center" id="readybox">${pend ? '<div class="waiting"><span class="dot-pulse"></span> Ждём, когда соперник нажмёт «Начать»…</div>' : '<button class="btn big" id="next">Начать дуэль</button>'}</div>
        <div class="actions" style="justify-content:center"><button class="btn danger" id="leave">Выйти</button></div>
      </section>`;
    } else if (S.phase === 'question') {
      body.innerHTML = taskCard(S) + `<div class="actions"><span class="sp"></span><button class="btn danger" id="leave">${isSolo(S) ? 'Завершить' : 'Выйти'}</button></div>`;
      $('#answerbox').innerHTML = answerBoxHTML(S);
      typeset($('#taskcard'));
      bindAnswerBox(S);
    } else if (S.phase === 'result') {
      body.innerHTML = `<section class="card"><div id="verdicts">${verdictHTML(S)}</div>${solutionHTML(S)}${nextActionsHTML(S)}</section>` + taskReview(S);
      typeset(body);
    } else if (S.phase === 'over') {
      body.innerHTML = overHTML(S) + (S.result && (S.reason === 'lives' || S.reason === 'rounds') ? `<section class="card" style="margin-top:18px"><h2>Последний раунд</h2><div id="verdicts">${verdictHTML(S)}</div>${solutionHTML(S)}</section>` + taskReview(S) : '') + historyHTML(S);
      typeset(body);
    }
    bindBody();
  }

  function taskReview(S) {
    if (!S.task) return '';
    return `<details class="card" style="margin-top:18px"><summary style="cursor:pointer;font-weight:700">Условие задания № ${S.task.num}</summary><div class="task-text" style="margin-top:12px">${S.task.text}${S.task.svg || ''}</div></details>`;
  }

  function overHTML(S) {
    const g = app.game;
    const { me, opp, meP, oppP } = names(S);
    const solo = isSolo(S);
    let emoji, title, sub;
    const solved = S.history.filter((h) => h[me]).length;
    if (solo) {
      emoji = solved >= 10 ? '🏆' : solved >= 5 ? '💪' : '📘';
      title = S.reason === 'quit' ? 'Тренировка завершена' : S.reason === 'rounds' ? `Все ${S.settings.rounds} ${roundsWord(S.settings.rounds)} пройдены!` : 'Жизни закончились';
      sub = `Решено ${solved} из ${S.history.length}`;
    } else if (S.reason === 'leave') {
      const iWon = S.winner === me;
      emoji = iWon ? '🏆' : '🏳️'; title = iWon ? 'Победа!' : 'Вы вышли из дуэли';
      sub = iWon ? 'Соперник покинул игру.' : 'Победа присуждена сопернику.';
    } else if (S.reason === 'stop') {
      const ok = (r) => S.history.filter((h) => h[r]).length;
      const who = S.stopBy === me ? 'Вы завершили дуэль' : `${esc(oppP.name)} завершил(а) дуэль`;
      const score = `Верных ответов: ${ok(me)} : ${ok(opp)}`;
      if (S.winner === 'draw') { emoji = '🤝'; title = 'Ничья!'; sub = `${who}. ${score}`; }
      else { const iWon = S.winner === me; emoji = iWon ? '🏆' : '😔'; title = iWon ? 'Победа!' : 'Поражение'; sub = `${who}. ${score}`; }
    } else if (S.reason === 'rounds') {
      const ok = (r) => S.history.filter((h) => h[r]).length;
      const score = (S.settings.lives ? `Жизни: ${meP.lives} : ${oppP.lives} · ` : '') + `верных ответов: ${ok(me)} : ${ok(opp)}`;
      if (S.winner === 'draw') { emoji = '🤝'; title = 'Ничья!'; sub = `Все ${S.settings.rounds} ${roundsWord(S.settings.rounds)} сыграны, счёт равный. ${score}`; }
      else {
        const iWon = S.winner === me;
        const byLives = !!S.settings.lives && meP.lives !== oppP.lives;
        emoji = iWon ? '🏆' : '😔'; title = iWon ? 'Победа!' : 'Поражение';
        sub = `Все ${S.settings.rounds} ${roundsWord(S.settings.rounds)} сыграны. ${iWon ? 'У вас' : 'У соперника'} ${byLives ? 'больше жизней' : S.settings.lives ? 'жизней поровну, но больше верных ответов' : 'больше верных ответов'}. ${score}`;
      }
    } else if (S.winner === 'draw') {
      emoji = '🤝'; title = 'Ничья!'; sub = 'Жизни закончились у обоих в одном раунде.';
    } else {
      const iWon = S.winner === me;
      emoji = iWon ? '🏆' : '😔'; title = iWon ? 'Победа!' : 'Поражение';
      sub = iWon ? `У ${esc(oppP.name)} закончились жизни.` : `У вас закончились жизни. Победил(а) ${esc(oppP.name)}.`;
    }
    const pend = meP.ready || g.ui.pendingReady;
    const oppWants = oppP && oppP.ready;
    let actions = '';
    if (solo) actions = `<button class="btn big" id="again">Сыграть ещё</button><button class="btn ghost big" id="leave">В меню</button>`;
    else if ((S.reason === 'lives' || S.reason === 'rounds') && !g.oppLeft && g.oppOnline !== false) actions = (pend ? `<div class="waiting"><span class="dot-pulse"></span> Ждём ответа соперника на реванш…</div>` : `<button class="btn big" id="next">${oppWants ? 'Принять реванш' : 'Реванш'}</button>`) + `<button class="btn ghost big" id="leave">В меню</button>`;
    else actions = `<button class="btn big" id="leave">В меню</button>`;
    return `<section class="card over">
      <div class="big-emoji">${emoji}</div><h1>${title}</h1><p class="muted" style="margin:0">${sub}</p>
      <div class="stats">
        <div class="stat"><b>${S.history.length}</b><span>раундов</span></div>
        <div class="stat"><b>${solved}</b><span>верно у вас</span></div>
        ${!solo && oppP ? `<div class="stat"><b>${S.history.filter((h) => h[opp]).length}</b><span>верно у соперника</span></div>` : ''}
      </div>
      ${oppWants && !pend && (S.reason === 'lives' || S.reason === 'rounds') ? '<div class="notice" style="margin-bottom:12px">Соперник предлагает реванш!</div>' : ''}
      <div class="actions" style="justify-content:center">${actions}</div>
    </section>`;
  }

  function historyHTML(S) {
    if (!S.history.length) return '';
    const { me, opp, oppP } = names(S);
    const solo = isSolo(S);
    const mk = (v) => (v ? '<span class="mk-ok">✓</span>' : '<span class="mk-bad">✗</span>');
    return `<section class="card history" style="margin-top:18px"><h2>История раундов</h2><table><thead><tr><th>Раунд</th><th>Задание</th><th>Вы</th>${solo ? '' : '<th>' + esc(oppP ? oppP.name : 'Соперник') + '</th>'}</tr></thead><tbody>${S.history.map((h) => `<tr><td>${h.round}</td><td>№ ${h.num} · ${esc(titleOf(subjOfState(S), h.num))}</td><td>${mk(h[me])}</td>${solo ? '' : '<td>' + mk(h[opp]) + '</td>'}</tr>`).join('')}</tbody></table></section>`;
  }

  function bindBody() {
    const g = app.game;
    if ($('#next')) $('#next').onclick = doReady;
    if ($('#leave')) $('#leave').onclick = () => leaveGame(false);
    if ($('#again')) $('#again').onclick = () => { app.game = null; startSolo(); };
    if ($('#toggle-full')) $('#toggle-full').onclick = () => {
      g.ui.showFull = !g.ui.showFull;
      $('#fullsol').classList.toggle('hide', !g.ui.showFull);
      $('#toggle-full').textContent = g.ui.showFull ? 'Свернуть подробное решение ▴' : 'Развернуть подробное решение ▾';
    };
  }

  // Частичное обновление без потери введённого текста
  function patchBody() {
    const g = app.game, S = g.S;
    if (S.phase === 'question') {
      const box = $('#answerbox');
      const me = myRole();
      const rem = S.deadline ? S.deadline - (Date.now() + (me === 'guest' ? g.offset || 0 : 0)) : Infinity;
      const k = (S.players[me].answered ? 'a' : g.ui.pendingAnswer ? 'p' : rem <= 0 ? 't' : 'i');
      if (box && box.dataset.k !== k) {
        box.dataset.k = k;
        if (k === 'i' && $('#ans')) return; // поле ввода уже на месте
        box.innerHTML = answerBoxHTML(S);
        bindAnswerBox(S);
      }
    } else if (S.phase === 'result') {
      const nb = $('#nextbox');
      if (nb) { const tmp = document.createElement('div'); tmp.innerHTML = nextActionsHTML(S); nb.replaceWith(tmp.firstElementChild); bindBody(); }
    } else if (S.phase === 'ready') {
      const rb = $('#readybox');
      const pend = S.players[myRole()].ready || g.ui.pendingReady;
      if (rb) { rb.innerHTML = pend ? '<div class="waiting"><span class="dot-pulse"></span> Ждём, когда соперник нажмёт «Начать»…</div>' : '<button class="btn big" id="next">Начать дуэль</button>'; bindBody(); }
    } else if (S.phase === 'over') {
      const ov = $('.over');
      if (ov) { const tmp = document.createElement('div'); tmp.innerHTML = overHTML(S); ov.replaceWith(tmp.firstElementChild); bindBody(); }
    }
  }

  /* ---------- главный цикл: таймер ---------- */
  setInterval(() => {
    const g = app.game;
    if (!g || !g.S) return;
    const S = g.S;
    if (g.mode !== 'guest' && S.phase === 'question') {
      if (checkTimeout(S, g.P, g.mode === 'host')) { commit(); return; }
    }
    if (S.phase === 'question' && S.deadline) {
      const gameTab = g.mode === 'solo' ? 'solo' : 'duel';
      if (app.tab === gameTab) { renderHud(); patchBody(); }
    }
  }, 250);

  /* ---------- старт ---------- */
  function init() {
    $$('nav.tabs button').forEach((b) => (b.onclick = () => { if (app.tab === b.dataset.tab) return; app.tab = b.dataset.tab; app.joinError = ''; render(); animatePage(); window.scrollTo(0, 0); }));
    window.addEventListener('resize', movePill);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(movePill);
    movePill();
    setTimeout(() => { movePill(); const p = $('.tab-pill'); if (p) p.classList.add('anim'); }, 60);
    $('.logo').onclick = () => { if (app.tab === 'home') return; app.tab = 'home'; render(); animatePage(); window.scrollTo(0, 0); };
    $('#me-btn').onclick = () => { if (app.tab === 'profile') return; app.tab = 'profile'; render(); animatePage(); window.scrollTo(0, 0); };
    $('#login-btn').onclick = doLogin;
    $('#streak-btn').onclick = openStreak;
    $('#shop-btn').onclick = () => { if (app.tab === 'shop') return; app.tab = 'shop'; render(); animatePage(); window.scrollTo(0, 0); };
    Cloud.onInvites(showInvites);
    setInterval(renderHeaderAvatar, 60000); // смена суток
    Cloud.on(onCloudChange);
    Cloud.init();
    const tb = $('#theme');
    const applyTheme = (t) => { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); };
    applyTheme(store.get('egeduel:theme', null));
    tb.onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nx = cur === 'dark' ? 'light' : 'dark';
      const apply = () => { applyTheme(nx); store.set('egeduel:theme', nx); };
      tb.classList.remove('spin'); void tb.offsetWidth; tb.classList.add('spin');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { apply(); return; }
      if (!document.startViewTransition) {
        // запасной вариант для браузеров без View Transitions: плавная смена цветов
        document.documentElement.classList.add('theme-fade');
        apply();
        setTimeout(() => document.documentElement.classList.remove('theme-fade'), 600);
        return;
      }
      if (app.themeBusy) return;
      app.themeBusy = true;
      // новая тема «наезжает» диагональной полосой слева направо
      const vt = document.startViewTransition(apply);
      vt.ready.then(() => {
        document.documentElement.animate(
          { clipPath: ['polygon(0 0, 0 0, -25% 100%, -25% 100%)', 'polygon(0 0, 125% 0, 100% 100%, -25% 100%)'] },
          { duration: 750, easing: 'cubic-bezier(.65, 0, .35, 1)', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(() => {});
      const free = () => { app.themeBusy = false; };
      vt.finished.then(free, free);
      setTimeout(free, 1500);
    };
    if (new URLSearchParams(location.search).get('room')) app.tab = 'duel';
    render();
    resume();
    window.addEventListener('beforeunload', (e) => {
      const g = app.game;
      if (g && g.mode !== 'solo' && g.S && g.S.phase !== 'over' && g.S.phase !== 'lobby') { e.preventDefault(); e.returnValue = ''; }
    });
  }
  window.EGEApp = { rerender: () => { app.rendered = null; render(); }, _app: app };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
