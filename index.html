  function showProfileModal(fp, opts) {
    const isMe = fp.self || (Cloud.user && fp.uid === Cloud.user.uid);
    const isFriend = (Profile.me.friends || []).indexOf(fp.uid) >= 0;
    const freq = !isMe && !isFriend && opts && opts.freq;
    const btn = isMe ? ''
      : freq ? '<button type="button" class="btn" id="fr-yes">✓ Принять заявку</button><button type="button" class="btn ghost" id="fr-no">Отклонить</button>'
      : isFriend ? (fp.online && fp.play ? '<button type="button" class="btn" id="fr-watch">👁 Смотреть матч</button>' : fp.online ? '<button type="button" class="btn" id="fr-invite">⚔️ Позвать в дуэль</button>' : '') + '<button type="button" class="btn danger" id="fr-remove">Удалить из друзей</button>'
      : '<button type="button" class="btn" id="fr-add">＋ Добавить в друзья</button>';
    const m = modal(`<div class="row" style="justify-content:flex-end"><button type="button" class="modal-x" data-close aria-label="Закрыть">×</button></div>${profileBlock(fp)}${btn ? `<div class="actions" style="justify-content:center">${btn}</div>` : ''}`);
    m.el.classList.add('anim'); // плавное появление профиля
    const cc = cardColor(fp), box = $('.modal-box', m.el);
    if (cc && box) { box.classList.add('tinted'); box.style.setProperty('--pc', cc); }
    const add = $('#fr-add', m.el), rem = $('#fr-remove', m.el), inv = $('#fr-invite', m.el), wt = $('#fr-watch', m.el);
    if (inv) inv.onclick = () => { m.close(); openInviteModal(fp); };
    if (wt) wt.onclick = () => { m.close(); watchMatch(fp); };
    const fy = $('#fr-yes', m.el), fn = $('#fr-no', m.el);
    if (fy) fy.onclick = async () => {
      fy.disabled = true;
      try { await acceptFreq(freq); m.close(); }
      catch (e) { fy.disabled = false; toast('Не удалось принять заявку: ' + (e.message || e)); }
    };
    if (fn) fn.onclick = () => { declineFreq(freq); m.close(); };
    if (add) add.onclick = async () => {
      add.disabled = true;
      try {
        // друзьями становятся только после согласия: отправляем заявку
        const r = await Cloud.requestFriend(fp.uid);
        if (r === 'accepted') { toast(fp.name + ' теперь у вас в друзьях'); m.close(); renderProfile(); return; }
        add.textContent = '✓ Заявка отправлена';
        toast(r === 'pending' ? 'Заявка уже отправлена — ждём ответа' : r === 'already' ? fp.name + ' уже у вас в друзьях' : 'Заявка отправлена. ' + fp.name + ' увидит её в уведомлениях 🔔');
      } catch (e) { add.disabled = false; toast(e.message || 'Не удалось отправить заявку'); }
    };
    if (rem) rem.onclick = async () => {
      if (!confirm('Удалить ' + fp.name + ' из друзей?')) return;
      try { await Cloud.removeFriend(fp.uid); toast('Удалено из друзей'); m.close(); renderProfile(); }
      catch (e) { toast(e.message || 'Не удалось удалить'); }
    };
  }

      <p class="lead">Тренировка — спокойный режим без таймера и жизней. Соберите свой вариант, решайте задания в любом порядке, а ответы и разборы откроются в конце.</p>
      <div class="grid2">

    bindCommon();
    $$('[data-kind]').forEach((b) => (b.onclick = () => {
      if (app.soloKind === b.dataset.kind) return;

    if ($('#solo-start')) $('#solo-start').onclick = () => { if (canStartSolo()) startSolo(); };
    if ($('#train-start')) $('#train-start').onclick = () => { if (canStartSolo()) startTrain(); };

  /* ---------- соло: тренировка (без таймера и жизней, ответы — в конце) ---------- */
  const TRAIN_MAX = 100;
  function trainDraft() {
    const d = draft('train');
    if (!d.per || typeof d.per !== 'object') d.per = {};
    if (!Array.isArray(d.nums)) d.nums = [];
    return d;
  }
  const trainCnt = (d, n) => Math.max(1, Math.min(20, (d.per && d.per[n]) | 0 || 1));
  const trainTotal = (d) => d.nums.reduce((s, n) => s + trainCnt(d, n), 0);

  function trainSettingsHTML() {
    const d = trainDraft(), SB = SUBJ[app.subject], all = allNums(app.subject);
    d.nums = d.nums.filter((n) => all.indexOf(n) >= 0);
    const sel = d.nums.slice().sort((a, b) => a - b);
    const total = trainTotal(d);
    let s = `<div class="field"><span class="lbl">Задания</span><div class="nums">`;
    all.forEach((n) => { s += `<button type="button" class="num ${n >= SB.part2From ? 'p2' : ''} ${d.nums.indexOf(n) >= 0 ? 'on' : ''}" data-set="tnum" data-v="${n}" title="${esc(titleOf(app.subject, n))}">${n}</button>`; });
    s += `</div><div class="row" style="margin-top:10px"><button type="button" class="link" data-set="tpreset" data-v="all">Все</button><span class="muted">·</span>${SB.groups.map((g, i) => `<button type="button" class="link" data-set="tpreset" data-v="${i}">${g.label}</button><span class="muted">·</span>`).join('')}<button type="button" class="link" data-set="tpreset" data-v="none">Снять все</button></div></div>`;
    if (sel.length) {
      s += `<div class="field"><span class="lbl">Сколько раз дать каждое задание</span>
        <div class="row" style="gap:6px;margin-bottom:10px"><span class="muted" style="font-size:14px">Всем сразу:</span>${[1, 2, 3, 5, 10].map((v) => `<button type="button" class="chip ${sel.every((n) => trainCnt(d, n) === v) ? 'on' : ''}" data-set="tall" data-v="${v}">${v}</button>`).join('')}</div>
        <div class="tper-list">${sel.map((n) => `<div class="tper"><span class="badge ${n >= SB.part2From ? 'p2' : ''}">№ ${n}</span><span class="tper-t">${esc(titleOf(app.subject, n))}</span><div class="stepper sm"><button type="button" data-set="tper-" data-v="${n}" aria-label="Меньше заданий № ${n}">−</button><span>${trainCnt(d, n)}</span><button type="button" data-set="tper+" data-v="${n}" aria-label="Больше заданий № ${n}">+</button></div></div>`).join('')}</div></div>`;
      s += `<div class="field"><span class="lbl">Порядок</span><div class="seg"><button type="button" class="${d.order !== 'seq' ? 'on' : ''}" data-set="torder" data-v="random">Вперемешку</button><button type="button" class="${d.order === 'seq' ? 'on' : ''}" data-set="torder" data-v="seq">По возрастанию</button></div></div>`;
    }
    s += `<div class="hint" style="margin-bottom:14px">${sel.length ? `Всего в тренировке: <b>${Math.min(total, TRAIN_MAX)}</b> ${plural(Math.min(total, TRAIN_MAX), 'задание', 'задания', 'заданий')}${total > TRAIN_MAX ? ` (больше ${TRAIN_MAX} нельзя — лишние не войдут)` : ''}.` : 'Выберите номера заданий.'}</div>`;
    return s;
  }

  function onTrainClick(el) {
    const d = trainDraft(), k = el.dataset.set, v = el.dataset.v, n = +v;
    if (k === 'tnum') { const i = d.nums.indexOf(n); if (i >= 0) d.nums.splice(i, 1); else d.nums.push(n); }
    else if (k === 'tpreset') d.nums = v === 'none' ? [] : v === 'all' ? allNums(app.subject) : (SUBJ[app.subject].groups[n] || { nums: [] }).nums.slice();
    else if (k === 'tall') d.nums.forEach((x) => { d.per[x] = n; });
    else if (k === 'tper-') d.per[n] = Math.max(1, trainCnt(d, n) - 1);
    else if (k === 'tper+') d.per[n] = Math.min(20, trainCnt(d, n) + 1);
    else if (k === 'torder') d.order = v === 'seq' ? 'seq' : 'random';
    else return;
    saveDraft('train');
    render();
  }

  function saveTrain() { if (app.game && app.game.mode === 'train') sess.set('egeduel:train', app.game); }

  function startTrain() {
    const d = trainDraft(), subj = app.subject, all = allNums(subj);
    const nums = d.nums.filter((n) => all.indexOf(n) >= 0).sort((a, b) => a - b);
    if (!nums.length) { toast('Выберите хотя бы одно задание'); return; }
    let list = [];
    nums.forEach((n) => { for (let i = 0; i < trainCnt(d, n); i++) list.push(n); });
    if (d.order !== 'seq') for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    list = list.slice(0, TRAIN_MAX);
    E.resetMemory();
    const items = [];
    list.forEach((n) => {
      let t = null;
      for (let i = 0; i < 5 && !t; i++) { try { t = E.make(n, subj); } catch (e) {} }
      if (t) items.push({ num: n, t, value: '', draft: '' });
    });
    if (!items.length) { toast('Не удалось собрать задания'); return; }
    if (app.game) leaveGame(true);
    app.game = { mode: 'train', subject: subj, items, cur: 0, done: false, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
    sess.set('egeduel:active', { mode: 'train' });
    saveTrain();
    app.tab = 'solo';
    render(); animatePage(); window.scrollTo(0, 0);
  }

  function leaveTrain() {
    sess.del('egeduel:active'); sess.del('egeduel:train');
    app.game = null;
    app.tab = 'solo';
    render(); animatePage(); window.scrollTo(0, 0);
  }

  function trainBarHTML(g) {
    return `<div class="tr-bar">${g.items.map((x, i) => {
      const st = g.done ? (x.value === '' ? ' skip' : x.ok ? ' ok' : ' bad') : x.value !== '' ? ' done' : '';
      const what = g.done ? (x.value === '' ? 'без ответа' : x.ok ? 'верно' : 'неверно') : x.value !== '' ? 'ответ дан' : 'без ответа';
      return `<button type="button" class="tr-q${st}${!g.done && i === g.cur ? ' cur' : ''}" data-q="${i}" title="Задание № ${x.num} · ${what}" aria-label="${i + 1}-е задание, № ${x.num}, ${what}"${!g.done && i === g.cur ? ' aria-current="true"' : ''}><b>${i + 1}</b><small>№${x.num}</small></button>`;
    }).join('')}</div>`;
  }

  function renderTrain() {
    const g = app.game;
    app.rendered = null;
    if (g.done) return renderTrainResult();
    const n = g.items.length;
    g.cur = Math.max(0, Math.min(n - 1, g.cur | 0));
    const it = g.items[g.cur], t = it.t, subj = g.subject;
    const answered = g.items.filter((x) => x.value !== '').length;
    const saved = it.value !== '';
    const type = t.type;
    main().innerHTML = `
      <section class="card tr-top">
        <div class="tr-head">
          <div><div class="round-lbl">🎯 Тренировка · ${esc(SUBJ[subj].name)}</div><div class="tr-prog">Отвечено <b>${answered}</b> из ${n}</div></div>
          <span class="sp"></span>
          <button type="button" class="btn" id="tr-finish">Завершить тренировку</button>
        </div>
        ${trainBarHTML(g)}
      </section>
      <section class="card" id="taskcard">
        <div class="task-head"><span class="badge ${it.num >= SUBJ[subj].part2From ? 'p2' : ''}">№ ${it.num}</span><span class="task-topic">${esc(titleOf(subj, it.num))}</span><span class="src">${g.cur + 1} из ${n}</span></div>
        <div class="task-text" id="tasktext">${t.text}${t.svg || ''}</div>
        <div class="answer-box">
          <label class="lbl" for="ans">Ваш ответ</label>
          <div class="answer-row"><input class="input" id="ans" autocomplete="off" spellcheck="false" ${type === 'num' ? 'inputmode="decimal"' : type === 'digits' || type === 'digitset' || type === 'numlist' ? 'inputmode="numeric"' : ''} placeholder="${type === 'word' && subj === 'rus' ? 'Впишите слово (буквами)' : PLACEHOLDER[type] || ''}" value="${esc(it.draft !== '' && it.draft !== undefined ? it.draft : it.value)}"><button class="btn big" id="send">${saved ? 'Изменить' : 'Сохранить'}</button></div>
          <div class="keys">${(KEYS[type] || []).map((k) => `<button type="button" data-k="${esc(k)}">${esc(k === 'log_' ? 'log' : k === '-' ? '−' : k)}</button>`).join('')}</div>
          <div class="ferr" id="ferr"></div>
          ${saved ? `<div class="tr-saved">✓ Ответ сохранён: <b>${esc(it.value)}</b><span class="muted"> · верно или нет — узнаете после завершения</span></div>` : ''}
        </div>
        <div class="actions tr-nav"><button type="button" class="btn ghost" id="tr-prev" ${g.cur === 0 ? 'disabled' : ''}>← Назад</button><span class="sp"></span><button type="button" class="btn soft" id="tr-next" ${g.cur === n - 1 ? 'disabled' : ''}>Далее →</button></div>
      </section>`;
    typeset($('#tasktext'));
    const go = (i) => { if (i < 0 || i >= n || i === g.cur) return; g.cur = i; saveTrain(); renderTrain(); const top = $('.tr-top'); if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView({ block: 'start', behavior: 'smooth' }); };
    $$('[data-q]').forEach((b) => (b.onclick = () => go(+b.dataset.q)));
    $('#tr-prev').onclick = () => go(g.cur - 1);
    $('#tr-next').onclick = () => go(g.cur + 1);
    $('#tr-finish').onclick = () => {
      const left = g.items.filter((x) => x.value === '').length;
      if (!confirm(left ? `Без ответа: ${left} ${plural(left, 'задание', 'задания', 'заданий')}. Всё равно завершить тренировку и посмотреть результаты?` : 'Завершить тренировку и посмотреть результаты?')) return;
      finishTrain();
    };
    const inp = $('#ans');
    const send = () => {
      const v = inp.value.trim();
      if (!v) { $('#ferr').textContent = 'Введите ответ'; inp.focus(); return; }
      const err = E.formatError(t, v);
      if (err) { $('#ferr').textContent = err; inp.focus(); return; }
      it.value = v; it.draft = '';
      if (Profile.markToday(subj)) renderHeaderAvatar();
      // к следующему заданию без ответа (после текущего, по кругу)
      let nx = -1;
      for (let k = 1; k < n && nx < 0; k++) { const j = (g.cur + k) % n; if (g.items[j].value === '') nx = j; }
      if (nx >= 0) g.cur = nx;
      else toast('Все задания решены — можно завершать тренировку');
      saveTrain(); renderTrain();
    };
    $('#send').onclick = send;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    inp.addEventListener('input', () => { it.draft = inp.value; $('#ferr').textContent = ''; saveTrain(); });
    $$('.keys button').forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));
    $$('.keys button').forEach((b) => (b.onclick = () => {
      const k = b.dataset.k;
      const s = inp.selectionStart !== null ? inp.selectionStart : inp.value.length, en = inp.selectionEnd !== null ? inp.selectionEnd : inp.value.length;
      inp.value = inp.value.slice(0, s) + k + inp.value.slice(en);
      inp.selectionStart = inp.selectionEnd = s + k.length;
      it.draft = inp.value;
      inp.focus();
    }));
    if (window.matchMedia('(pointer:fine)').matches) inp.focus({ preventScroll: true });
  }

  function finishTrain() {
    const g = app.game, subj = g.subject;
    g.items.forEach((x) => {
      let ok = false, ans = '';
      if (x.value !== '') { try { ok = !!E.check(x.t, x.value); } catch (e) {} }
      try { ans = E.answerText(x.t); } catch (e) {}
      x.ok = ok; x.answer = ans;
    });
    g.done = true;
    g.items.forEach((x) => { if (x.value !== '') achAttempt(subj, x.num, x.ok ? 'ok' : 'bad'); });
    Profile.record('train:' + g.id, { mode: 'solo', solved: g.items.filter((x) => x.ok).length });
    saveTrain();
    render(); animatePage(); window.scrollTo(0, 0);
  }

  function renderTrainResult() {
    const g = app.game, n = g.items.length, subj = g.subject;
    const ok = g.items.filter((x) => x.ok).length, skip = g.items.filter((x) => x.value === '').length, bad = n - ok - skip;
    const pct = Math.round((ok / n) * 100);
    const emoji = pct >= 90 ? '🏆' : pct >= 60 ? '💪' : pct >= 30 ? '📚' : '🌱';
    main().innerHTML = `
      <section class="card over">
        <div class="big-emoji">${emoji}</div>
        <h1>Тренировка завершена</h1>
        <p class="lead" style="margin:0 auto 6px">${esc(SUBJ[subj].name)} · верно <b>${ok}</b> из ${n} (${pct}%)</p>
        <div class="stats tr-stats"><div class="stat ok"><b>${ok}</b><span>верно</span></div><div class="stat bad"><b>${bad}</b><span>неверно</span></div><div class="stat"><b>${skip}</b><span>без ответа</span></div></div>
        <div class="actions" style="justify-content:center"><button type="button" class="btn big" id="tr-again">Пройти ещё раз</button><button type="button" class="btn ghost big" id="tr-menu">К настройкам</button></div>
      </section>
      <section class="card tr-top" style="margin-top:18px"><div class="round-lbl" style="margin-bottom:2px">Нажмите на номер, чтобы открыть разбор</div>${trainBarHTML(g)}</section>
      <section class="card" style="margin-top:18px"><h2>Ответы и разбор</h2>
        ${g.items.map((x, i) => {
          const cls = x.value === '' ? 'skip' : x.ok ? 'ok' : 'bad';
          const t = x.t;
          return `<details class="tr-item ${cls}" id="tri-${i}">
            <summary><span class="tr-mk">${cls === 'ok' ? '✓' : cls === 'bad' ? '✗' : '—'}</span><span class="tr-it"><b>${i + 1}.</b> № ${x.num} · ${esc(titleOf(subj, x.num))}</span><span class="tr-yours">${x.value === '' ? '<span class="muted">без ответа</span>' : 'Ваш: <b>' + esc(x.value) + '</b>'} · Верно: <b>${esc(x.answer)}</b></span></summary>
            <div class="tr-body">
              <div class="task-text">${t.text}${t.svg || ''}</div>
              <div class="right-ans"><span class="muted">Правильный ответ:</span> <b>${esc(x.answer)}</b></div>
              ${t.short ? `<div class="sol"><h3>${t.full ? 'Краткое решение' : 'Решение'}</h3><div class="task-text" style="font-size:16px">${t.short}</div>${t.full ? `<details class="tr-full"><summary>Подробное решение ▾</summary><div class="task-text" style="font-size:16px">${t.full}</div></details>` : ''}</div>` : ''}
            </div>
          </details>`;
        }).join('')}
      </section>`;
    $$('details.tr-item').forEach((d) => d.addEventListener('toggle', () => { if (d.open && !d.dataset.ts) { d.dataset.ts = '1'; typeset(d); } }));
    $$('[data-q]').forEach((b) => (b.onclick = () => {
      const d = $('#tri-' + b.dataset.q);
      if (!d) return;
      d.open = true;
      d.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }));
    $('#tr-again').onclick = () => startTrain();
    $('#tr-menu').onclick = () => leaveTrain();
  }

      card.addEventListener('click', (e) => {
        const el = e.target.closest('[data-set]');
        if (!el || el.tagName === 'INPUT') return;
        const key = card.dataset.skey || (card.querySelector('#create') ? 'duel' : 'solo');
        onSettingsClick(key, el);
      });
      card.addEventListener('change', (e) => {
        const key = card.dataset.skey || (card.querySelector('#create') ? 'duel' : 'solo');
        const rn = e.target.closest('[data-set="rounds-num"]');
        if (rn) {
          draft(key).rounds = Math.max(1, Math.min(100, Math.round(+rn.value || 1)));
          saveDraft(key);
          render();
          return;
        }
        const el = e.target.closest('[data-set="time-min"]');
        if (!el) return;
        const m = Math.max(1, Math.min(60, Math.round(+el.value || 1)));
        draft(key).time = m * 60;
        saveDraft(key);
        render();
      });
    });
  }

  /* ---------- экран игры ---------- */
  /* ---------- наблюдение за матчем друга (только чтение: ничего не отправляем в комнату) ---------- */
  function updatePlay() {
    if (!Cloud.user) return;
    const g = app.game, S = g && g.S;
    let p = null;
    if (g && g.mode !== 'solo' && S && S.code && ['ready', 'question', 'result'].indexOf(S.phase) >= 0 && (g.mode === 'host' || g.joined)) {
      p = { code: S.code, subject: subjOfState(S), mode: isTrio(S) ? 'trio' : 'duel', vs: roles(S).map((r) => S.players[r].name).join(' vs ').slice(0, 80) };
    }
    Cloud.setPlay(p);
  }
  async function watchMatch(fp) {
    const pl = fp && fp.play;
    if (!pl) { toast('Матч уже закончился'); return; }
    if (app.game && app.game.S && app.game.S.phase !== 'over') { toast('Сначала завершите свою игру'); return; }
    if (app.game) leaveGame(true);
    stopWatch();
    const w = { code: pl.code, friend: fp.name, subject: pl.subject, S: null, profiles: {}, offset: 0, link: null, key: null, gone: false };
    app.watch = w;
    app.tab = 'watch';
    render(); animatePage(); window.scrollTo(0, 0);
    try { w.link = await Net.join(pl.code, () => {}, 'w_' + Net.rid(8)); }
    catch (e) {
      if (app.watch !== w) return;
      toast('Не удалось подключиться к матчу'); stopWatch(); app.tab = 'profile'; render(); return;
    }
    if (app.watch !== w) { w.link.close(); return; }
    w.link.on('state', (S) => {
      if (app.watch !== w) return;
      // комнату очистили: если итоги уже показаны — оставляем их, иначе «матч закончился»
      if (!S || typeof S !== 'object' || !S.players || !S.settings) { if (w.S && w.S.phase !== 'over') w.gone = true; }
      else { w.S = S; w.gone = false; if (S.now) w.offset = S.now - Date.now(); }
      if (app.tab === 'watch') renderWatch();
    });
    ALL_ROLES.forEach((r) => w.link.on('profile/' + r, (p) => {
      if (app.watch !== w || !p || typeof p !== 'object') return;
      w.profiles[r] = Profile.sanitize(p);
      if (app.tab === 'watch') renderWatchHead();
    }));
    w.link.on('spec', (x) => {
      if (app.watch !== w || !x || typeof x !== 'object') return;
      w.spec = x;
      if (app.tab === 'watch') { renderWatchHead(); renderWatchSpec(); }
    });
    // если состояние так и не пришло — комнаты уже нет
    setTimeout(() => { if (app.watch === w && !w.S) { w.gone = true; if (app.tab === 'watch') renderWatch(); } }, 8000);
  }
  function stopWatch() {
    const w = app.watch;
    app.watch = null;
    if (w && w.link) w.link.close();
  }
  // данные зрителя для текущего раунда (или null, если ещё не пришли / от прошлого раунда)
  function curSpec(w) {
    const x = w && w.spec, S = w && w.S;
    return x && S && S.phase === 'question' && x.round === S.round && x.gameNo === (S.gameNo || 1) ? x : null;
  }
  function renderWatchSpec() {
    const w = app.watch, el = $('#w-spec');
    if (!w || !el) return;
    const x = curSpec(w);
    const sig = x ? x.gameNo + '|' + x.round + '|' + x.answer + '|' + x.short : '';
    if (el.dataset.sig === sig) return;
    el.dataset.sig = sig;
    if (!x) { el.innerHTML = '<p class="muted w-note">👀 Игроки решают это задание. Ответ и разбор подгружаются…</p>'; return; }
    el.innerHTML = `<details class="card w-spoil"${w.specOpen ? ' open' : ''}><summary>🔑 Ответ и разбор <span class="muted">— игроки их не видят</span></summary>
      <div class="right-ans" style="margin-top:12px"><span class="muted">Правильный ответ:</span> <b>${esc(x.answer)}</b></div>
      ${x.short ? `<div class="sol"><h3>Решение</h3><div class="task-text" style="font-size:16px">${x.short}</div></div>` : ''}</details>`;
    const d = $('details', el);
    d.ontoggle = () => { w.specOpen = d.open; };
    typeset(el);
  }
  function watchRem(w) { return w.S.deadline ? w.S.deadline - (Date.now() + (w.offset || 0)) : Infinity; }
  function renderWatchHead() {
    const w = app.watch, el = $('#w-head');
    if (!w || !w.S || !el) return;
    const S = w.S, max = S.settings.lives, x = curSpec(w);
    const st = (p, r) => {
      if (p.left) return '<span class="pstat off">🚪 вышел(а)</span>';
      if (p.out) return '<span class="pstat off">💀 выбыл(а)</span>';
      if (S.phase === 'question' && p.answered && x && x.ans && x.ans[r]) {
        const a = x.ans[r];
        return `<span class="w-ans ${a.ok ? 'ok' : 'bad'}" title="${a.ok ? 'Верно' : 'Неверно'}">${a.ok ? '✓' : '✗'} ${esc(a.value)}</span>`;
      }
      if (S.phase === 'question') return p.answered ? '<span class="pstat ok">✓ ответ дан</span>' : '<span class="pstat">думает…</span>';
      if (S.phase === 'result' || S.phase === 'ready') return p.ready ? '<span class="pstat ok">✓ готов</span>' : '<span class="pstat">читает разбор</span>';
      return '';
    };
    const pl = roles(S).map((r) => {
      const p = S.players[r];
      const win = S.phase === 'over' && S.winner === r;
      return `<div class="w-p${win ? ' win' : ''}">${win ? '<div class="w-crown">👑</div>' : ''}${Profile.avatar(w.profiles[r] || Profile.fallback(p.name), 48)}<b class="w-name">${esc(p.name)}</b>${max ? hearts(p.lives, max) : ''}<span class="w-score">верно: ${okCount(S, r)}</span>${st(p, r)}</div>`;
    }).join('<div class="vs">VS</div>');
    let center;
    if (S.phase === 'question') center = `<div class="round-lbl">Раунд ${S.round}${S.settings.rounds ? ' из ' + S.settings.rounds : ''}</div>${S.deadline ? `<div class="timer" id="w-timer">${fmtTime(watchRem(w))}</div>` : '<div class="timer inf">∞</div>'}`;
    else center = `<div class="round-lbl">${S.phase === 'lobby' ? 'Сбор игроков' : S.phase === 'ready' ? 'Подготовка' : S.phase === 'over' ? 'Матч окончен' : 'Раунд ' + S.round + ' · разбор'}</div>`;
    el.innerHTML = `<div class="w-center">${center}</div><div class="w-players${isTrio(S) ? ' trio' : ''}">${pl}</div>`;
  }
  function watchBodyHTML(w) {
    const S = w.S;
    if (S.phase === 'lobby') return '<section class="card w-wait"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Игроки собираются в комнате…</div></section>';
    if (S.phase === 'ready') return '<section class="card w-wait"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Игроки готовятся к старту…</div></section>';
    if (S.phase === 'question') return `${taskCard(S)}<div id="w-spec"></div>`;
    const R = S.result;
    const verdicts = R ? `<div class="verdicts${isTrio(S) ? ' trio' : ''}">${roles(S).filter((r) => R.v[r]).map((r) => {
      const v = R.v[r];
      return `<div class="verdict ${v.ok ? 'ok' : 'bad'}"><div class="who">${esc(S.players[r].name)}</div><div class="what">${v.timeout ? '⏰ Время вышло' : (v.ok ? '✓ ' : '✗ ') + esc(v.value)}</div></div>`;
    }).join('')}</div><div class="right-ans"><span class="muted">Правильный ответ:</span> <b>${esc(R.answer)}</b></div><div class="sol"><h3>Решение</h3><div class="task-text" style="font-size:16px">${R.short}</div></div>` : '';
    if (S.phase === 'result') return `<section class="card">${verdicts}</section>${taskReview(S)}`;
    // конец матча
    let title, emoji;
    if (S.reason === 'closed') { emoji = '🚪'; title = 'Комната закрыта'; }
    else if (S.winner === 'draw') { emoji = '🤝'; title = 'Ничья!'; }
    else if (S.winner && S.players[S.winner]) { emoji = '🏆'; title = 'Победил(а) ' + esc(S.players[S.winner].name); }
    else { emoji = '🏁'; title = 'Матч окончен'; }
    const hist = S.history.length ? `<section class="card history" style="margin-top:18px"><h2>История раундов</h2><table><thead><tr><th>Раунд</th><th>Задание</th>${roles(S).map((r) => '<th>' + esc(S.players[r].name) + '</th>').join('')}</tr></thead><tbody>${S.history.map((h) => `<tr><td>${h.round}</td><td>№ ${h.num} · ${esc(titleOf(subjOfState(S), h.num))}</td>${roles(S).map((r) => '<td>' + (h[r] === undefined ? '<span class="muted">—</span>' : h[r] ? '<span class="mk-ok">✓</span>' : '<span class="mk-bad">✗</span>') + '</td>').join('')}</tr>`).join('')}</tbody></table></section>` : '';
    return `<section class="card over"><div class="big-emoji">${emoji}</div><h1>${title}</h1><div class="actions" style="justify-content:center"><button class="btn big" id="w-exit2">Выйти из просмотра</button></div></section>${R && S.reason !== 'closed' ? `<section class="card" style="margin-top:18px"><h2>Последний раунд</h2>${verdicts}</section>` : ''}${hist}`;
  }
  function renderWatch() {
    const w = app.watch;
    if (!w) { app.tab = 'profile'; render(); return; }
    const bar = `<div class="w-bar card"><span class="w-live"><i></i> LIVE</span><span class="w-title">👁 Наблюдение · ${SUBJ_ICON[w.subject] || ''} ${esc(SUBJ_NAME[w.subject] || '')}${w.S ? ' · ' + (isTrio(w.S) ? 'трио' : 'дуэль') : ''}</span><span class="sp"></span><button class="btn ghost" id="w-exit">Выйти</button></div>`;
    if (!w.S || w.gone) {
      app.rendered = null; w.key = null;
      main().innerHTML = bar + (w.gone
        ? '<section class="card w-wait"><div class="big-emoji">🏁</div><h2>Матч уже закончился</h2><p class="muted">Комната закрыта, смотреть больше нечего.</p><div class="actions" style="justify-content:center"><button class="btn" id="w-exit2">Вернуться</button></div></section>'
        : `<section class="card w-wait"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Подключаемся к матчу ${esc(w.friend)}…</div></section>`);
    } else {
      const S = w.S;
      const key = [S.code, S.gameNo, S.phase, S.round].join('|');
      if (w.key !== key || !$('#w-body')) {
        w.key = key;
        main().innerHTML = bar + '<div id="w-head" class="w-head card"></div><div id="w-body"></div>';
        $('#w-body').innerHTML = watchBodyHTML(w);
        typeset($('#w-body'));
      }
      renderWatchHead();
      renderWatchSpec();
    }
    const exit = () => { stopWatch(); app.tab = 'profile'; render(); animatePage(); window.scrollTo(0, 0); };
    if ($('#w-exit')) $('#w-exit').onclick = exit;
    if ($('#w-exit2')) $('#w-exit2').onclick = exit;
  }

  function names(S) {
    const me = myRole(), opp = me === 'host' ? 'guest' : 'host';
    return { me, opp, meP: S.players[me], oppP: S.players[opp], opps: roles(S).filter((r) => r !== me) };
  }

  function renderGame() {
    const g = app.game, S = g.S;
    if (!S) {
      main().innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Подключаемся к комнате ${esc(g.link ? g.link.code : '')}…</div><div class="actions" style="justify-content:center"><button class="btn ghost" id="leave">Отмена</button></div></div>`;
      $('#leave').onclick = () => leaveGame(true);
      return;
    }
    if (g.mode === 'guest' && !(g.me && S.players[g.me] && S.players[g.me].pub === g.pub)) {
      main().innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="waiting" style="justify-content:center"><span class="dot-pulse"></span> Входим в комнату ${esc(S.code)}…</div><div class="actions" style="justify-content:center"><button class="btn ghost" id="leave">Отмена</button></div></div>`;
      $('#leave').onclick = () => leaveGame(true);
      return;
    }
    if (S.phase === 'lobby') return renderLobby();
    const key = [S.code, S.phase, S.round].join('|');
    if (app.rendered !== key) {
      if (g.ui.lastKeyRound !== S.round) { g.ui.draft = ''; g.ui.lastKeyRound = S.round; }
      app.rendered = key;
      g.ui.showFull = false;
      main().innerHTML = `<div id="hud"></div><div id="tbar"></div><div id="body"></div>`;
      renderBody();
      window.scrollTo({ top: 0 });
    } else {
      patchBody();
    }
    renderHud();
  }

  function lobbyPlayersHTML(S) {
    const g = app.game;
    return `<div class="lobby-pl">${seats(S).map((r) => {
      const p = S.players[r];
      if (!p) return '<div class="lp empty"><span class="lp-ava">?</span><span class="muted">Ждём игрока…</span></div>';
      const isMe = r === myRole();
      return `<div class="lp">${Profile.avatar(isMe ? Profile.shared() : oppProfile(S, r), 34)}<b>${esc(p.name)}</b>${isMe ? '<span class="muted">(вы)</span>' : ''}${r === 'host' ? '<span class="lp-tag">создатель</span>' : ''}</div>`;
    }).join('')}</div>`;
  }

  function renderLobby() {
    const g = app.game, S = g.S;
    app.rendered = null;
    const joined = roles(S).length, total = seats(S).length;
    if (g.mode === 'guest') {
      main().innerHTML = `<section class="card" style="max-width:560px;margin:0 auto;text-align:center">
        <h2>Вы в комнате ${esc(S.code)}</h2>
        <p class="muted">${SUBJ[subjOfState(S)].name} · игра втроём. Начнём, когда соберутся все.</p>
        ${lobbyPlayersHTML(S)}
        <div class="waiting" style="justify-content:center;margin-top:14px"><span class="dot-pulse"></span> Собралось ${joined} из ${total}…</div>
        <div class="actions" style="justify-content:center"><button class="btn danger" id="leave">Выйти</button></div>
      </section>`;
      $('#leave').onclick = () => leaveGame(true);
      return;
    }
    const url = location.href.split('?')[0].split('#')[0] + '?room=' + S.code;
    const local = location.protocol === 'file:';
    main().innerHTML = `
      <div class="grid2">
        <section class="card">
          <h2>Комната создана</h2>
          <div class="code-box">
            <div class="muted" style="font-weight:700;font-size:13px">КОД КОМНАТЫ</div>
            <div class="code">${esc(S.code)}</div>
            <div class="row" style="justify-content:center;margin-top:10px"><button class="btn soft" id="copy-code">Скопировать код</button>${navigator.share ? '<button class="btn soft" id="share">Поделиться</button>' : ''}</div>
          </div>
          <div class="field" style="margin-top:16px"><span class="lbl">Ссылка-приглашение</span>
            <div class="share-row"><input class="input" readonly value="${esc(url)}" id="link"><button class="btn" id="copy-link">Копировать</button></div>
            ${local ? '<div class="hint">Сайт открыт как файл на компьютере, поэтому ссылка у друга не откроется. Отправьте ему этот же файл и код комнаты: он откроет файл и введёт код во вкладке «Дуэль».</div>' : (isTrio(S) ? '<div class="hint">Отправьте ссылку двум друзьям — игра начнётся, когда соберутся все трое.</div>' : '<div class="hint">Друг откроет ссылку, введёт имя — и дуэль начнётся.</div>')}
          </div>
          ${isTrio(S) ? `<div class="field" style="margin-top:16px"><span class="lbl">Игроки · ${joined} из ${total}</span>${lobbyPlayersHTML(S)}</div>` : ''}
          <div class="waiting" style="margin-top:18px"><span class="dot-pulse"></span> ${isTrio(S) ? (total - joined === 1 ? 'Ждём ещё одного игрока…' : 'Ждём ещё двух игроков…') : 'Ждём соперника…'}</div>
        </section>
        <section class="card">
          <h3>Настройки комнаты</h3>
          <dl class="summary">
            <dt>Предмет</dt><dd>${SUBJ[subjOfState(S)].name}</dd>
            <dt>Режим</dt><dd>${isTrio(S) ? 'Трио — на троих' : 'Дуэль 1 на 1'}</dd>
            <dt>Создатель</dt><dd>${esc(S.players.host.name)}</dd>
            <dt>Время на ответ</dt><dd>${timeLabel(S.settings.time)}</dd>
            <dt>Жизни</dt><dd>${S.settings.lives || '∞ безлимит'}</dd>
            <dt>Раунды</dt><dd>${roundsLabel(S.settings.rounds)}</dd>
            <dt>Задания</dt><dd>${esc(numsLabel(S.settings))}</dd>
          </dl>
          <div class="actions"><button class="btn danger" id="leave">Закрыть комнату</button></div>
        </section>
      </div>`;
    $('#copy-code').onclick = () => copy(S.code);
    $('#copy-link').onclick = () => copy(url);
    if ($('#share')) $('#share').onclick = () => navigator.share({ title: 'ЕГЭ-дуэль', text: 'Давай сразимся в заданиях ЕГЭ (' + SUBJ[subjOfState(S)].short + ')! Код комнаты: ' + S.code, url: local ? undefined : url }).catch(() => {});
    $('#leave').onclick = () => leaveGame(true);
  }

  function renderHud() {
    const g = app.game, S = g.S;
    const hud = $('#hud');
    if (!hud) return;
    const { me, opp, meP, oppP } = names(S);
    const solo = isSolo(S);
    const statusOf = (role, p) => {
      if (!p) return '';
      const online = role === me ? true : g.online && role in g.online ? g.online[role] : g.oppOnline !== false;
      if (!online && !solo) return '<span class="pstat off">● не в сети</span>';
      if (S.phase === 'question') return p.answered || (role === me && g.ui.pendingAnswer) ? '<span class="pstat ok">✓ ответ дан</span>' : '<span class="pstat">думает…</span>';
      if (S.phase === 'result' || S.phase === 'ready') return p.ready || (role === me && g.ui.pendingReady) ? '<span class="pstat ok">✓ готов</span>' : '<span class="pstat">читает разбор</span>';
      if (S.phase === 'over' && (S.reason === 'lives' || S.reason === 'rounds')) return p.ready || (role === me && g.ui.pendingReady) ? '<span class="pstat ok">✓ хочет реванш</span>' : '';
      return '';
    };
    const max = S.settings.lives;
    let center = '';
    if (S.phase === 'question') {
      if (S.deadline) {
        const rem = S.deadline - (Date.now() + (me !== 'host' ? g.offset || 0 : 0));
        center = `<div class="round-lbl">Раунд ${S.round}${S.settings.rounds ? " из " + S.settings.rounds : ""}</div><div class="timer ${rem < 10000 ? 'low' : ''}" id="timer">${fmtTime(rem)}</div>`;
      } else center = `<div class="round-lbl">Раунд ${S.round}${S.settings.rounds ? " из " + S.settings.rounds : ""}</div><div class="timer inf">∞</div>`;
    } else center = `<div class="round-lbl">${S.phase === 'ready' ? 'Подготовка' : S.phase === 'over' ? 'Игра окончена' : 'Раунд ' + S.round}</div>`;
    if (isTrio(S)) {
      const tp = (r) => {
        const p = S.players[r], isMe = r === me;
        const gone = p.left ? '<span class="pstat off">🚪 вышел(а)</span>' : p.out ? '<span class="pstat off">💀 выбыл(а)</span>' : '';
        return `<div class="tp${isMe ? ' me' : ''}${gone ? ' gone' : ''}"><button type="button" class="pwho tp-who" ${isMe ? 'disabled' : `data-opp="${r}"`} title="${isMe ? 'Это вы' : 'Профиль соперника'}">${Profile.avatar(isMe ? Profile.shared() : oppProfile(S, r), 34)}<div class="pname">${esc(p.name)}${isMe ? ' <span class="muted" style="font-weight:600">(вы)</span>' : ''}</div></button>${hearts(p.lives, max)}${gone || statusOf(r, p)}</div>`;
      };
      hud.className = 'hud trio';
      hud.innerHTML = `<div class="center-hud">${center}</div><div class="trio-row">${[me].concat(names(S).opps).map(tp).join('')}</div>`;
      $$('[data-opp]', hud).forEach((b) => (b.onclick = () => showOppCard(S, b.dataset.opp)));
    } else {
    hud.className = 'hud';
    hud.innerHTML = `
      <div class="player"><div class="pwho">${Profile.avatar(Profile.shared(), 34)}<div class="pname">${esc(meP.name)} <span class="muted" style="font-weight:600">(вы)</span></div></div>${hearts(meP.lives, max)}${statusOf(me, meP)}</div>
      <div class="center-hud">${center}</div>
      ${solo ? `<div class="player right"><div class="pname">Соло</div><div class="pstat">Решено: ${S.history.filter((h) => h.host).length} из ${S.history.length}</div></div>`
        : oppP ? `<div class="player right"><button type="button" class="pwho opp-btn" id="opp-btn" title="Профиль соперника"><div class="pname">${esc(oppP.name)}</div>${Profile.avatar(oppProfile(S, opp), 34)}</button>${hearts(oppP.lives, max)}${statusOf(opp, oppP)}</div>` : '<div></div>'}`;
    const ob = $('#opp-btn');
    if (ob) ob.onclick = () => showOppCard(S, opp);
    }
    const tb = $('#tbar');
    if (tb) {
      if (S.phase === 'question' && S.deadline) {
        const rem = S.deadline - (Date.now() + (me !== 'host' ? g.offset || 0 : 0));
        const pct = Math.max(0, Math.min(100, (rem / (S.settings.time * 1000)) * 100));
        tb.className = 'tbar' + (rem < 10000 ? ' low' : '');
        tb.innerHTML = `<i style="width:${pct}%"></i>`;
      } else { tb.className = ''; tb.innerHTML = ''; }
    }
  }

  function showOppCard(S, role) {
    let m = $('#modal');
    if (!m) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
    m.innerHTML = `<div class="modal-box card">${Profile.card(oppProfile(S, role), 'Соперник')}<div class="actions" style="justify-content:flex-end"><button class="btn ghost" id="modal-close">Закрыть</button></div></div>`;
    m.classList.add('show');
    const close = () => m.classList.remove('show');
    $('#modal-close').onclick = close;
    m.onclick = (e) => { if (e.target === m) close(); };
  }

  function taskCard(S) {
    const t = S.task;
    return `<section class="card" id="taskcard">
      <div class="task-head"><span class="badge ${t.num >= SUBJ[subjOfState(S)].part2From ? 'p2' : ''}">№ ${t.num}</span><span class="task-topic">${esc(titleOf(subjOfState(S), t.num))}</span><span class="src">${t.source === 'bank' ? 'банк 100балльного' : t.source === 'fipi' ? 'по материалам ФИПИ' : 'по прототипу ФИПИ'}</span></div>
      <div class="task-text" id="tasktext">${t.text}${t.svg || ''}</div>
      <div id="answerbox"></div>
    </section>`;
  }

  const KEYS = {
    digits: [], digitset: [], word: [], numlist: [], pm: ['±', ','],
    num: ['-', ','],
    expr: ['-', ',', '/', '√', 'π', '(', ')', '^'],
    set: ['-', 'π', '/', ';', '√', ','],
    interval: ['(', ')', '[', ']', ';', '-', '∞', '∪', '{', '}', '/', '√', 'log_'],
  };
  const PLACEHOLDER = { pm: 'Например: 2,4 ± 0,2', digits: 'Только цифры, например: 21122', digitset: 'Только цифры, например: 135', word: 'Впишите термин', numlist: 'Номера предложений, например: 1215', num: 'Например: 2,5', expr: 'Число, например 2,4 или 6√3', set: 'Например: -7π/6; 3π/2', interval: 'Например: (-∞; 1] ∪ {3}' };

  function answerBoxHTML(S) {
    const g = app.game;
    const me = myRole();
    const mine = S.players[me];
    if (isTrio(S) && !inGame(S, me)) return `<div class="answer-box"><div class="sent">👀 Вы ${mine.left ? 'вышли из игры' : 'выбыли'} и наблюдаете за соперниками</div></div>`;
    const sent = mine.answered || g.ui.pendingAnswer;
    const rem = S.deadline ? S.deadline - (Date.now() + (me !== 'host' ? g.offset || 0 : 0)) : Infinity;
    if (sent) {
      const waiting = !isSolo(S);
      return `<div class="answer-box"><div class="sent">${g.ui.pendingAnswer && !mine.answered ? '<span class="dot-pulse"></span> Отправляем ответ…' : '✓ Ответ принят'}${g.ui.myValue ? ': <span style="color:var(--ink)">' + esc(g.ui.myValue) + '</span>' : ''}</div>${waiting ? `<div class="waiting" style="margin-top:12px"><span class="dot-pulse"></span> ${isTrio(S) ? 'Ждём ответы соперников…' : 'Ждём ответ соперника…'}</div>` : ''}</div>`;
    }
    if (rem <= 0) return `<div class="answer-box"><div class="sent" style="background:var(--bad-soft);color:var(--bad)">⏰ Время вышло</div></div>`;
    const type = S.task.type;
    return `<div class="answer-box">
      <label class="lbl" for="ans">Ваш ответ</label>
      <div class="answer-row"><input class="input" id="ans" autocomplete="off" spellcheck="false" ${type === 'num' ? 'inputmode="decimal"' : type === 'digits' || type === 'digitset' || type === 'numlist' ? 'inputmode="numeric"' : ''} placeholder="${type === 'word' && subjOfState(S) === 'rus' ? 'Впишите слово (буквами)' : PLACEHOLDER[type]}" value="${esc(g.ui.draft || '')}"><button class="btn big" id="send">Ответить</button></div>
      <div class="keys">${(KEYS[type] || []).map((k) => `<button type="button" data-k="${esc(k)}">${esc(k === 'log_' ? 'log' : k === '-' ? '−' : k)}</button>`).join('')}</div>
      <div class="ferr" id="ferr"></div>
    </div>`;
  }

  function bindAnswerBox(S) {
    const g = app.game;
    const inp = $('#ans');
    if (!inp) return;
    const send = () => {
      const v = inp.value.trim();
      const err = E.formatError(S.task, v);
      if (err) { $('#ferr').textContent = err; inp.focus(); return; }
      g.ui.draft = '';
      doAnswer(v);
    };
    $('#send').onclick = send;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    inp.addEventListener('input', () => { g.ui.draft = inp.value; $('#ferr').textContent = ''; });
    $$('.keys button').forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));
    $$('.keys button').forEach((b) => (b.onclick = () => {
      const k = b.dataset.k;
      const s = inp.selectionStart !== null ? inp.selectionStart : inp.value.length, en = inp.selectionEnd !== null ? inp.selectionEnd : inp.value.length;
      inp.value = inp.value.slice(0, s) + k + inp.value.slice(en);
      inp.selectionStart = inp.selectionEnd = s + k.length;
      g.ui.draft = inp.value;
      inp.focus();
    }));
    if (window.matchMedia('(pointer:fine)').matches) inp.focus();
  }

  function verdictHTML(S) {
    const g = app.game, R = S.result;
    if (!R) return '';
    const { me, opp, meP, oppP } = names(S);
    const one = (role, p, label) => {
      const v = R.v[role];
      if (!v) return '';
      const cls = v.ok ? 'ok' : 'bad';
      const what = v.timeout ? '⏰ Время вышло' : (v.ok ? '✓ ' : '✗ ') + esc(v.value);
      return `<div class="verdict ${cls}"><div class="who">${label}</div><div class="what">${what}</div><div class="delta">${S.settings.lives ? (v.ok ? 'Жизнь сохранена' : '−1 жизнь') + ' · осталось ' + p.lives : (v.ok ? 'Верно' : 'Не засчитано') + ' · жизни не ограничены'}</div></div>`;
    };
    if (isTrio(S)) return `<div class="verdicts trio">${[me].concat(names(S).opps).filter((r) => R.v[r]).map((r) => one(r, S.players[r], esc(S.players[r].name) + (r === me ? ' (вы)' : ''))).join('')}</div>`;
    return `<div class="verdicts ${isSolo(S) ? 'solo' : ''}">${one(me, meP, esc(meP.name) + ' (вы)')}${!isSolo(S) && oppP ? one(opp, oppP, esc(oppP.name)) : ''}</div>`;
  }

  function solutionHTML(S) {
    const g = app.game, R = S.result;
    if (!R) return '';
    // у заданий из банка одно решение — без разделения на краткое и подробное
    if (!R.full) return `<div class="right-ans"><span class="muted">Правильный ответ:</span> <b>${esc(R.answer)}</b></div>
      <div class="sol"><h3>Решение</h3><div class="task-text" style="font-size:16px">${R.short}</div></div>`;
    return `<div class="right-ans"><span class="muted">Правильный ответ:</span> <b>${esc(R.answer)}</b></div>
      <div class="sol"><h3>Краткое решение</h3><div class="task-text" style="font-size:16px">${R.short}</div>
        <div class="full ${g.ui.showFull ? '' : 'hide'}" id="fullsol"><h3>Подробное решение</h3><div class="task-text" style="font-size:16px">${R.full}</div></div>
        <button class="btn soft toggle-full" id="toggle-full">${g.ui.showFull ? 'Свернуть подробное решение ▴' : 'Развернуть подробное решение ▾'}</button>
      </div>`;
  }

  function nextActionsHTML(S) {
    const g = app.game;
    const me = myRole();
    const mine = S.players[me];
    const solo = isSolo(S);
    const pend = mine.ready || g.ui.pendingReady;
    if (S.phase === 'result' && isTrio(S)) {
      if (!inGame(S, me)) return `<div class="actions" id="nextbox"><div class="waiting">👀 Вы выбыли. Следующий раунд начнётся, когда соперники нажмут «Продолжить».</div><span class="sp"></span><button class="btn danger" id="leave">Выйти</button></div>`;
      return `<div class="actions" id="nextbox">${pend ? '<div class="waiting"><span class="dot-pulse"></span> Вы готовы. Ждём остальных…</div>' : '<button class="btn big" id="next">Продолжить →</button>'}<span class="sp"></span><button class="btn danger" id="leave">Выйти</button></div>`;
    }
    if (S.phase === 'result') {
      return `<div class="actions" id="nextbox">${pend ? '<div class="waiting"><span class="dot-pulse"></span> Вы готовы. Ждём, когда соперник нажмёт «Продолжить»…</div>' : '<button class="btn big" id="next">Продолжить →</button>'}<span class="sp"></span><button class="btn danger" id="leave">${solo ? 'Завершить' : 'Выйти'}</button></div>`;
    }
    return '';
  }

  function renderBody() {
    const g = app.game, S = g.S;
    const body = $('#body');
    if (S.phase === 'ready') {
      const { meP, oppP } = names(S);
      const pend = meP.ready || g.ui.pendingReady;
      if (isTrio(S)) {
        const opps = names(S).opps;
        body.innerHTML = `<section class="card" style="text-align:center;padding:32px">
        <h2>Все в сборе!</h2>
        <div class="versus trio">${Profile.card(Profile.shared(), 'Вы')}${opps.map((r) => '<div class="vs">VS</div>' + Profile.card(oppProfile(S, r), 'Соперник')).join('')}</div>
        <p class="muted">${timeLabel(S.settings.time)} на ответ · ${livesLabel(S.settings.lives)} · ${S.settings.rounds ? S.settings.rounds + ' ' + roundsWord(S.settings.rounds) : 'раунды без ограничения'} · ${esc(numsLabel(S.settings))}</p>
        <div class="actions" style="justify-content:center" id="readybox">${readyBoxHTML(S)}</div>
        <div class="actions" style="justify-content:center"><button class="btn danger" id="leave">Выйти</button></div>
      </section>`;
        bindBody();
        return;
      }
      body.innerHTML = `<section class="card" style="text-align:center;padding:32px">
        <h2>${oppP ? 'Соперник найден!' : 'Ожидание'}</h2>
        <div class="versus">${Profile.card(Profile.shared(), 'Вы')}<div class="vs">VS</div>${oppP ? Profile.card(oppProfile(S, myRole() === 'host' ? 'guest' : 'host'), 'Соперник') : ''}</div>
        <p class="muted">${timeLabel(S.settings.time)} на ответ · ${livesLabel(S.settings.lives)} · ${S.settings.rounds ? S.settings.rounds + ' ' + roundsWord(S.settings.rounds) : 'раунды без ограничения'} · ${esc(numsLabel(S.settings))}</p>
        <div class="actions" style="justify-content:center" id="readybox">${pend ? '<div class="waiting"><span class="dot-pulse"></span> Ждём, когда соперник нажмёт «Начать»…</div>' : '<button class="btn big" id="next">Начать дуэль</button>'}</div>
        <div class="actions" style="justify-content:center"><button class="btn danger" id="leave">Выйти</button></div>
      </section>`;
    } else if (S.phase === 'question') {
      body.innerHTML = taskCard(S) + `<div class="actions"><span class="sp"></span><button class="btn danger" id="leave">${isSolo(S) ? 'Завершить' : 'Выйти'}</button></div>`;
      $('#answerbox').innerHTML = answerBoxHTML(S);
      typeset($('#taskcard'));
      bindAnswerBox(S);
    } else if (S.phase === 'result') {
      body.innerHTML = `<section class="card"><div id="verdicts">${verdictHTML(S)}</div>${solutionHTML(S)}${nextActionsHTML(S)}</section>` + taskReview(S);
      typeset(body);
    } else if (S.phase === 'over') {
      body.innerHTML = overHTML(S) + (S.result && (S.reason === 'lives' || S.reason === 'rounds') ? `<section class="card" style="margin-top:18px"><h2>Последний раунд</h2><div id="verdicts">${verdictHTML(S)}</div>${solutionHTML(S)}</section>` + taskReview(S) : '') + historyHTML(S);
      typeset(body);
    }
    bindBody();
  }

  function taskReview(S) {
    if (!S.task) return '';
    return `<details class="card" style="margin-top:18px"><summary style="cursor:pointer;font-weight:700">Условие задания № ${S.task.num}</summary><div class="task-text" style="margin-top:12px">${S.task.text}${S.task.svg || ''}</div></details>`;
  }

  function readyBoxHTML(S) {
    const g = app.game, me = myRole();
    const pend = S.players[me].ready || g.ui.pendingReady;
    const n = roles(S).filter((r) => S.players[r].ready || (r === me && g.ui.pendingReady)).length;
    return pend ? `<div class="waiting"><span class="dot-pulse"></span> Готовы ${n} из 3. Ждём остальных…</div>` : `<button class="btn big" id="next">Начать трио${n ? ' (готовы ' + n + ' из 3)' : ''}</button>`;
  }

  function trioOverHTML(S) {
    const g = app.game, me = myRole(), meP = S.players[me];
    const st = standings(S);
    const mine = st.find((x) => x.r === me) || { place: 3 };
    const medal = (p) => ['🥇', '🥈', '🥉'][p - 1] || p;
    let emoji, title, sub;
    if (S.reason === 'closed') { emoji = '🚪'; title = 'Комната закрыта'; sub = 'Создатель закрыл комнату до начала игры.'; }
    else {
      emoji = mine.place === 1 ? '🏆' : medal(mine.place);
      title = mine.place === 1 ? (S.winner === 'draw' ? 'Делите первое место!' : 'Победа!') : mine.place + '-е место';
      sub = S.reason === 'rounds' ? `Все ${S.settings.rounds} ${roundsWord(S.settings.rounds)} сыграны.`
        : S.reason === 'leave' ? (meP.left ? 'Вы вышли из игры.' : S.players.host.left ? 'Создатель комнаты вышел — игра окончена.' : 'Соперники покинули игру.')
        : S.winner === 'draw' ? 'Последние игроки выбыли в одном раунде.' : `Последним с жизнями остался(ась) ${esc(S.players[S.winner] ? S.players[S.winner].name : '')}.`;
    }
    const anyLeft = roles(S).some((r) => S.players[r].left);
    const canRe = (S.reason === 'lives' || S.reason === 'rounds') && !anyLeft && roles(S).every((r) => r === me || !g.online || g.online[r] !== false);
    const pend = meP.ready || g.ui.pendingReady;
    const wants = roles(S).filter((r) => r !== me && S.players[r].ready);
    const actions = canRe
      ? (pend ? '<div class="waiting"><span class="dot-pulse"></span> Ждём, когда все согласятся на реванш…</div>' : `<button class="btn big" id="next">${wants.length ? 'Принять реванш' : 'Реванш'}</button>`) + '<button class="btn ghost big" id="leave">В меню</button>'
      : '<button class="btn big" id="leave">В меню</button>';
    const rows = S.reason === 'closed' ? '' : `<table class="trio-table"><thead><tr><th>Место</th><th>Игрок</th>${S.settings.lives ? '<th>Жизни</th>' : ''}<th>Верно</th></tr></thead><tbody>${st.map((x) => {
      const p = S.players[x.r];
      const note = p.left ? ' <span class="muted">· вышел(а)</span>' : p.out ? ` <span class="muted">· выбыл(а) в раунде ${p.outRound}</span>` : '';
      return `<tr class="${x.r === me ? 'me' : ''}"><td class="tt-place">${medal(x.place)}</td><td>${esc(p.name)}${x.r === me ? ' (вы)' : ''}${note}</td>${S.settings.lives ? `<td>${p.lives}</td>` : ''}<td>${okCount(S, x.r)}</td></tr>`;
    }).join('')}</tbody></table>`;
    return `<section class="card over">
      <div class="big-emoji">${emoji}</div><h1>${title}</h1><p class="muted" style="margin:0">${sub}</p>
      ${rows}
      ${canRe && wants.length && !pend ? `<div class="notice" style="margin-bottom:12px">${wants.map((r) => esc(S.players[r].name)).join(' и ')} ${wants.length > 1 ? 'хотят' : 'хочет'} реванш!</div>` : ''}
      <div class="actions" style="justify-content:center">${actions}</div>
    </section>`;
  }

  function overHTML(S) {
    if (isTrio(S)) return trioOverHTML(S);
    const g = app.game;
    const { me, opp, meP, oppP } = names(S);
    const solo = isSolo(S);
    let emoji, title, sub;
    const solved = S.history.filter((h) => h[me]).length;
    if (solo) {
      emoji = solved >= 10 ? '🏆' : solved >= 5 ? '💪' : '📘';
      title = S.reason === 'quit' ? 'Тренировка завершена' : S.reason === 'rounds' ? `Все ${S.settings.rounds} ${roundsWord(S.settings.rounds)} пройдены!` : 'Жизни закончились';
      sub = `Решено ${solved} из ${S.history.length}`;
    } else if (S.reason === 'leave') {
      const iWon = S.winner === me;
      emoji = iWon ? '🏆' : '🏳️'; title = iWon ? 'Победа!' : 'Вы вышли из дуэли';
      sub = iWon ? 'Соперник покинул игру.' : 'Победа присуждена сопернику.';
    } else if (S.reason === 'stop') {
      const ok = (r) => S.history.filter((h) => h[r]).length;
      const who = S.stopBy === me ? 'Вы завершили дуэль' : `${esc(oppP.name)} завершил(а) дуэль`;
      const score = `Верных ответов: ${ok(me)} : ${ok(opp)}`;
      if (S.winner === 'draw') { emoji = '🤝'; title = 'Ничья!'; sub = `${who}. ${score}`; }
      else { const iWon = S.winner === me; emoji = iWon ? '🏆' : '😔'; title = iWon ? 'Победа!' : 'Поражение'; sub = `${who}. ${score}`; }
    } else if (S.reason === 'rounds') {
      const ok = (r) => S.history.filter((h) => h[r]).length;
      const score = (S.settings.lives ? `Жизни: ${meP.lives} : ${oppP.lives} · ` : '') + `верных ответов: ${ok(me)} : ${ok(opp)}`;
      if (S.winner === 'draw') { emoji = '🤝'; title = 'Ничья!'; sub = `Все ${S.settings.rounds} ${roundsWord(S.settings.rounds)} сыграны, счёт равный. ${score}`; }
      else {
        const iWon = S.winner === me;
        const byLives = !!S.settings.lives && meP.lives !== oppP.lives;
        emoji = iWon ? '🏆' : '😔'; title = iWon ? 'Победа!' : 'Поражение';
        sub = `Все ${S.settings.rounds} ${roundsWord(S.settings.rounds)} сыграны. ${iWon ? 'У вас' : 'У соперника'} ${byLives ? 'больше жизней' : S.settings.lives ? 'жизней поровну, но больше верных ответов' : 'больше верных ответов'}. ${score}`;
      }
    } else if (S.winner === 'draw') {
      emoji = '🤝'; title = 'Ничья!'; sub = 'Жизни закончились у обоих в одном раунде.';
    } else {
      const iWon = S.winner === me;
      emoji = iWon ? '🏆' : '😔'; title = iWon ? 'Победа!' : 'Поражение';
      sub = iWon ? `У ${esc(oppP.name)} закончились жизни.` : `У вас закончились жизни. Победил(а) ${esc(oppP.name)}.`;
    }
    const pend = meP.ready || g.ui.pendingReady;
    const oppWants = oppP && oppP.ready;
    let actions = '';
    if (solo) actions = `<button class="btn big" id="again">Сыграть ещё</button><button class="btn ghost big" id="leave">В меню</button>`;
    else if ((S.reason === 'lives' || S.reason === 'rounds') && !g.oppLeft && g.oppOnline !== false) actions = (pend ? `<div class="waiting"><span class="dot-pulse"></span> Ждём ответа соперника на реванш…</div>` : `<button class="btn big" id="next">${oppWants ? 'Принять реванш' : 'Реванш'}</button>`) + `<button class="btn ghost big" id="leave">В меню</button>`;
    else actions = `<button class="btn big" id="leave">В меню</button>`;
    return `<section class="card over">
      <div class="big-emoji">${emoji}</div><h1>${title}</h1><p class="muted" style="margin:0">${sub}</p>
      <div class="stats">
        <div class="stat"><b>${S.history.length}</b><span>раундов</span></div>
        <div class="stat"><b>${solved}</b><span>верно у вас</span></div>
        ${!solo && oppP ? `<div class="stat"><b>${S.history.filter((h) => h[opp]).length}</b><span>верно у соперника</span></div>` : ''}
      </div>
      ${oppWants && !pend && (S.reason === 'lives' || S.reason === 'rounds') ? '<div class="notice" style="margin-bottom:12px">Соперник предлагает реванш!</div>' : ''}
      <div class="actions" style="justify-content:center">${actions}</div>
    </section>`;
  }

  function historyHTML(S) {
    if (!S.history.length) return '';
    const { me, opp, oppP } = names(S);
    const solo = isSolo(S);
    const mk = (v) => (v === undefined ? '<span class="muted">—</span>' : v ? '<span class="mk-ok">✓</span>' : '<span class="mk-bad">✗</span>');
    if (isTrio(S)) {
      const cols = [me].concat(names(S).opps);
      return `<section class="card history" style="margin-top:18px"><h2>История раундов</h2><table><thead><tr><th>Раунд</th><th>Задание</th>${cols.map((r) => '<th>' + (r === me ? 'Вы' : esc(S.players[r].name)) + '</th>').join('')}</tr></thead><tbody>${S.history.map((h) => `<tr><td>${h.round}</td><td>№ ${h.num} · ${esc(titleOf(subjOfState(S), h.num))}</td>${cols.map((r) => '<td>' + mk(h[r]) + '</td>').join('')}</tr>`).join('')}</tbody></table></section>`;
    }
    return `<section class="card history" style="margin-top:18px"><h2>История раундов</h2><table><thead><tr><th>Раунд</th><th>Задание</th><th>Вы</th>${solo ? '' : '<th>' + esc(oppP ? oppP.name : 'Соперник') + '</th>'}</tr></thead><tbody>${S.history.map((h) => `<tr><td>${h.round}</td><td>№ ${h.num} · ${esc(titleOf(subjOfState(S), h.num))}</td><td>${mk(h[me])}</td>${solo ? '' : '<td>' + mk(h[opp]) + '</td>'}</tr>`).join('')}</tbody></table></section>`;
  }

  function bindBody() {
    const g = app.game;
    if ($('#next')) $('#next').onclick = doReady;
    if ($('#leave')) $('#leave').onclick = () => leaveGame(false);
    if ($('#again')) $('#again').onclick = () => { app.game = null; startSolo(); };
    if ($('#toggle-full')) $('#toggle-full').onclick = () => {
      g.ui.showFull = !g.ui.showFull;
      $('#fullsol').classList.toggle('hide', !g.ui.showFull);
      $('#toggle-full').textContent = g.ui.showFull ? 'Свернуть подробное решение ▴' : 'Развернуть подробное решение ▾';
    };
  }

  // Частичное обновление без потери введённого текста
  function patchBody() {
    const g = app.game, S = g.S;
    if (S.phase === 'question') {
      const box = $('#answerbox');
      const me = myRole();
      const rem = S.deadline ? S.deadline - (Date.now() + (me !== 'host' ? g.offset || 0 : 0)) : Infinity;
      const k = (isTrio(S) && !inGame(S, me) ? 'o' : S.players[me].answered ? 'a' : g.ui.pendingAnswer ? 'p' : rem <= 0 ? 't' : 'i');
      if (box && box.dataset.k !== k) {
        box.dataset.k = k;
        if (k === 'i' && $('#ans')) return; // поле ввода уже на месте
        box.innerHTML = answerBoxHTML(S);
        bindAnswerBox(S);
      }
    } else if (S.phase === 'result') {
      const nb = $('#nextbox');
      if (nb) { const tmp = document.createElement('div'); tmp.innerHTML = nextActionsHTML(S); nb.replaceWith(tmp.firstElementChild); bindBody(); }
    } else if (S.phase === 'ready') {
      const rb = $('#readybox');
      const pend = S.players[myRole()].ready || g.ui.pendingReady;
      if (rb) { rb.innerHTML = isTrio(S) ? readyBoxHTML(S) : pend ? '<div class="waiting"><span class="dot-pulse"></span> Ждём, когда соперник нажмёт «Начать»…</div>' : '<button class="btn big" id="next">Начать дуэль</button>'; bindBody(); }
    } else if (S.phase === 'over') {
      const ov = $('.over');
      if (ov) { const tmp = document.createElement('div'); tmp.innerHTML = overHTML(S); ov.replaceWith(tmp.firstElementChild); bindBody(); }
    }
  }

  /* ---------- главный цикл: таймер ---------- */
  setInterval(() => {
    const w = app.watch;
    if (w && w.S && w.S.phase === 'question' && w.S.deadline && app.tab === 'watch') {
      const t = $('#w-timer');
      if (t) { const rem = watchRem(w); t.textContent = fmtTime(rem); t.classList.toggle('low', rem < 10000); }
    }
    const g = app.game;
    if (!g || !g.S) return;
    const S = g.S;
    if (g.mode !== 'guest' && S.phase === 'question') {
      if (checkTimeout(S, g.P, g.mode === 'host')) { commit(); return; }
    }
    if (S.phase === 'question' && S.deadline) {
      if (app.tab === gameTabOf(g)) { renderHud(); patchBody(); }
    }
  }, 250);

  /* ---------- старт ---------- */
  function init() {
    // после перезагрузки остаёмся на той же странице (хранится только в этой вкладке);
    // читаем до первого render(), который сам перезаписывает запись
    const view = sess.get('egeduel:view', null);
    app.inited = true;
    const VIEWS = ['home', 'duel', 'trio', 'solo', 'rules', 'top', 'profile', 'shop'];
    if (view && VIEWS.indexOf(view.tab) >= 0) { app.tab = view.tab; if (SUBJ[view.subject]) app.subject = view.subject; }
    const scrollY = +(sess.get('egeduel:scroll', 0)) || 0;
    $$('nav.tabs button').forEach((b) => (b.onclick = () => { if (app.tab === b.dataset.tab) return; app.tab = b.dataset.tab; app.joinError = ''; render(); animatePage(); window.scrollTo(0, 0); }));
    window.addEventListener('resize', movePill);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(movePill);
    movePill();
    setTimeout(() => { movePill(); const p = $('.tab-pill'); if (p) p.classList.add('anim'); }, 60);
    $('.logo').onclick = () => { if (app.tab === 'home') return; app.tab = 'home'; render(); animatePage(); window.scrollTo(0, 0); };
    $('#me-btn').onclick = () => { if (app.tab === 'profile') return; app.tab = 'profile'; render(); animatePage(); window.scrollTo(0, 0); };
    $('#login-btn').onclick = doLogin;
    $('#streak-btn').onclick = openStreak;
    $('#shop-btn').onclick = () => { if (app.tab === 'shop') return; app.tab = 'shop'; render(); animatePage(); window.scrollTo(0, 0); };
    Cloud.onInvites(showInvites);
    Cloud.onFriendReqs(showFriendReqs);
    Cloud.onFriendAccepted((uid) => {
      Cloud.getProfile(uid).then((fp) => { if (fp) toast('🤝 ' + fp.name + ' принял(а) вашу заявку — теперь вы друзья'); }).catch(() => {});
      refreshFriends();
    });
    const bell = $('#bell-btn');
    bell.onclick = (e) => { e.stopPropagation(); if (app.bellOpen) closeBell(); else openBell(); };
    document.addEventListener('click', (e) => { if (app.bellOpen && !e.target.closest('#bell-pop, #bell-btn')) closeBell(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && app.bellOpen) { closeBell(); bell.focus(); } });
    window.addEventListener('resize', placeBell);
    updateBell();
    setInterval(renderHeaderAvatar, 60000); // смена суток
    Cloud.on(onCloudChange);
    updateGate();
    Cloud.init();
    const tb = $('#theme');
    const applyTheme = (t) => { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); };
    applyTheme(store.get('egeduel:theme', null));
    tb.onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nx = cur === 'dark' ? 'light' : 'dark';
      const apply = () => { applyTheme(nx); store.set('egeduel:theme', nx); };
      tb.classList.remove('spin'); void tb.offsetWidth; tb.classList.add('spin');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { apply(); return; }
      if (!document.startViewTransition) {
        // запасной вариант для браузеров без View Transitions: плавная смена цветов
        document.documentElement.classList.add('theme-fade');
        apply();
        setTimeout(() => document.documentElement.classList.remove('theme-fade'), 600);
        return;
      }
      if (app.themeBusy) return;
      app.themeBusy = true;
      // новая тема «наезжает» диагональной полосой слева направо
      const vt = document.startViewTransition(apply);
      vt.ready.then(() => {
        document.documentElement.animate(
          { clipPath: ['polygon(0 0, 0 0, -25% 100%, -25% 100%)', 'polygon(0 0, 125% 0, 100% 100%, -25% 100%)'] },
          { duration: 750, easing: 'cubic-bezier(.65, 0, .35, 1)', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(() => {});
      const free = () => { app.themeBusy = false; };
      vt.finished.then(free, free);
      setTimeout(free, 1500);
    };
    // ссылка-приглашение ?room=… срабатывает один раз: убираем её из адреса, иначе каждая перезагрузка кидала бы в дуэли
    const room = new URLSearchParams(location.search).get('room');
    let isReload = false;
    try { const nav = performance.getEntriesByType('navigation')[0]; isReload = nav ? nav.type === 'reload' : performance.navigation.type === 1; } catch (e) {}
    if (room) {
      if (!isReload || !view) { app.tab = 'duel'; app.joinCode = Net.normCode(room); app.roomLink = true; }
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
    }
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    render();
    if (scrollY) requestAnimationFrame(() => window.scrollTo(0, scrollY));
    resume();
    window.addEventListener('pagehide', () => sess.set('egeduel:scroll', Math.round(window.scrollY)));
    window.addEventListener('beforeunload', (e) => {
      const g = app.game;
      if (g && g.mode !== 'solo' && g.S && g.S.phase !== 'over' && g.S.phase !== 'lobby') { e.preventDefault(); e.returnValue = ''; }
    });
  }
  window.EGEApp = { rerender: () => { app.rendered = null; render(); }, gate: () => updateGate(), _app: app };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
