/* ---------- новый огонёк: живое пламя ---------- */
.streak-btn.on .flame, .streak-big.on .flame { animation: none !important; transform: none; }
.flame .fl-outer, .flame .fl-inner { transform-box: fill-box; transform-origin: 50% 100%; }
.flame.lit .fl-outer { animation: flameOuter 3.2s ease-in-out infinite; }
.flame.lit .fl-inner { animation: flameInner 2.3s ease-in-out infinite; animation-delay: -.7s; }
.flame.lit { filter: drop-shadow(0 0 4px rgba(255, 120, 30, .35)); }
@keyframes flameOuter {
  0%, 100% { transform: skewX(0deg) scale(1, 1); }
  20% { transform: skewX(-5deg) scale(1.02, 1.03); }
  40% { transform: skewX(-2deg) scale(.99, .98); }
  60% { transform: skewX(4deg) scale(1.01, 1.04); }
  80% { transform: skewX(2deg) scale(1, .99); }
}
@keyframes flameInner {
  0%, 100% { transform: skewX(0deg) scale(1, 1); }
  25% { transform: skewX(6deg) scale(.97, 1.05); }
  50% { transform: skewX(-2deg) scale(1.02, .97); }
  75% { transform: skewX(-6deg) scale(.98, 1.04); }
}
.flame.off { filter: grayscale(1) brightness(.9); opacity: .45; }
.flame.off .fl-outer, .flame.off .fl-inner { animation: none; }
@media (prefers-reduced-motion: reduce) { .flame.lit .fl-outer, .flame.lit .fl-inner { animation: none; } }

/* на главной меню раздела скрыто: сначала выбирают предмет */
nav.tabs.nav-hidden { display: none !important; }
body.on-home .login-btn:not(.hide), body.on-home .login-btn.hide + .streak-btn { margin-left: auto; }

/* ---------- анимированные иконки предметов ---------- */
.sic { width: 40px; height: 40px; display: block; overflow: visible; color: var(--ink); }
.soon-ic .sic { width: 96px; height: 96px; margin: 0 auto; }
.dna-r, .book-flip, .soc-bolt, .soc-spark, .phys-nuc { transform-box: fill-box; }
/* химия: жидкость поднимается, качается волна, всплывают пузырьки */
.chem-liquid { transform-box: view-box; animation: chemFill 5s cubic-bezier(.45, 0, .25, 1) infinite; }
@keyframes chemFill { 0% { transform: translateY(58px); } 45%, 75% { transform: translateY(24px); } 100% { transform: translateY(58px); } }
.chem-wave { transform-box: view-box; animation: chemWave 1.6s linear infinite; }
@keyframes chemWave { from { transform: translateX(0); } to { transform: translateX(-32px); } }
.chem-bub { transform-box: view-box; opacity: 0; animation: chemBub 2.2s ease-in infinite; }
.chem-bub.b2 { animation-delay: .7s; } .chem-bub.b3 { animation-delay: 1.4s; }
@keyframes chemBub { 0% { transform: translateY(14px); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-6px); opacity: 0; } }
/* биология: ступени спирали поворачиваются по очереди — спираль вращается */
.dna-r { transform-origin: 50% 50%; animation: dnaSpin 2.5s ease-in-out infinite alternate; }
@keyframes dnaSpin { from { transform: scaleX(1); } to { transform: scaleX(-1); } }
/* русский: левая обложка перелистывается через корешок */
.book-flip { transform-origin: 100% 50%; animation: bookFlip 4.4s ease-in-out infinite; }
@keyframes bookFlip { 0%, 15% { transform: scaleX(1); } 45%, 65% { transform: scaleX(-1); } 95%, 100% { transform: scaleX(1); } }
.book-page { animation: bookPage 4.4s linear infinite; }
@keyframes bookPage { 0%, 29.9% { opacity: 1; } 30%, 79.9% { opacity: 0; } 80%, 100% { opacity: 1; } }
.book-cover { animation: bookCover 4.4s linear infinite; }
@keyframes bookCover { 0%, 29.9% { opacity: 0; } 30%, 79.9% { opacity: 1; } 80%, 100% { opacity: 0; } }
/* обществознание: молния */
.soc-building { opacity: .85; animation: socFlash 4.2s linear infinite; }
@keyframes socFlash { 0%, 69%, 80%, 100% { fill: currentColor; } 70%, 73.5% { fill: #fff3bf; } }
.soc-bolt { opacity: 0; transform-origin: 50% 0; animation: socBolt 4.2s linear infinite; }
@keyframes socBolt { 0%, 68% { opacity: 0; transform: scaleY(.3); } 69% { opacity: 1; transform: scaleY(1); } 71% { opacity: .25; } 72.5% { opacity: 1; } 76% { opacity: 1; } 79%, 100% { opacity: 0; transform: scaleY(1); } }
.soc-spark { opacity: 0; transform-origin: 50% 50%; animation: socSpark 4.2s ease-out infinite; }
@keyframes socSpark { 0%, 69% { opacity: 0; transform: scale(.2); } 70% { opacity: .9; transform: scale(.6); } 78%, 100% { opacity: 0; transform: scale(1.6); } }
/* физика: ядро пульсирует */
.phys-nuc { transform-origin: 50% 50%; animation: nucPulse 2s ease-in-out infinite; }
@keyframes nucPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
/* математика: треугольник рисуется линией, затем заливается */
.m-outer, .m-inner, .m-tick { stroke-dasharray: 1; stroke-dashoffset: 1; }
.m-outer { animation: mDraw 4.5s cubic-bezier(.6, 0, .3, 1) infinite; }
.m-inner { animation: mDrawIn 4.5s cubic-bezier(.6, 0, .3, 1) infinite; }
.m-tick { animation: mTick 4.5s ease-out infinite; }
.m-fill { opacity: 0; animation: mFill 4.5s ease infinite; }
@keyframes mDraw { 0% { stroke-dashoffset: 1; opacity: 1; } 18%, 82% { stroke-dashoffset: 0; opacity: 1; } 92% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 1; opacity: 0; } }
@keyframes mDrawIn { 0%, 12% { stroke-dashoffset: 1; opacity: 1; } 26%, 82% { stroke-dashoffset: 0; opacity: 1; } 92% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 1; opacity: 0; } }
@keyframes mTick { 0%, 24% { stroke-dashoffset: 1; opacity: 1; } 30%, 82% { stroke-dashoffset: 0; opacity: 1; } 92%, 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes mFill { 0%, 26% { opacity: 0; } 36%, 80% { opacity: .35; } 92%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sic * { animation: none !important; }
  .chem-liquid { transform: translateY(30px); }
  .m-outer, .m-inner, .m-tick { stroke-dashoffset: 0; }
  .book-cover, .soc-bolt, .soc-spark, .chem-bub { opacity: 0; }
}

/* плавное появление окна профиля: фон проявляется, карточка всплывает, содержимое выезжает по очереди */
.modal.anim.show { animation: pm-fade .28s ease both; }
.modal.anim.show .modal-box { animation: pm-pop .42s cubic-bezier(.2, .9, .3, 1.15) both; }
.modal.anim.show .pview > *, .modal.anim.show .pview .pstats > .stat, .modal.anim.show .modal-box > .actions { animation: pm-up .4s cubic-bezier(.22, .9, .3, 1) both; }
.modal.anim.show .pview > .ava, .modal.anim.show .pview > :first-child { animation: pm-ava .5s cubic-bezier(.2, .9, .3, 1.3) .08s both; }
.modal.anim.show .pview > :nth-child(2) { animation-delay: .14s; }
.modal.anim.show .pview > :nth-child(3) { animation-delay: .18s; }
.modal.anim.show .pview > :nth-child(4) { animation-delay: .22s; }
.modal.anim.show .pview > :nth-child(5) { animation-delay: .26s; }
.modal.anim.show .pview > .pstats { animation: none; }
.modal.anim.show .pview .pstats > .stat:nth-child(1) { animation-delay: .3s; }
.modal.anim.show .pview .pstats > .stat:nth-child(2) { animation-delay: .35s; }
.modal.anim.show .pview .pstats > .stat:nth-child(3) { animation-delay: .4s; }
.modal.anim.show .pview .pstats > .stat:nth-child(4) { animation-delay: .45s; }
.modal.anim.show .pview .pstats > .stat:nth-child(n+5) { animation-delay: .5s; }
.modal.anim.show .pview > .pview-show { animation-delay: .52s; }
.modal.anim.show .modal-box > .actions { animation-delay: .56s; }
.modal.anim.closing { animation: pm-fade-out .22s ease both; }
.modal.anim.closing .modal-box { animation: pm-pop-out .22s ease both; }
@keyframes pm-fade { from { background: rgba(0, 0, 0, 0); backdrop-filter: blur(0); } to { background: rgba(0, 0, 0, .45); backdrop-filter: blur(3px); } }
@keyframes pm-fade-out { from { background: rgba(0, 0, 0, .45); } to { background: rgba(0, 0, 0, 0); } }
@keyframes pm-pop { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes pm-pop-out { to { opacity: 0; transform: translateY(12px) scale(.96); } }
@keyframes pm-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pm-ava { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .modal.anim.show, .modal.anim.show *, .modal.anim.closing, .modal.anim.closing * { animation: none !important; } }

.bn-more { display: block; text-align: right; font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 4px; }

/* наблюдатель: ответы игроков и спойлер с разбором */
.w-ans { display: inline-block; max-width: 100%; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; overflow-wrap: anywhere; }
.w-ans.ok { background: var(--ok-soft); color: var(--ok); }
.w-ans.bad { background: var(--bad-soft); color: var(--bad); }
.w-spoil { margin-top: 18px; }
.w-spoil > summary { cursor: pointer; font-weight: 700; }
.w-spoil > summary .muted { font-weight: 600; font-size: 13px; }

/* соло: переключатель Флеш / Тренировка */
.solo-kind { margin: 2px 0 14px; }
.solo-kind button { padding: 9px 18px; font-size: 15px; }
.tper-list { display: grid; gap: 6px; max-height: 340px; overflow: auto; padding-right: 2px; }
.tper { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.tper .badge { flex: none; }
.tper-t { flex: 1; min-width: 0; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper.sm button { width: 32px; height: 32px; font-size: 17px; }
.stepper.sm span { min-width: 34px; }

/* тренировка: полоска с номерами вместо таймера */
.tr-top { margin-bottom: 18px; }
.tr-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tr-head .round-lbl { text-align: left; }
.tr-prog { font-size: 15px; color: var(--ink2); margin-top: 2px; }
.tr-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tr-q { min-width: 46px; height: 46px; padding: 0 6px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--bg2); color: var(--ink2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; transition: transform .12s ease, background .15s ease, border-color .15s ease; }
.tr-q b { font-size: 15px; font-weight: 800; }
.tr-q small { font-size: 10px; font-weight: 700; opacity: .75; }
.tr-q:hover { transform: translateY(-1px); border-color: var(--accent); }
.tr-q.done { background: color-mix(in srgb, var(--accent) 22%, var(--bg2)); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--ink); }
.tr-q.cur { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); color: var(--ink); }
.tr-q.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.tr-q.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.tr-q.skip { border-style: dashed; opacity: .75; }
.tr-q:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tr-saved { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, transparent); font-size: 14px; overflow-wrap: anywhere; }
.tr-nav { margin-top: 14px; }
.tr-stats .stat.ok b { color: var(--ok); }
.tr-stats .stat.bad b { color: var(--bad); }
.tr-item { border: 1px solid var(--line); border-radius: 14px; margin-top: 10px; background: var(--bg); scroll-margin-top: 80px; }
.tr-item > summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; cursor: pointer; list-style: none; }
.tr-item > summary::-webkit-details-marker { display: none; }
.tr-mk { flex: none; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; background: var(--bg2); color: var(--ink3); }
.tr-item.ok .tr-mk { background: var(--ok-soft); color: var(--ok); }
.tr-item.bad .tr-mk { background: var(--bad-soft); color: var(--bad); }
.tr-it { flex: 1; min-width: 160px; font-size: 14px; }
.tr-yours { font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.tr-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.tr-body > .task-text { margin-top: 12px; }
.tr-full { margin-top: 10px; }
.tr-full > summary { cursor: pointer; font-weight: 700; color: var(--accent); }
@media (max-width: 560px) { .tr-head .btn { width: 100%; } }

/* достижения */
.ach-count { font-size: 14px; color: var(--ink2); margin-bottom: 4px; }
.ach-group { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin: 12px 0 6px; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1.5px dashed var(--line); background: var(--bg); min-width: 0; }
.ach-ic { flex: none; width: 42px; height: 42px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; background: var(--bg2); filter: grayscale(1); opacity: .45; }
.ach-txt { min-width: 0; display: flex; flex-direction: column; }
.ach-txt b { font-size: 14px; color: var(--ink3); }
.ach-txt small { font-size: 12px; color: var(--ink3); line-height: 1.3; }
.ach.got { border-style: solid; border-color: color-mix(in srgb, #fcc419 55%, transparent); background: color-mix(in srgb, #fcc419 10%, var(--bg)); }
.ach.got .ach-ic { filter: none; opacity: 1; background: color-mix(in srgb, #fcc419 22%, var(--bg2)); }
.ach.got .ach-txt b { color: var(--ink); }
.ach:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pview-show .ach-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.ach-pop { position: fixed; left: 50%; top: 76px; z-index: 90; display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 16px; background: var(--card); border: 2px solid #fcc419; box-shadow: 0 14px 40px rgba(0,0,0,.35); cursor: pointer; transform: translate(-50%, -20px) scale(.92); opacity: 0; transition: transform .35s cubic-bezier(.2,.9,.3,1.3), opacity .25s ease; max-width: calc(100vw - 24px); }
.ach-pop.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.ach-pop-ic { font-size: 30px; width: 48px; height: 48px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, #fcc419 25%, var(--bg2)); }
.ach-pop small { display: block; font-size: 12px; font-weight: 700; color: #e8a800; }
.ach-pop b { display: block; font-size: 16px; }
@media (prefers-reduced-motion: reduce) { .ach-pop { transition: opacity .2s ease; transform: translate(-50%, 0); } }

/* кнопка Telegram-канала — справа внизу, прячется в играх, как и «Магазин» */
.tg-fab { position: fixed; right: 18px; bottom: 18px; z-index: 40; width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #2aabee; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.22); transition: transform .15s, box-shadow .15s; }
.tg-fab svg { transform: translateX(-1px); }
.tg-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(42,171,238,.4); }
.tg-fab:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.tg-fab.hide { display: none; }
@media (max-width: 600px) { .tg-fab { right: 12px; bottom: 12px; width: 46px; height: 46px; } .tg-fab svg { width: 23px; height: 23px; } }

/* =====================================================================
   ОФОРМЛЕНИЕ В СТИЛЕ КИБЕРСПОРТИВНОЙ ПЛАТФОРМЫ
   Строгие формы (4–6px), тонкие рамки вместо теней, оранжевый акцент,
   свечение только у активных элементов, быстрые переходы 0.15s.
   Этот слой идёт последним и перекрывает старое оформление.
   ===================================================================== */
body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -.005em; }
::selection { background: rgba(255, 85, 0, .35); color: var(--ink); }
a { color: var(--accent-text); }
* { scrollbar-color: var(--bg2) transparent; }

/* типографика: крупные жирные заголовки и цифры, CAPS для мелких подписей */
h1, h2, h3 { font-family: "Inter", sans-serif; font-weight: 800; letter-spacing: -.025em; }
h1 { font-size: 32px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); font-weight: 800; }
.field > label, .lbl, .round-lbl, .pcard-lbl, .p3-cap, .ach-group, .home-kicker, .bl-mh, .history th, .trio-table th, .bn-what, .w-live, .summary dt, .ip-title { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; font-weight: 800; }
.field > label, .lbl { color: var(--ink2); }
.home-kicker { color: var(--accent-text); }
.timer, .code, .stat b, .streak-num, .top-score b, .top-place, .right-ans b, .verdict .what, .pts-btn, .streak-btn, .tr-q b, .badge, .num, .stepper span { font-variant-numeric: tabular-nums; }
.timer { font-weight: 900; letter-spacing: -.02em; font-size: 30px; }
.code { font-weight: 900; color: var(--accent-text); letter-spacing: .14em; }
.stat b { font-weight: 900; font-size: 26px; letter-spacing: -.02em; }
.streak-num, .top-score b { font-weight: 900; color: var(--accent-text); }
.top-place { font-weight: 900; }
.right-ans b { font-weight: 900; color: var(--accent-text); }
.vs { font-weight: 900; letter-spacing: .06em; color: var(--accent-text); }
.logo { font-family: "Inter", sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; font-size: 17px; }
.logo small { text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; font-weight: 700; margin-top: 0; }

/* поверхности: плоские карточки с тонкой рамкой */
.card { border-radius: var(--radius); box-shadow: none; border: 1px solid var(--line); }
header.top { background: color-mix(in srgb, var(--bg) 94%, transparent); border-bottom: 1px solid var(--line); }
.home-hero { background: var(--card); border-left: 3px solid var(--accent); }
.home-logo { border-radius: 8px; box-shadow: none; border: 1px solid var(--line); }
.home-feat, .stat, .sol, .code-box, .versus .pcard, .cal, .bl-text, .bl-opts > div, .bl-match > div > div:not(.bl-mh), .friend-row, .nick-ro, .lp, .tp, .w-p, .bn-item, .tper, .tr-item, .ach, .top-mine, .empty-show, .pcard.tinted, .friend-row.tinted, .notice, .streak-msg, .tr-saved, .task-text .note { border-radius: var(--radius); }
.home-feat { border-top: 2px solid var(--accent); }
.subject { border-radius: var(--radius); border-width: 1px; }
.subject:hover { transform: translateY(-2px); box-shadow: none; }
.subject-ic { border-radius: var(--radius); }
.soon { border-radius: var(--radius); }
.code-box { border: 1px dashed var(--line); background: var(--bg); }
.stat { background: var(--bg); }
.notice { background: var(--bg2); }
.modal { background: rgba(0, 0, 0, .7); }
.modal-box, .gate-box, .bell-pop, .invite-pop, .ach-pop { border-radius: var(--radius); }
.gate { background: var(--bg); }
.gate-box { box-shadow: none; border-top: 3px solid var(--accent); }
.gate-logo, .logo .mark, .logo .mark-img { border-radius: 6px; }
.pe-drawer { box-shadow: none; }
.bell-pop { box-shadow: 0 16px 40px rgba(0, 0, 0, .5); border: 1px solid var(--line); }
.invite-pop { box-shadow: 0 16px 40px rgba(0, 0, 0, .5); border: 1px solid var(--accent); }
.task-img { border-radius: var(--radius); }
.crop-stage { border-radius: var(--radius); }
@keyframes pm-fade { from { background: rgba(0, 0, 0, 0); } to { background: rgba(0, 0, 0, .7); } }
@keyframes pm-fade-out { from { background: rgba(0, 0, 0, .7); } to { background: rgba(0, 0, 0, 0); } }

/* навигация: подчёркивание вместо подложки */
nav.tabs { background: transparent; padding: 0; gap: 2px; border-radius: 0; align-self: stretch; align-items: stretch; }
nav.tabs button { border-radius: 0; padding: 0 16px; text-transform: uppercase; letter-spacing: .07em; font-size: 12.5px; font-weight: 800; color: var(--ink3); transition: color var(--t); }
nav.tabs button:hover, nav.tabs button.on { color: var(--ink); }
.tab-pill { top: auto; bottom: -1px; height: 2px; border-radius: 0; background: var(--accent); box-shadow: 0 0 10px rgba(255, 85, 0, .6); }
.tab-pill.anim { transition: transform .2s ease, width .2s ease, opacity .15s ease; }
@media (max-width: 760px) { nav.tabs { align-self: auto; } nav.tabs button { padding: 10px 2px; font-size: 11.5px; } }

/* кнопки */
.btn { border-radius: var(--r-sm); text-transform: uppercase; letter-spacing: .06em; font-size: 13.5px; font-weight: 800; transition: background-color var(--t), border-color var(--t), color var(--t), box-shadow var(--t), transform .08s; }
.btn:hover { filter: none; background: var(--accent-hover); box-shadow: var(--glow); }
.btn:disabled:hover { background: var(--accent); box-shadow: none; }
.btn.ghost, .btn.danger, .btn.google { border-width: 1px; background: transparent; }
.btn.ghost:hover, .btn.google:hover { background: var(--bg2); border-color: var(--ink3); box-shadow: none; color: var(--ink); }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad); box-shadow: none; }
.btn.ghost:disabled:hover, .btn.danger:disabled:hover { background: transparent; }
.btn.soft { background: var(--accent-soft); color: var(--accent-text); }
.btn.soft:hover { background: rgba(255, 85, 0, .2); box-shadow: none; }
.btn.google { background: var(--card); }
.btn.big { padding: 15px 28px; font-size: 15px; border-radius: var(--r-sm); }
.login-btn { border-radius: var(--r-sm); }
.link { color: var(--accent-text); }

/* поля и переключатели */
.input { border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); transition: border-color var(--t), box-shadow var(--t); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 85, 0, .15); }
.chip { border-radius: var(--r-sm); border-width: 1px; font-size: 13px; transition: all var(--t); }
.chip:hover { border-color: var(--ink3); }
.chip.on { box-shadow: var(--glow); }
.num { border-radius: var(--r-sm); border-width: 1px; transition: background-color var(--t), border-color var(--t), box-shadow var(--t); }
.num:not(:disabled):not(.on):hover { border-color: var(--accent); }
.num.on { box-shadow: var(--glow); }
.seg { border-radius: var(--radius); background: var(--bg); border: 1px solid var(--line); }
.seg button { border-radius: var(--r-sm); text-transform: uppercase; letter-spacing: .06em; font-size: 12.5px; font-weight: 800; transition: background-color var(--t), color var(--t); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 12px rgba(255, 85, 0, .35); }
.stepper { border-radius: var(--r-sm); border-width: 1px; }
.stepper button { transition: background-color var(--t), color var(--t); }
.stepper button:hover { background: var(--accent); color: var(--accent-ink); }
.keys button { border-radius: var(--r-sm); border-width: 1px; transition: border-color var(--t), background-color var(--t); }
.keys button:hover { border-color: var(--accent); }
.theme-btn, .modal-x, .cal-nav, .pe-open { border-radius: var(--r-sm); transition: background-color var(--t), color var(--t), border-color var(--t); }
.theme-btn:hover, .cal-nav:not(:disabled):hover, .modal-x:hover { background: var(--bg2); color: var(--accent-text); }
.pe-open:hover { transform: none; }
.preset.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--accent); }
.card-colors .cc.on { border-color: var(--accent); }

/* шапка: счётчики-плашки */
.streak-btn, .pts-btn, .bell-btn { border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); transition: border-color var(--t), background-color var(--t), color var(--t); }
.streak-btn:hover { transform: none; border-color: var(--accent); }
.bell-btn:hover, .bell-btn[aria-expanded="true"] { background: var(--bg2); border-color: var(--ink3); color: var(--ink); }
.bell-n { background: var(--accent); border-radius: 4px; box-shadow: 0 0 0 2px var(--bg), 0 0 10px rgba(255, 85, 0, .6); }
.me-btn:hover .ava, .me-btn.on .ava { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

/* игра */
.tbar { height: 4px; border-radius: 0; }
.tbar i { box-shadow: 0 0 10px rgba(255, 85, 0, .6); }
.tbar.low i { box-shadow: 0 0 10px rgba(239, 68, 68, .6); }
.badge { border-radius: var(--r-sm); letter-spacing: .02em; }
.badge.p2 { background: var(--bg2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.sent { border-radius: var(--radius); background: var(--accent-soft); color: var(--accent-text); border: 1px solid rgba(255, 85, 0, .3); }
.verdict { border-radius: var(--radius); border-width: 1px; }
.verdict.ok { border-color: rgba(34, 197, 94, .35); border-left: 3px solid var(--ok); }
.verdict.bad { border-color: rgba(239, 68, 68, .35); border-left: 3px solid var(--bad); }
.tp, .w-p { background: var(--bg); }
.tp.me { border: 1px solid var(--accent); box-shadow: var(--glow); }
.w-p.win { border-color: var(--accent); box-shadow: var(--glow); }
.w-live, .w-ans, .lp-tag, .top-you, .friend-row .fr-watch, .tr-mk { border-radius: var(--r-sm); }
.top-row.me { outline: 1px solid var(--accent); box-shadow: var(--glow); }
.top-mine { background: var(--accent-soft); border: 1px solid rgba(255, 85, 0, .3); }
.trio-table tr.me td { background: var(--accent-soft); }
.friend-row { transition: border-color var(--t), background-color var(--t); }
.bn-card, .bn-card .pcard:not(.tinted) { border-radius: var(--radius); }
.bn-card:not(.loading):hover { box-shadow: none; }
.bn-card:not(.loading):hover .pcard:not(.tinted) { border-color: var(--accent); }
.bn-more, .bl-opts b, .bl-match b, .pcard-tag, .my-tag b { color: var(--accent-text); }

/* тренировка */
.tr-q { border-radius: var(--r-sm); border-width: 1px; background: var(--bg); transition: background-color var(--t), border-color var(--t), box-shadow var(--t); }
.tr-q:hover { transform: none; }
.tr-q.done { background: var(--accent-soft); border-color: rgba(255, 85, 0, .4); }
.tr-q.cur { border-color: var(--accent); box-shadow: var(--glow); }
.tr-saved { background: var(--accent-soft); border: 1px solid rgba(255, 85, 0, .3); }
.tr-full > summary { color: var(--accent-text); }

/* огонёк и календарь */
.streak-big { border-radius: var(--radius); }
.cal-cell { border-radius: var(--r-sm); }
.cal-cell.today { box-shadow: inset 0 0 0 1px var(--accent), 0 0 10px rgba(255, 85, 0, .35); }
.hm-c { border-radius: 2px; }
.hm-c.l1 { background: rgba(255, 85, 0, .28); }
.hm-c.l2 { background: rgba(255, 85, 0, .52); }
.hm-c.l3 { background: rgba(255, 85, 0, .78); }
.hm-c.l4 { background: #FF5500; box-shadow: 0 0 8px rgba(255, 85, 0, .5); }
.hm-c.today { outline: 1px solid var(--ink); }

/* достижения: оранжевый вместо золотого */
.ach { border-width: 1px; }
.ach-ic, .ach-pop-ic { border-radius: var(--radius); }
.ach.got { border-color: rgba(255, 85, 0, .45); background: var(--accent-soft); }
.ach.got .ach-ic { background: rgba(255, 85, 0, .18); }
.ach-pop { border: 1px solid var(--accent); box-shadow: 0 14px 40px rgba(0, 0, 0, .5), 0 0 18px rgba(255, 85, 0, .35); }
.ach-pop small { color: var(--accent-text); text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; }
.ach-pop-ic { background: rgba(255, 85, 0, .18); }

/* плавающие кнопки и уведомления */
.shop-fab { border-radius: var(--r-sm); box-shadow: none; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; transition: border-color var(--t), color var(--t), background-color var(--t); }
.shop-fab:hover { transform: none; box-shadow: none; border-color: var(--accent); color: var(--accent-text); }
.tg-fab { border-radius: var(--radius); box-shadow: none; transition: background-color var(--t), box-shadow var(--t); }
.tg-fab:hover { transform: none; background: #1d96d6; box-shadow: 0 0 14px rgba(42, 171, 238, .45); }
.toast { border-radius: var(--r-sm); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-left: 3px solid var(--accent); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.conn { border-radius: var(--r-sm); }

/* фокус с клавиатуры — оранжевая рамка */
:focus-visible { outline-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .tab-pill.anim { transition: none; } }
@media (max-width: 430px) {
  .login-btn:not(.hide) { padding: 7px 9px !important; font-size: 11.5px !important; letter-spacing: .03em; }
  .streak-btn, .pts-btn { padding: 4px 7px 4px 5px; font-size: 13px; }
  .bell-btn { width: 34px; }
  header.top .wrap { gap: 5px; }
}

/* ===== главная: блоки съезжаются на место со всех сторон =====
   Заголовок приходит сверху, карточки слева — по диагонали слева, справа — по диагонали справа,
   средние — снизу. Класс home-in вешается на время анимации при переходе на главную. */
html:has(#main.home-in) { overflow-x: clip; }
#main.home-in .home-hero,
#main.home-in .home-feat,
#main.home-in .home-h2,
#main.home-in .subject { animation: homeFly .95s cubic-bezier(.16, 1, .3, 1) backwards; }
@keyframes homeFly {
  from { opacity: 0; transform: translate(var(--fx, 0), var(--fy, 0)) rotate(var(--fr, 0deg)) scale(.92); }
  60% { opacity: 1; }
  to { opacity: 1; transform: none; }
}
#main.home-in .home-hero { --fy: -45vh; animation-duration: 1s; }
#main.home-in .home-feat:nth-child(1) { --fx: -60vw; --fy: 30vh; --fr: -8deg; animation-delay: .18s; }
#main.home-in .home-feat:nth-child(2) { --fy: 55vh; animation-delay: .24s; }
#main.home-in .home-feat:nth-child(3) { --fx: 60vw; --fy: 30vh; --fr: 8deg; animation-delay: .3s; }
#main.home-in .home-h2 { --fx: -50vw; animation-delay: .34s; }
/* предметы 3×2: левая колонка — с левых углов, правая — с правых, средняя — снизу */
#main.home-in .subject:nth-child(3n+1) { --fx: -65vw; --fy: -30vh; --fr: -10deg; }
#main.home-in .subject:nth-child(3n) { --fx: 65vw; --fy: -30vh; --fr: 10deg; }
#main.home-in .subject:nth-child(3n+2) { --fy: 60vh; }
#main.home-in .subject:nth-child(n+4):nth-child(3n+1) { --fy: 35vh; }
#main.home-in .subject:nth-child(n+4):nth-child(3n) { --fy: 35vh; }
#main.home-in .subject:nth-child(1) { animation-delay: .4s; }
#main.home-in .subject:nth-child(2) { animation-delay: .46s; }
#main.home-in .subject:nth-child(3) { animation-delay: .4s; }
#main.home-in .subject:nth-child(4) { animation-delay: .52s; }
#main.home-in .subject:nth-child(5) { animation-delay: .58s; }
#main.home-in .subject:nth-child(6) { animation-delay: .52s; }
/* телефон: предметы в две колонки — нечётные слева, чётные справа */
@media (max-width: 760px) {
  #main.home-in .subject:nth-child(odd) { --fx: -80vw; --fy: 20vh; --fr: -8deg; }
  #main.home-in .subject:nth-child(even) { --fx: 80vw; --fy: 20vh; --fr: 8deg; }
  #main.home-in .home-feat:nth-child(odd) { --fx: -80vw; --fy: 10vh; }
  #main.home-in .home-feat:nth-child(even) { --fx: 80vw; --fy: 10vh; }
}
@media (prefers-reduced-motion: reduce) {
  #main.home-in .home-hero, #main.home-in .home-feat, #main.home-in .home-h2, #main.home-in .subject { animation: none; }
}

</style>
</head>

<script>
/* ===== Ядро: утилиты, генерация заданий, проверка ответов, графики ===== */
var EGE = (function () {
  const E = { gens: {}, T: String.raw };

  /* ---------- случайность и арифметика ---------- */
  E.rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  E.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  E.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  E.gcd = (a, b) => {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a, b] = [b, a % b];
    return a;
  };
  E.clean = (x) => Math.round(x * 1e9) / 1e9;
  // конечная десятичная дробь с не более чем d знаками
  E.isNice = (x, d = 4) => {
    if (!isFinite(x)) return false;
    const m = Math.round(x * Math.pow(10, d));
    return Math.abs(m / Math.pow(10, d) - x) < 1e-9;
  };
  // число -> строка с десятичной запятой (для текста)
  E.n = (x) => {
    x = E.clean(x);
    let s = String(x);
    if (s.indexOf('e') >= 0) s = x.toFixed(9).replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  };
  // число -> TeX
  E.t = (x) => E.n(x).replace(',', '{,}');
  // дробь p/q в TeX (сокращённая)
  E.frac = (p, q, display) => {
    if (q < 0) { p = -p; q = -q; }
    const g = E.gcd(p, q) || 1;
    p /= g; q /= g;
    if (q === 1) return String(p);
    const f = (display ? '\\dfrac' : '\\frac') + '{' + Math.abs(p) + '}{' + q + '}';
    return (p < 0 ? '-' : '') + f;
  };
  // многочлен из пар [коэффициент, 'x^2'] -> TeX
  E.poly = (terms) => {
    let s = '';
    terms.forEach(([c, v]) => {
      c = E.clean(c);
      if (c === 0) return;
      const neg = c < 0;
      const a = Math.abs(c);
      let body = v ? (a === 1 ? '' : E.t(a)) + v : E.t(a);
      if (s === '') s = (neg ? '-' : '') + body;
      else s += (neg ? ' - ' : ' + ') + body;
    });
    return s || '0';
  };
  // "+ 5" / "- 5" для подстановки
  E.sgn = (c, v = '') => {
    c = E.clean(c);
    if (c === 0) return '';
    const a = Math.abs(c);
    return (c < 0 ? ' - ' : ' + ') + (v && a === 1 ? '' : E.t(a)) + v;
  };
  E.par = (x) => (x < 0 ? '(' + E.t(x) + ')' : E.t(x));

  /* ---------- реестр заданий ---------- */
  // Предметы: у каждого свой реестр заданий. E.gens — профильная математика (как раньше).
  E.gensBy = { math: E.gens, bio: {} };
  E.add = (num, id, fn, opts = {}) => {
    (E.gens[num] = E.gens[num] || []).push(Object.assign({ id, fn }, opts));
  };
  E.addTo = (subj, num, id, fn, opts = {}) => {
    const reg = (E.gensBy[subj] = E.gensBy[subj] || {});
    (reg[num] = reg[num] || []).push(Object.assign({ id, fn }, opts));
  };

  E.state = { used: {}, last: {} };
  E.resetMemory = () => { E.state = { used: {}, last: {} }; };

  E.make = (num, subj = 'math') => {
    const list = (E.gensBy[subj] || {})[num];
    if (!list || !list.length) throw new Error('Нет заданий №' + num);
    const key = subj + ':' + num;
    const used = (E.state.used[key] = E.state.used[key] || {});
    let cand = list.filter((g) => !(g.fixed && used[g.id]));
    if (!cand.length) {
      E.state.used[key] = {};
      cand = list.slice();
    }
    const fresh = cand.filter((g) => g.id !== E.state.last[key]);
    const g = E.pick(fresh.length ? fresh : cand);
    E.state.last[key] = g.id;
    if (g.fixed) E.state.used[key][g.id] = 1;
    for (let tries = 0; tries < 5000; tries++) {
      const t = g.fn();
      if (t) {
        t.num = num;
        t.gid = g.id;
        t.subject = subj;
        t.type = t.type || (subj === 'math' ? (num <= 12 ? 'num' : 'expr') : 'digits');
        t.source = g.bank ? 'bank' : g.fixed ? 'fipi' : 'gen';
        return t;
      }
    }
    throw new Error('Генератор не смог создать задание ' + g.id);
  };

  /* ---------- ответы биологии ---------- */
  // digits — последовательность цифр, порядок важен (соответствие, последовательность, номер)
  // digitset — несколько верных цифр, порядок не важен («выберите три верных утверждения»)
  // word — термин; answer — массив допустимых написаний
  const onlyDigits = (s) => String(s).replace(/[\s,;.\-]/g, '');
  const normWord = (s) => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9-]/g, '');

  /* ---------- разбор выражений ---------- */
  function norm(s) {
    return String(s)
      .toLowerCase()
      .replace(/[−–—]/g, '-')
      .replace(/[×·]/g, '*')
      .replace(/:/g, '/')
      .replace(/pi|пи|п/g, 'π')
      .replace(/корень|sqrt/g, '√')
      .replace(/,/g, '.')
      .replace(/\s+/g, ' ')
      .trim();
  }

    const zeros = [];
    let x = rnd(-6, -4);
    while (x <= 5 && zeros.length < 5) { zeros.push(x); x += rnd(2, 4); }
    if (zeros.length < 3) return null;
    const touchIdx = Math.random() < 0.4 ? rnd(1, zeros.length - 2) : -1;
    // знаки на участках: участок j — до нуля j
    const signs = [pick([1, -1])];
    for (let i = 0; i < zeros.length; i++) signs.push(i === touchIdx ? signs[i] : -signs[i]);
    const xs = [a], ys = [signs[0] * (1.5 + Math.random() * 2.5)];
    zeros.forEach((z, i) => {
      if (i > 0) {
        const mid = (zeros[i - 1] + z) / 2;
        xs.push(mid); ys.push(signs[i] * (1.2 + Math.random() * 2.8));
      }
      xs.push(z); ys.push(0);
    });
    xs.push(b); ys.push(signs[zeros.length] * (1.5 + Math.random() * 2.5));
    const f = E.monoSpline(xs, ys);
    const svg = E.plot({ x0: -8, x1: 8, y0: -5, y1: 5, curves: [{ f, from: a, to: b }], ends: [[a, ys[0], false], [b, ys[ys.length - 1], false]] });
    // классификация нулей
    const kinds = zeros.map((z, i) => {
      const L = signs[i], R = signs[i + 1];
      if (L === R) return 'none';
      return L > 0 ? 'max' : 'min';
    });
    const q = rnd(0, 3);
    const head = T`<p>На рисунке изображён график $y = f'(x)$ — производной функции $f(x)$, определённой на интервале $(${a};\,${b})$.</p>`;
    const listZ = zeros.map((z, i) => `$x = ${z}$ (${kinds[i] === 'max' ? 'знак меняется с «+» на «−» — максимум' : kinds[i] === 'min' ? 'знак меняется с «−» на «+» — минимум' : 'знак не меняется — не экстремум'})`).join('; ');
    if (q <= 1) {
      // отрезок [p;r]
      const p = rnd(-6, -2), r = rnd(2, 6);
      const inside = zeros.map((z, i) => ({ z, k: kinds[i] })).filter((o) => o.z >= p && o.z <= r);
      const want = q === 0 ? pick(['max', 'min', 'ext']) : 'ext';
      const cnt = inside.filter((o) => (want === 'ext' ? o.k !== 'none' : o.k === want)).length;
      const what = want === 'max' ? 'точек максимума' : want === 'min' ? 'точек минимума' : 'точек экстремума';
      return {
        text: head + T`<p>Найдите количество ${what} функции $f(x)$, принадлежащих отрезку $[${p};\,${r}]$.</p>`,
        svg, answer: cnt,
        short: T`${want === 'max' ? 'Точки максимума — где $f\'$ меняет знак с «+» на «−»' : want === 'min' ? 'Точки минимума — где $f\'$ меняет знак с «−» на «+»' : 'Точки экстремума — где $f\'$ меняет знак'}; на $[${p};\,${r}]$ их $${cnt}$.`,
        full: T`<p>${want === 'max' ? 'В точке максимума производная меняет знак с «+» на «−».' : want === 'min' ? 'В точке минимума производная меняет знак с «−» на «+».' : 'В точке экстремума производная обращается в ноль и меняет знак.'} Если производная обращается в ноль, но знак не меняет, экстремума нет.</p><p>Нули производной на графике: ${listZ}.</p><p>На отрезке $[${p};\,${r}]$ подходящих точек: $${cnt}$.</p>` + ans(cnt),
      };
    }
    if (q === 2) {
      // единственная точка экстремума на отрезке
      const ext = zeros.map((z, i) => ({ z, k: kinds[i], i })).filter((o) => o.k !== 'none');
      if (!ext.length) return null;
      const e = pick(ext);
      const prev = ext.filter((o) => o.z < e.z).pop();
      const next = ext.find((o) => o.z > e.z);
      const lo = prev ? prev.z + 1 : -6, hi = next ? next.z - 1 : 6;
      if (lo > e.z || hi < e.z) return null;
      const p = rnd(lo, e.z), r = rnd(e.z, hi);
      if (p === r) return null;
      const w = e.k === 'max' ? 'максимума' : 'минимума';
      return {
        text: head + T`<p>Найдите точку ${w} функции $f(x)$ на отрезке $[${p};\,${r}]$.</p>`,
        svg, answer: e.z,
        short: T`В точке $x = ${e.z}$ производная меняет знак ${e.k === 'max' ? 'с «+» на «−»' : 'с «−» на «+»'}.`,
        full: T`<p>В точке ${w} производная равна нулю и меняет знак ${e.k === 'max' ? 'с «+» на «−»' : 'с «−» на «+»'}.</p><p>Нули производной: ${listZ}.</p><p>На отрезке $[${p};\,${r}]$ такая точка одна: $x = ${e.z}$.</p>` + ans(e.z),
      };
    }
    // знакопостоянный участок -> наибольшее/наименьшее значение на отрезке
    const segs = [];
    for (let i = 0; i <= zeros.length; i++) {
      const L = i === 0 ? a : zeros[i - 1], R = i === zeros.length ? b : zeros[i];
      const lo = Math.ceil(L + (i === 0 ? 0.5 : 0)), hi = Math.floor(R - (i === zeros.length ? 0.5 : 0));
      if (hi - lo >= 2) segs.push({ lo, hi, s: signs[i] });
    }
    if (!segs.length) return null;
    const sg = pick(segs);
    const p = rnd(sg.lo, sg.hi - 2), r = rnd(p + 2, sg.hi);
    const big = Math.random() < 0.5;
    const res = (sg.s > 0) === big ? r : p;
    return {
      text: head + T`<p>В какой точке отрезка $[${p};\,${r}]$ функция $f(x)$ принимает ${big ? 'наибольшее' : 'наименьшее'} значение?</p>`,
      svg, answer: res,
      short: T`На $[${p};\,${r}]$ $f'(x) ${sg.s > 0 ? '>' : '<'} 0$, функция ${sg.s > 0 ? 'возрастает' : 'убывает'}; ответ $${res}$.`,
      full: T`<p>На отрезке $[${p};\,${r}]$ график производной лежит ${sg.s > 0 ? 'выше' : 'ниже'} оси абсцисс, то есть $f'(x) ${sg.s > 0 ? '>' : '<'} 0$ (касание оси в концах отрезка не влияет на монотонность).</p><p>Значит, $f(x)$ на этом отрезке ${sg.s > 0 ? 'возрастает' : 'убывает'}, и ${big ? 'наибольшее' : 'наименьшее'} значение достигается в ${res === r ? 'правом' : 'левом'} конце: $x = ${res}$.</p>` + ans(res),
    };
  });

  E.add(8, 'motion', () => {

        answer: v,
        short: T`$v(t) = x'(t) = ${E.poly([[2 * A, 't'], [B, '']])}$, $v(${t0}) = ${v}$.`,
        full: T`<p>Скорость — производная координаты по времени: $v(t) = x'(t) = ${E.poly([[2 * A, 't'], [B, '']])}$.</p><p>$v(${t0}) = ${2 * A}\cdot ${t0} ${E.sgn(B)} = ${v}$ м/с.</p>` + ans(v),
      };

    const Tm = rnd(3, 12), U = rnd(1, 6), V = rnd(1, 15);

    const p = (Tm - U) / 2; // x = t^3/3 - p t^2 + q t + c
    const q = V - Tm * U;
    const c = rnd(1, 20);
    const vexp = E.poly([[1, 't^2'], [-2 * p, 't'], [q, '']]);
    return {
      text: T`<p>Материальная точка движется прямолинейно по закону $x(t) = \dfrac13 t^3 ${E.sgn(-p, 't^2')} ${E.sgn(q, 't')} ${E.sgn(c)}$, где $x$ — расстояние от точки отсчёта в метрах, $t$ — время в секундах, измеренное с начала движения. В какой момент времени (в секундах) её скорость была равна $${V}$ м/с?</p>`,
      answer: Tm,
      short: T`$v(t) = ${vexp} = ${V}$, $t^2 ${E.sgn(-2 * p, 't')} ${E.sgn(q - V)} = 0$, $t = ${Tm}$ ($t > 0$).`,
      full: T`<p>$v(t) = x'(t) = ${vexp}$.</p><p>$${vexp} = ${V} \iff t^2 ${E.sgn(-2 * p, 't')} ${E.sgn(q - V)} = 0$.</p><p>Корни: $t = ${Tm}$ и $t = ${-U}$. Время неотрицательно, значит $t = ${Tm}$ с.</p>` + ans(Tm),
    };
  });

      answer: d,

      full: T`<p>$\dfrac{1}{d_1} = \dfrac{1}{F} - \dfrac{1}{d_2} = \dfrac{d_2 - F}{F d_2}$.</p><p>$d_1 = \dfrac{F d_2}{d_2 - F} = \dfrac{${F}\cdot ${f}}{${f} - ${F}} = \dfrac{${F * f}}{${f - F}} = ${d}$ см.</p>` + ans(d),

      full: T`<p>Из формулы $l^2 = 12{,}8h$ получаем $h = \dfrac{l^2}{12{,}8}$.</p><p>$h_1 = \dfrac{${l1 * l1}}{12{,}8} = ${t(h(l1))}$ м, $h_2 = \dfrac{${l2 * l2}}{12{,}8} = ${t(h(l2))}$ м.</p><p>Подняться нужно на $${t(h(l2))} - ${t(h(l1))} = ${t(r)}$ м.</p>` + ans(r),

  E.add(10, 'river', () => {

    const S = pick(ks), st = rnd(2, 10);

    if (total > 60) return null;
    const tt = total - st;
    return {
      text: T`<p>Теплоход проходит по течению реки до пункта назначения $${S}$ км и после стоянки возвращается в пункт отправления. Найдите скорость теплохода в неподвижной воде, если скорость течения равна $${u}$ км/ч, стоянка длится $${st}$ часов, а в пункт отправления теплоход возвращается через $${total}$ часов после отплытия из него. Ответ дайте в км/ч.</p>`,
      answer: v,
      short: T`$\dfrac{${S}}{v + ${u}} + \dfrac{${S}}{v - ${u}} = ${tt}$, $v = ${v}$.`,
      full: T`<p>Пусть $v$ км/ч — скорость теплохода в неподвижной воде ($v > ${u}$). В пути теплоход был $${total} - ${st} = ${tt}$ ч.</p><p>$\dfrac{${S}}{v + ${u}} + \dfrac{${S}}{v - ${u}} = ${tt}$.</p><p>$${S}(v - ${u}) + ${S}(v + ${u}) = ${tt}(v^2 - ${u * u})$, то есть $${tt}v^2 - ${2 * S}v - ${tt * u * u} = 0$.</p><p>Положительный корень: $v = ${v}$ (второй корень отрицателен). Проверка: $\dfrac{${S}}{${v + u}} + \dfrac{${S}}{${v - u}} = ${S / (v + u)} + ${S / (v - u)} = ${tt}$.</p>` + ans(v),
    };
  });

        answer: x,

        full: T`<p>Пусть взяли $x$ кг $${a}\%$-го и $y$ кг $${b}\%$-го раствора. Масса смеси в обоих случаях $x + y + ${m}$ кг.</p><p>Вычтем из второго уравнения первое (кислоты больше на $${E.clean(d * m / 100)}$ кг): $${E.clean(d * m / 100)} = ${E.clean((e - c) / 100)}(x + y + ${m})$, откуда $x + y + ${m} = ${M}$, $x + y = ${x + y}$.</p><p>Из первого уравнения: $${a / 100}x + ${b / 100}y = ${E.clean(c * M / 100)}$. Подставим $y = ${x + y} - x$ и найдём $x = ${x}$ (тогда $y = ${y}$).</p>`.replace(/(\d)\.(\d)/g, '$1{,}$2') + ans(x),

      full: T`<p>Горизонтальная асимптота графика — прямая $y = ${q}$, значит $a = ${q}$.</p><p>График проходит через точку $(1;\,${k + q})$: $${k + q} = k + ${E.par(q)}$, откуда $k = ${k}$.</p><p>$f(${m}) = \dfrac{${k}}{${m}} ${E.sgn(q)} = ${t(val)}$.</p>` + ans(val),
    };

        full: T`<p>Первая прямая проходит через точки $(${A[0]};\,${A[1]})$ и $(${B[0]};\,${B[1]})$: $k_1 = \dfrac{${B[1]} - ${E.par(A[1])}}{${B[0]} - ${E.par(A[0])}} = ${t(k1)}$, $y = ${E.poly([[k1, 'x'], [b1, '']])}$.</p><p>Вторая — через $(${Cp[0]};\,${Cp[1]})$ и $(${D[0]};\,${D[1]})$: $k_2 = ${t(k2)}$, $y = ${E.poly([[k2, 'x'], [b2, '']])}$.</p><p>Приравниваем: $${E.poly([[k1, 'x'], [b1, '']])} = ${E.poly([[k2, 'x'], [b2, '']])}$, откуда $x = ${t(X)}$${ord ? T`, $y = ${t(Y)}$` : ''}.</p>` + ans(res),

      full: T`<p>По графику $f(${1 - b}) = 0$: $\log_a(${1 - b} + b) = 0$, значит $${1 - b} + b = 1$, $b = ${b}$.</p><p>$f(${a - b}) = 1$: $\log_a(${a - b} ${E.sgn(b)}) = \log_a ${a} = 1$, значит $a = ${a}$.</p><p>$f(${m}) = \log_{${a}}(${m} ${E.sgn(b)}) = \log_{${a}} ${a ** j} = ${j}$.</p>`.replace(/\((-?\d+) \)/g, '($1)') + ans(j),

  /* ---------------- №12 Наибольшее и наименьшее значение ---------------- */
  E.add(12, 'cubic', () => {
    let r1 = rnd(-6, 6), r2 = rnd(-6, 6);
    if (r1 === r2 || (r1 + r2) % 2) return null;
    if (r1 > r2) [r1, r2] = [r2, r1];
    const S = r1 + r2, P = r1 * r2, C0 = rnd(-20, 20);
    const sg = pick([1, -1]);
    const c3 = sg, c2 = (-3 * S * sg) / 2, c1 = 3 * P * sg;
    const y = (x) => c3 * x ** 3 + c2 * x * x + c1 * x + C0;
    const ex = E.poly([[c3, 'x^3'], [c2, 'x^2'], [c1, 'x'], [C0, '']]);
    const dex = E.poly([[3 * c3, 'x^2'], [2 * c2, 'x'], [c1, '']]);
    const maxP = sg > 0 ? r1 : r2, minP = sg > 0 ? r2 : r1;
    if (Math.random() < 0.5) {
      const isMax = Math.random() < 0.5;
      const res = isMax ? maxP : minP;
      return {
        text: T`<p>Найдите точку ${isMax ? 'максимума' : 'минимума'} функции $y = ${ex}$.</p>`,
        answer: res,
        short: T`$y' = ${dex} = ${3 * sg}(x ${E.sgn(-r1)})(x ${E.sgn(-r2)})$; точка ${isMax ? 'максимума' : 'минимума'} $x = ${res}$.`.replace(/\(x \)/g, '(x)'),
        full: T`<p>$y' = ${dex} = ${3 * sg}(x ${E.sgn(-r1)})(x ${E.sgn(-r2)})$.</p><p>Нули производной: $x = ${r1}$ и $x = ${r2}$. Знаки $y'$: ${sg > 0 ? '«+», «−», «+»' : '«−», «+», «−»'} на промежутках $(-\infty;\,${r1})$, $(${r1};\,${r2})$, $(${r2};\,+\infty)$.</p><p>Точка максимума — $x = ${maxP}$ (смена знака с «+» на «−»), точка минимума — $x = ${minP}$.</p>`.replace(/\(x \)/g, '(x)') + ans(res),
      };
    }
    // значение на отрезке, содержащем одну критическую точку
    const cpt = pick([r1, r2]);
    const other = cpt === r1 ? r2 : r1;
    let p, q;
    if (other > cpt) { p = cpt - rnd(1, 3); q = Math.min(cpt + rnd(1, 3), other - 1); }
    else { q = cpt + rnd(1, 3); p = Math.max(cpt - rnd(1, 3), other + 1); }
    if (!(p < cpt && cpt < q)) return null;
    const isMax = cpt === maxP;
    const vals = [p, cpt, q].map((x) => ({ x, v: y(x) }));
    const res = y(cpt);
    if (Math.abs(res) > 400) return null;
    const word = isMax ? 'наибольшее' : 'наименьшее';
    return {
      _chk: () => { let m = isMax ? -Infinity : Infinity; for (let x = p; x <= q + 1e-9; x += (q - p) / 2000) m = isMax ? Math.max(m, y(x)) : Math.min(m, y(x)); return (isMax ? m <= res + 1e-9 : m >= res - 1e-9) && Math.abs(m - res) < 0.05; },
      text: T`<p>Найдите ${word} значение функции $y = ${ex}$ на отрезке $[${p};\,${q}]$.</p>`,
      answer: res,
      short: T`$y' = 0$ при $x = ${r1}, ${r2}$; на отрезке ${isMax ? 'максимум' : 'минимум'} в $x = ${cpt}$: $y(${cpt}) = ${y(cpt)}$.`,
      full: T`<p>$y' = ${dex} = ${3 * sg}(x ${E.sgn(-r1)})(x ${E.sgn(-r2)})$, нули: $${r1}$ и $${r2}$.</p><p>На отрезке $[${p};\,${q}]$ лежит точка $x = ${cpt}$ — точка ${isMax ? 'максимума' : 'минимума'}.</p><p>Сравним значения: ${vals.map((o) => `$y(${o.x}) = ${o.v}$`).join(', ')}.</p><p>${word[0].toUpperCase() + word.slice(1)} значение: $${res}$.</p>`.replace(/\(x \)/g, '(x)') + ans(res),
    };
  });

  E.add(12, 'exp', () => {

  E.add(12, 'log', () => {

  E.add(16, 'credit_diff', () => {

    if (v === 0) {
      return {
        text: cond + T`<p>Известно, что общая сумма выплат после полного погашения кредита на $${P}\%$ больше суммы, взятой в кредит. Найдите $r$.</p>`,
        type: 'expr', answer: r,
        short: T`Переплата $\dfrac{r(n + 1)}{200}S = \dfrac{${nm + 1}r}{200}S = ${t(P / 100)}S$, $r = ${r}$.`,
        full: base + T`<p>По условию переплата составляет $${P}\%$ от $S$: $\dfrac{${nm + 1}r}{200} = ${t(P / 100)}$, откуда $r = \dfrac{${t(P / 100)}\cdot 200}{${nm + 1}} = ${r}$.</p>` + ans(String(r)),
      };

      text: cond + T`<p>Сумма кредита — $${S}$ тыс. рублей. Найдите общую сумму выплат после полного погашения кредита. Ответ дайте в тысячах рублей.</p>`,
      type: 'expr', answer: total,
      short: T`Выплаты $= S\left(1 + \dfrac{${r}\cdot ${nm + 1}}{200}\right) = ${S}\cdot ${t(1 + P / 100)} = ${t(total)}$ тыс. руб.`,
      full: base.replace(/\br\b/g, String(r)) + T`<p>При $r = ${r}$ переплата равна $\dfrac{${nm + 1}\cdot ${r}}{200}S = ${t(P / 100)}\cdot ${S} = ${t(E.clean(S * P / 100))}$ тыс. руб.</p><p>Общая сумма выплат: $${S} + ${t(E.clean(S * P / 100))} = ${t(total)}$ тыс. руб.</p>` + ans(n(total) + ' тыс. руб.'),
    };
  });

  E.add(16, 'credit_annuity', () => {
    const opts = [
      { r: 10, num: 121, den: 210 },

    const sol = T`<p>Пусть $S$ — сумма кредита, $X$ — ежегодный платёж, $k = 1 + \dfrac{${o.r}}{100} = ${t(k)}$.</p><p>После первого года долг $kS - X$, после второго $k(kS - X) - X = 0$.</p><p>Отсюда $k^2S = X(k + 1)$, то есть $X = \dfrac{k^2 S}{k + 1} = \dfrac{${t(E.clean(k * k))}}{${t(E.clean(k + 1))}}S = \dfrac{${o.num}}{${o.den}}S$.</p>`;
    const fmt = (v) => v.toLocaleString('ru-RU').replace(/\s/g, '\\,');

        full: sol + T`<p>$X = \dfrac{${o.num}}{${o.den}}\cdot ${fmt(S)} = ${fmt(X)}$ рублей.</p>` + ans(X.toLocaleString('ru-RU') + ' руб.'),
      };

    return {
      text: cond + T`<p>Какую сумму клиент взял в банке? Ответ дайте в рублях.</p>`,
      type: 'expr', answer: S,
      short: T`$k^2S = X(k + 1)$, $S = \dfrac{${o.den}}{${o.num}}\cdot ${fmt(X)} = ${fmt(S)}$.`,
      full: sol + T`<p>$S = \dfrac{${o.den}}{${o.num}}X = \dfrac{${o.den}}{${o.num}}\cdot ${fmt(X)} = ${fmt(S)}$ рублей.</p>` + ans(S.toLocaleString('ru-RU') + ' руб.'),
    };
  });

  fixed(17, 'f17_2', {

  fixed(17, 'f17_3', {
    text: T`<p>Две окружности касаются внешним образом в точке $K$. Прямая касается первой окружности в точке $A$, а второй — в точке $B$.</p><p>а) Докажите, что угол $AKB$ прямой.</p><p>б) Найдите $AB$, если радиусы окружностей равны $4$ и $9$.</p>` + NOTE_B,

  iv(18, 'f18_1', {
    text: T`<p>Найдите все значения $a$, при каждом из которых уравнение $|x^2 - 2x - 3| = a$ имеет ровно два корня.</p>` + NOTE18,

      return roots.size === 2;

    full: T`<p><b>а)</b> Да: $2027 = 19 + 2008$, у обоих чисел сумма цифр равна $10$.</p><p><b>б)</b> Число и его сумма цифр дают одинаковые остатки при делении на $9$. Если три числа имеют одинаковую сумму цифр $s$, то каждое сравнимо с $s$ по модулю $9$, и их сумма сравнима с $3s$, то есть делится на $3$ с остатком $0$, $3$ или $6$ по модулю $9$. Но $2027 = 9\cdot 225 + 2$ даёт остаток $2$. Значит, нельзя.</p><p><b>в)</b> Пусть общая сумма цифр равна $s$. Все пять чисел сравнимы с $s$ по модулю $9$, поэтому они различаются хотя бы на $9$ друг от друга, и сумма не меньше $5m + 9(0 + 1 + 2 + 3 + 4) = 5m + 90$, где $m$ — наименьшее из чисел, $m \ge 1$ и $m \equiv s \pmod 9$.</p><p>Переберём $s$: при $s = 1$ наименьшие числа $1, 10, 100, \ldots$ — сумма огромная; $s = 2$: $2 + 11 + 20 + 101 + 110 = 244$; $s = 3$: $3 + 12 + 21 + 30 + 102 = 168$; $s = 4$: $4 + 13 + 22 + 31 + 40 = 110$; при $s \ge 5$ наименьшее число не меньше $5$, и сумма не меньше $5\cdot 5 + 90 = 115 > 110$.</p><p>Значит, наименьшее число — $110$.</p>` + ans('а) да; б) нет; в) 110'),

    full: T`<p>Сумма $k \ge 2$ последовательных чисел, начиная с $m$: $S = \dfrac{k(2m + k - 1)}{2}$, то есть $2S = k(2m + k - 1)$. Множители $k$ и $2m + k - 1$ разной чётности, причём $2m + k - 1 > k$.</p><p><b>а)</b> Да: $2027 = 1013 + 1014$.</p><p><b>б)</b> $2\cdot 2048 = 2^{12}$ нужно разложить в произведение двух множителей разной чётности, больших $1$, — невозможно, так как у $2^{12}$ нет нечётных делителей, кроме $1$. Ответ: нет.</p><p><b>в)</b> $210 = k\cdot(2m + k - 1)$, множители разной чётности, $2 \le k < 2m + k - 1$. Каждый нечётный делитель $d > 1$ числа $105$ даёт ровно одно разложение (меньший из множителей $d$ и $\frac{210}{d}$ берём за $k$). Нечётные делители $105 = 3\cdot 5\cdot 7$: $1, 3, 5, 7, 15, 21, 35, 105$ — без единицы их $7$.</p><p>Например: $52 + 53$, $34 + 35 + 36$, $19 + \ldots + 23$, $12 + \ldots + 18$, $6 + \ldots + 15$, $1 + \ldots + 14$, $15 + 16 + 17 + 18 + 19 + 20$ — всего $7$.</p>` + ans('а) да; б) нет; в) 7'),

/* ===== Банк заданий «100балльного репетитора»: профильная математика =====
   Задания перенесены со скриншотов (папки 1–13 в нумерации банка) и разложены по номерам сайта.
   Каждое задание — отдельный «фиксированный» вариант номера: выпадает вперемешку с генераторами
   и не повторяется, пока не пройдены все фиксированные варианты этого номера. */
(function (E) {
  const R = String.raw;
  const B = [];
